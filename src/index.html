<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拼好镜</title>
<link rel="stylesheet" href="./styles/00-base.css">
<link rel="stylesheet" href="./styles/10-canvas.css">
<link rel="stylesheet" href="./styles/20-menu.css">
<link rel="stylesheet" href="./styles/30-splice.css">
<link rel="stylesheet" href="./styles/40-window.css">
<link rel="stylesheet" href="./styles/50-editor.css">
<link rel="stylesheet" href="./styles/90-effects.css">
</head>
<body>
<div class="topbar">
  <button class="btn primary" id="btnArrange" title="一键整理：所有块自上而下左对齐">整</button>
  <button class="btn" id="btnMenu" title="导入 / 导出">导</button>
  <button class="btn" id="btnZoom" title="画布缩放：Ctrl+滚轮缩放 ｜ 点击恢复 100%">100%</button>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</div>
<div class="canvas" id="canvas"><div class="board" id="board"></div></div>
<!-- v6.16：拖手光点层（被遮挡块） + 拼接光线层 -->
<div id="peekLayer"></div>
<svg id="linkLayer" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="splice-panel" id="splicePanel">
  <div class="sp-head">
    <span class="sp-title" id="spTitle">拼接栏</span>
    <span class="sp-count" id="spCount">0</span>
    <button class="sp-fold" id="spFold" title="折叠 / 展开">⏷</button>
  </div>
  <div class="sp-body" id="spBody"></div>
  <div class="sp-foot">
    <div class="sp-foot-row">
      <button class="btn sp-splice" id="spSplice" title="拼模式：直接拖动任意提示词块到任意单元中（再按「拼」或 Esc 退出）">拼</button>
      <button class="btn primary sp-copy" id="spCopy">⧉ 复制拼接</button>
      <button class="sp-clear" id="spClear">清空</button>
    </div>
    <div class="sp-tpl">
      <div class="sp-tpl-bar">
        <button class="btn sp-tpl-save" id="spTplCustom">⚙ 模板定制</button>
        <button class="sp-tpl-fold" id="spTplFold">模板 ▾</button>
      </div>
      <div class="sp-tpl-list" id="spTplList"></div>
    </div>
  </div>
</div>
<div class="toast hide" id="toast"></div>
<div class="ctx-menu" id="ctxMenu"></div>
<div class="modal-mask hide" id="modalMask">
  <div class="modal">
    <div class="modal-title" id="modalTitle">模板</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalOk">确定</button>
    </div>
  </div>
</div>
<div class="modal-mask hide" id="tplMask">
  <div class="tpl-win" tabindex="-1">   <!-- v6.19：tabindex 使窗口可聚焦（打开即抢走画布焦点） -->
    <div class="tpl-head">
      <span class="tpl-title">模板定制</span>
      <select class="tpl-select" id="tplSelect" title="当前定制的模板"></select>
      <button class="btn primary tpl-new" id="tplNew" title="在当前模板下新建一个模板单元（前缀+提示词块+后缀）">＋ 新建单元</button>
    </div>
    <div class="tpl-body" id="tplBody"></div>
    <div class="tpl-foot">
      <button class="btn primary" id="tplDone">完成</button>
    </div>
  </div>
</div>
<!-- v6.18：模板预览窗口（只读） -->
<div class="modal-mask hide" id="tplPrevMask">
  <div class="tpl-win" tabindex="-1">   <!-- v6.19：tabindex 使窗口可聚焦（打开即抢走画布焦点） -->
    <div class="tpl-head">
      <span class="tpl-title" id="tplPrevTitle">模板预览</span>
      <button class="btn primary" id="tplPrevClose">完成</button>
    </div>
    <div class="tpl-body" id="tplPrevBody"></div>
  </div>
</div>
<!-- v6.12：提示词块独立编辑窗口（点击任意块弹出；风格统一）；v7.6：改造成 coding 编辑器（叠层高亮 + 行号 + 状态栏） -->
<div class="modal-mask hide" id="blkMask">
  <div class="blk-win">
    <div class="modal-title" id="blkTitle">编辑提示词块</div>
    <div class="blk-edit">
      <pre class="blk-hl" aria-hidden="true"><code id="blkHl"></code></pre>
      <textarea class="blk-input" id="blkInput" spellcheck="false" placeholder="输入提示词内容"></textarea>
      <div class="blk-status">
        <span class="grp">行 <b id="stLine">1</b>，列 <b id="stCol">1</b></span>
        <span class="grp">字符 <b id="stLen">0</b></span>
        <span class="grp err"><b id="stErr">0</b> 处错误符号</span>
        <span class="sp"></span>
        <span class="grp">UTF-8 · LF</span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="blkStrip" title="删除所有空行（每行文字紧挨）">移除空行</button>
      <div style="flex:1"></div>
      <button class="btn" id="blkCancel">取消</button>
      <button class="btn primary" id="blkOk">确定</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============ 拼好镜 · 单文件版 · v5.4 ============
   无限画布 + 把手置顶 + 原生 textarea + 无复制全部 + 无序号徽章
   v4：右侧拼接侧边栏（圆角气泡列表 + 复制拼接 + 拖入/按钮收集 + 侧边栏内拖拽排序）
   v5：侧边栏独立悬浮（不挤压画布）；拼接复制块间空行分隔；macOS 浅色视觉重构（Apple 模板）
   v5.1：浅灰/毛玻璃显性化；全部按钮圆润居中
   v5.1.1：顶栏按钮错位修复（等高 + 图标定框）
   v5.1.2：折叠态窄条布局修复（竖排头部）
   v5.2：「＋拼」改「拼」；画布自定义右键菜单
   v5.3：textarea 右键恢复原生菜单；拖拽手势重构（左键=移动块，右键拖把手=拼入手势且块位置不变）；全面高透明圆角毛玻璃
   v5.4：项目更名「拼好镜」；移除面板命名功能（title 字段仅兼容旧数据）；「拼接」改「拼接栏」；折叠态只留单按钮；边缘滚动（鼠标贴画布边缘自动平移，LoL 式）
   v6.0：移除边缘滚动；移除「＋新增块」按钮；左键双击画布空白新增块；滚轮上下滑动画布；一键整理（自上而下左对齐，视角归零）；块宽自适应最长行（文本不自动换行）；拼接栏模板（多预设单元/每单元容纳多 prompt 块/套用=替换当前拼接）
   v6.1：画布移动粘滞感（拖动阻尼+松手轻惯性）；移除空文本框默认文本（placeholder）；Ctrl+右键多选（选中集=新单体：拖把手组拖、右键菜单与块按钮批量拼入/复制/克隆/删除，批量删除可撤销）
   v6.2：Ctrl+右键多选改为 mousedown 层处理（把手轻移不再被拼入手势吞掉、不被抑制标志吞掉，任意位置含 textarea 均可用）；拖动块中滚轮上下滑动画布，拖拽块保持跟随鼠标（滚轮补偿并入落点）
   v6.3：放弃 Ctrl+右键多选（右键恢复纯菜单/拼入手势语义）；新增 Ctrl+左键点块多选（toggle 选中/取消，任意位置含把手与 textarea，不启动拖拽/编辑；选中集=新单体语义保持）
   v6.4：Ctrl+V 粘贴剪贴板文本为 prompt 块（焦点不在输入区时，整段单块，视口中心错位）；模板系统重构——模板单元 = 前缀值 + 内容块列表 + 后缀值（前缀/后缀可空，输出各自独占一行，块间空行分隔），存/改名模态框多字段化，旧模板自动补前缀后缀
   v6.5：移除「存为模板」；新增「模板定制」居中窗口（风格统一）——新建任意数量模板单元，每单元可配置任意数量的前缀值与后缀值（标签式增删，每个值独立一行），内容块多行文本区（空行分隔），支持载入当前拼接；数据模型升级 prefixes/suffixes 数组（旧单值自动迁移）
   v6.6：模板定制窗口仅配置前缀/后缀值（移除内容块）；套用模板 = 套用进拼接栏（不再画布建块，替换清空后创建单元窗口）；拼接栏宽度加倍（280→560）并条目化——平铺块条目 + 模板单元圆角窗口条目（窗口内含前缀行/后缀行与内部 prompt 块圆角小窗）；拼入的块进入「当前激活单元」（套用新模板自动切换，点击窗口头可改）；复制拼接按条目顺序输出（单元=前缀们+块们+后缀们，值独立行）；旧 order 平铺数据迁移为块条目（依旧平铺）
   v6.7：模板定制窗口改为单模板工作模式——每次定制一个模板，窗口中创建的（前缀值/后缀值）皆为同一模板的组成部分；窗口头部模板选择器切换当前编辑对象，「＋ 新建模板」创建新模板并切换
   v6.8：移除右键拖拽拼入手势（浏览器鼠标手势会劫持右键划动，跨设备不可靠）；右键=纯菜单语义，拼入统一走块上「拼」按钮/右键菜单「拼入拼接」/批量拼入
   v6.9：画布缩放——Ctrl+滚轮以光标为基准缩放（25%~400%），顶栏按钮显示当前缩放值、点击恢复默认（缩放+视角归零）；全部鼠标交互坐标换算适配缩放（拖块/平移/双击建块/Ctrl+V/滚轮滚动）
   v6.10：「拼」按钮始终显式（不再 hover 浮现）并改为红色——醒目主操作（v6.8 移除右键拖拽后拼入更依赖按钮）；复制/克隆/删除保持 hover 浮现
   v6.11：套用模板 = 追加单元（同一模板可创建任意数量单元，替换清空语义由「清空拼接」承担）；拼入目标自动切到新单元
   v6.12：模板结构重构——模板包含任意数量「模板单元」（单元 = 前缀值 + 任意数量提示词块 + 后缀值）；定制窗口打开即新建模板（无模板时自动创建），「＋新建模板」移除改为「＋新建单元」；提示词块点击弹出独立编辑窗口（模板定制与拼接栏通用）；套用 = 替换清空 + 模板全部单元按序生成（内嵌块文本 blockTexts）；数据模型 version 10
   v6.13：模板正名——移除模板名称（保存用序号「模板 N」区分）；移除模板定制窗口中的提示词块配置（块不是模板的一部分：单元 = 仅前缀+后缀，中间是拼入块的容器）；套用不再生成内嵌块（blockTexts 移除）；数据模型 version 11
   v6.14：块编辑窗口——高度 = 屏幕高度 80%；宽度自适应最长字行（canvas 测量，上限 94vw 下限 560px，输入实时重测）
   v6.15：一键移除空行（块右键菜单 + 编辑窗口按钮，支持多选批量）；块功能按钮简化为「拼」（拖手顶部，红色常显）+「删」（拖手底部，弱化防误触），复制/克隆收进右键菜单，右侧按钮列移除；修复 v6.6 重构丢失的画布块删除（此前「删除」仅移出拼接引用，块永远留在画布）
   v6.16：拖手被遮挡时朦胧渐变色光点（hover 临时置顶可拖，离开恢复）；拼入光线（画布块 ↔ 拼接栏条目的朦胧渐变色连接线，编辑后仍连）；顶栏简化（整理→「整」，导出/导入收纳进「导」下拉）；prompt 块无边框窗口；新增图片块（仅展示+删按钮左下角 hover 浮现，按分辨率自适应，Ctrl+V 粘贴剪贴板图片，仅会话内不落盘）；方向键移动画布；数据模型 version 12
   v6.17：方向键平滑移动画布（LOL 式加速曲线 + 镜头语义方向修正：按 → 视角右移内容左移）；图片块取消拖手完全无边框，直接按住图片拖动；鼠标中键任意位置拖动 = 全局平移视角；块遮挡关系复查——最近被点击/编辑过的块置顶（active z 6000），遮挡判定按有效层级（peek>drag>active>普通）而非纯几何
   v6.18：方向键多键冲突修复（keyState 逐键记录 + keyDir 派生，快速连按不误清同轴另一键）+ 位移 ÷zoom（高缩放视觉速度恒定）；缩放后强制重绘（fixTextBlur，修复放大后文字模糊）；模板定制单元拖拽排序；模板套用入口优化（套用主题色 + 新增只读预览窗口）；拼接栏单元去模板名改按序号「单元 N」；拼模式（拼接栏「拼」按钮：拖任意提示词块到任意单元松手即拼入，再按/Esc 退出）
   v6.19：独立窗口焦点修复——模板定制/预览窗口打开时 blurActive 抢走画布焦点并聚焦窗口容器（tabindex=-1），打字/方向键不再作用于背景画布；方向键全局豁免（任意 modal-mask 打开时不动画布）；修复 onMouseDown 空白平移分支未豁免独立窗口——点击窗口内元素会抢走焦点（输入框无法编辑）且启动画布平移（模板单元拖拽被 panning 吞掉，dragstart 不触发）
   v6.20：块编辑窗口单行文本允许换行显示（pre-wrap + 断词折行，宽度固定 640 不再按最长行撑宽）；复制拼接输出时前缀值们/后缀值们之间用空行分隔（与块间一致）
   v6.21：移除画面底部说明小字（.hint）；复制拼接空行规则重定义——提示词块不参与空行加入（块间无空行）、**前缀值段上方加一个空行（加在前缀段前，非整段开头）**、后缀值不参与（值间无空行）；其余全部 \n 紧挨连接（含平铺块之间）
   v7.0：全面高质感动效（2026-09-11 拍板：B 灵动精致风 · P0 九项先行）——块创建弹入（双击/粘贴/克隆）/ 删除收拢 / 一键整理 FLIP 错峰排布（320ms premium ease-out）/ 拼入吸入 + 拼接栏条目弹入 / 拼入光线生长（pathLength dash）/ 拖手光点淡入 / 窗口弹开 + 遮罩淡入 / 右键菜单与「导」下拉小弹入 / toast 滑入滑出；全部只动 transform+opacity（GPU 合成）；prefers-reduced-motion 降级直切；拖拽/平移/缩放跟手保持 0 延迟；数据模型零改动（version 12 保持）
   v7.6：独立编辑窗口改造为 coding 编辑器（2026-09-13 拍板三轮）——① 叠层高亮：彩色层 <pre> 托底 + textarea 文字透明（caret/::selection 可见），零依赖自研通用符号 tokenizer，引擎零领域语义（不为符号预设"代表什么内容"）；② 行号栏（绝对定位、不占文本流、软换行续行不编号）；③ 状态栏（行·列·字符·错误符号数）；④ 光标处括号配对高亮；⑤ 等宽字体；⑥「错误符号表」（，,）红色 + 波浪下划线 + 行号标红，优先级高于符号族且不参与配对；七族低饱和配色（对比度 ≥4.76:1）；⑦ 画布块拖手列新增「⤢ 放大」按钮（单块语义、写回不 trim、同步拼接栏与光线）；数据模型零改动（version 12 保持）
   v7.6.1：修复「打开独立编辑器默认全选文本」——`openBlockEditor()` 里的 `ta.select()`（v6.12 起行为）会把整段提示词选中，一打字即被整段替换；改为 `focusCaretEnd(ta)`（光标落文末、无选区，与画布内联编辑一致）+ 开窗后 `hlSyncBox()` 同步彩色层滚动
   v7.7：文本编辑器「台词区」豁免（2026-09-13 拍板 5 问）——被**一行内成对的中文双引号“ ”包住**的错误符号（，/,）一律无视：随所在层级族色正常显示、不计入状态栏错误数、不使行号标红；边界**仅中文双引号**（半角 " 不算）、**未闭合不算台词区**（照旧标红）、引号内再嵌成对符号（{}/() 等）**里层同样豁免**；错误计数改为与着色**同源**（复用分类结果，不再用正则单独数逗号）；数据模型零改动（version 12 保持） */

var LS_KEY = 'storyboard-prompt-panel:v1';
var BACKUP_KEY = LS_KEY + ':backup';
var state = null;
var saveTimer = null;
var toastTimer = null;
var drag = null;      /* 块拖拽：{idx,startX,startY,origX,origY,lastX,lastY,el}；v6.1 支持 group 组拖 */
var panning = null;   /* 画布平移：{startX,startY,panX,panY,x,y} */
var panVel = null;    /* v6.1 画布平移惯性速度 */
var panLooping = false;
var panEndX = 0, panEndY = 0;   /* v6.1 惯性滑行终点（拖动最后目标，防过冲） */
var selected = [];    /* v6.1 多选：选中块 id 列表（内存态，刷新不保留） */
var MIN_BLOCK_W = 140;   /* 空块/短行的最小块宽；块宽随最长行自适应（v6） */

function uid(){ return 'b_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function defaultState(){
  return {
    app: 'storyboard-prompt-panel',
    version: 12,
    zoom: 1,
    title: '未命名分镜',
    pan: { x: 0, y: 0 },
    splice: { items: [], activeUnitId: null },
    collapsed: false,
    templates: [],
    blocks: [{
      id: uid(),
      text: '示例块：这是一段提示词——雨夜小巷，霓虹倒映在水洼里，镜头缓慢推近，侦探撑伞走来。\n\n第二段：角色停步回望，眼神警惕，雨水沿帽沿滑落。\n\n左键拖把手=移动位置；右键菜单或点「拼」可加入右侧拼接栏，按顺序拼成整条 prompt。',
      x: 20,
      y: 20
    }]
  };
}
/* v1 列表数据补网格坐标（仅迁移用） */
function gridPos(i){
  return { x: 20 + (i % 4) * 360, y: 20 + Math.floor(i / 4) * 150 };
}
/* 兼容 v1~v10：补 x/y、pan、zoom、splice、collapsed，标题字段丢弃；块 id 过滤失效引用；v10 模板结构 units 化；v11 模板无名称/无块配置 */
function migrate(d){
  var blocks = d.blocks.filter(function(b){ return b && b.type !== 'image'; }).map(function(b, i){
    var pos = (typeof b.x === 'number' && typeof b.y === 'number') ? { x: b.x, y: b.y } : gridPos(i);
    return { id: b.id || uid(), text: b.text || '', x: pos.x, y: pos.y };
  });   /* v6.16：图片块仅会话内，防御性剔除（须在 map 前过滤——map 已剥离 type 字段） */
  var pan = (d.pan && typeof d.pan.x === 'number' && typeof d.pan.y === 'number') ? { x: d.pan.x, y: d.pan.y } : { x: 0, y: 0 };
  var ids = {};
  blocks.forEach(function(b){ ids[b.id] = 1; });
  /* v6.6：拼接栏条目化——平铺块条目 + 模板单元窗口条目；旧 order 平铺迁移为块条目（依旧平铺） */
  var spliceItems = [];
  if(d.splice && Array.isArray(d.splice.items)){
    spliceItems = d.splice.items.filter(function(it){
      if(it && it.type === 'unit') return typeof it.name === 'string' && Array.isArray(it.blockIds);
      return it && typeof it.id === 'string' && ids[it.id];
    }).map(function(it){
      if(it.type === 'unit'){
        return {
          type: 'unit', id: it.id || uid(), name: it.name,
          prefixes: Array.isArray(it.prefixes) ? it.prefixes.map(String).filter(Boolean) : [],
          suffixes: Array.isArray(it.suffixes) ? it.suffixes.map(String).filter(Boolean) : [],
          blockIds: it.blockIds.filter(function(bid){ return ids[bid]; })
        };
      }
      return { type: 'block', id: it.id };
    });
  }else if(Array.isArray(d.order)){
    spliceItems = d.order.filter(function(id){ return ids[id]; }).map(function(id){ return { type: 'block', id: id }; });
  }
  var lastUnitId = null;
  spliceItems.forEach(function(it){ if(it.type === 'unit') lastUnitId = it.id; });
  var activeUnitId = (d.splice && typeof d.splice.activeUnitId === 'string' && spliceItems.some(function(it){ return it.type === 'unit' && it.id === d.splice.activeUnitId; })) ? d.splice.activeUnitId : lastUnitId;
  /* v6.13（version 11）：模板 = 任意数量单元；单元 = 仅前缀值们 + 后缀值们（提示词块不是模板的一部分，中间为拼入容器）；模板名称移除（序号区分） */
  var templates = Array.isArray(d.templates) ? d.templates.filter(function(t){
    return t && typeof t === 'object';
  }).map(function(t){
    var units = [];
    if(Array.isArray(t.units) && t.units.length){
      units = t.units.filter(function(u){ return u && typeof u === 'object'; }).map(function(u){
        return {
          id: u.id || uid(),
          prefixes: Array.isArray(u.prefixes) ? u.prefixes.map(String).filter(Boolean) : [],
          suffixes: Array.isArray(u.suffixes) ? u.suffixes.map(String).filter(Boolean) : []
        };
      });
    }else{
      units = [{
        id: uid(),
        prefixes: Array.isArray(t.prefixes) ? t.prefixes.map(String).filter(Boolean) : (typeof t.prefix === 'string' && t.prefix ? [t.prefix] : []),
        suffixes: Array.isArray(t.suffixes) ? t.suffixes.map(String).filter(Boolean) : (typeof t.suffix === 'string' && t.suffix ? [t.suffix] : [])
      }];
    }
    return { id: t.id || uid(), units: units };
  }) : [];
  return { app: 'storyboard-prompt-panel', version: 12, title: d.title || '未命名分镜', pan: pan, zoom: (typeof d.zoom === 'number' && d.zoom > 0 && d.zoom <= 4) ? d.zoom : 1, splice: { items: spliceItems, activeUnitId: activeUnitId }, collapsed: !!d.collapsed, templates: templates, blocks: blocks };
}

function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d && d.app === 'storyboard-prompt-panel' && Array.isArray(d.blocks)){
        state = migrate(d);
        document.title = '拼好镜';
        render();
        renderTplList();
        if(d.version < 11) saveNow();
        return;
      }
    }
  }catch(e){}
  state = defaultState();
  document.title = '拼好镜';
  render();
  renderTplList();
  saveNow();
}

function scheduleSave(){ if(saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
function flush(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; } saveNow(); }
/* v6.16：序列化前剔除图片块（图片块仅会话内存在，不落盘不导出） */
function sanitizeState(){
  var c = JSON.parse(JSON.stringify(state));
  c.blocks = (c.blocks || []).filter(function(b){ return b.type !== 'image'; });
  return c;
}
function saveNow(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(sanitizeState())); }
  catch(e){ toast('保存失败：' + e.message); }
}

/* ---- 复制（单块） ---- */
function copyText(text){
  if(window.navigator.clipboard && window.navigator.clipboard.writeText){
    return window.navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return fallbackCopy(text); });
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  try{
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false; }
}

/* ---- toast ---- */
function toast(msg, action){
  var el = document.getElementById('toast');
  el.classList.remove('toast-out');   /* v7：若上轮滑出中，先复位再滑入 */
  el.innerHTML = '';
  var span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if(action){
    var b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = function(){ clearTimeout(toastTimer); el.classList.remove('toast-out'); el.classList.add('hide'); action.fn(); };
    el.appendChild(b);
  }
  el.classList.remove('hide');
  clearTimeout(toastTimer);
  /* v7：自动滑出 = 先播 150ms 淡出，再隐藏（保持滑入/滑出对称） */
  toastTimer = setTimeout(function(){
    el.classList.add('toast-out');
    toastTimer = setTimeout(function(){ el.classList.remove('toast-out'); el.classList.add('hide'); }, 160);
  }, 2600);
}

/* ---- 渲染 ---- */
var canvas, board;

function render(){
  canvas = document.getElementById('canvas');
  board = document.getElementById('board');
  board.innerHTML = '';
  var empty = canvas.querySelector('.empty');
  if(empty) empty.remove();
  if(!state.blocks.length){
    var e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = '双击画布空白处新增块<br><span>无限画布：拖块圆点摆放位置 ｜ 拖空白平移视角 ｜ 滚轮上下滑动 ｜ 方向键移动画布</span>';
    canvas.appendChild(e);
  }else{
    state.blocks.forEach(function(b){
      var card = buildCard(b);
      if(b.id === activeId) card.classList.add('active');   /* v6.17：操作置顶在重建后恢复 */
      board.appendChild(card);
    });
    autoSizeAll();
  }
  applyPan();
  updateZoomBtn();
  renderSplice();
  refreshSel();
  refreshOverlays();   /* v6.16：光点 + 光线 */
}
/* v6.1：多选高亮刷新（DOM 按 dataset.id 同步 .selected） */
/* ---- v6.16：拖手光点（被遮挡块） + 拼接光线（画布块 ↔ 拼接栏） ---- */
function refreshOverlays(){ updatePeekDots(); updateLinks(); }

function updatePeekDots(){
  var layer = document.getElementById('peekLayer');
  if(!layer || !board) return;
  var cards = board.querySelectorAll('.block');
  var rects = [];
  for(var i = 0; i < cards.length; i++){
    var el = cards[i];
    var r = el.getBoundingClientRect();
    /* v6.17：有效层级 peek(3) > drag(2) > active(1) > 普通(0) */
    var eff = el.classList.contains('peek') ? 3 : el.classList.contains('drag') ? 2 : el.classList.contains('active') ? 1 : 0;
    rects.push({ id: el.dataset.id, el: el, x: r.x, y: r.y, w: r.width, h: r.height, eff: eff, idx: i, isImg: el.classList.contains('block-img') });
  }
  var wanted = {};   /* v7.2：本帧需要的光点 { id: {x,y} } */
  for(var a = 0; a < rects.length; a++){
    var A = rects[a];
    if(A.eff >= 2) continue;   /* peek/drag 中的块拖手（或图片）一定可见 */
    /* v6.17：操作区 = 文本块拖手区（左 30px）/ 图片块中心（无拖手） */
    var opR = A.isImg
      ? { x: A.x + A.w / 2 - 9, y: A.y + A.h / 2 - 9, w: 18, h: 18 }
      : { x: A.x, y: A.y, w: 30, h: A.h };
    var covered = false;
    for(var b = 0; b < rects.length; b++){
      if(b === a) continue;
      var B = rects[b];
      if(B.eff >= 3) continue;   /* peek 置顶块不遮挡（自己会被操作） */
      if(B.eff < A.eff) continue;                    /* 层级更低不遮挡 */
      if(B.eff === A.eff && B.idx < A.idx) continue; /* 同层 DOM 靠前不遮挡 */
      if(opR.x + opR.w <= B.x || B.x + B.w <= opR.x || opR.y + opR.h <= B.y || B.y + B.h <= opR.y) continue;
      covered = true;
      break;
    }
    if(covered){
      wanted[A.id] = { x: Math.round(opR.x + opR.w / 2), y: Math.round(opR.y + opR.h / 2) };
    }
  }
  /* v7.2：复用式更新（不再每帧重建 DOM）——
     ① 新出现的光点创建元素并播 dotIn 入场；既有光点只更新位置（拖拽/平移中不重播，消除闪烁与 DOM 开销）；
     ② render() 内部会调用本函数两次（applyPan + refreshOverlays），重建式会让第二批丢掉入场标记，复用式天然免疫 */
  var kids = layer.children;
  var alive = {};
  for(var i2 = kids.length - 1; i2 >= 0; i2--){
    var el2 = kids[i2];
    var id2 = el2.dataset.id;
    if(!wanted[id2]){ layer.removeChild(el2); continue; }   /* 不再需要 → 移除（下次出现重新播入场） */
    el2.style.left = wanted[id2].x + 'px';
    el2.style.top = wanted[id2].y + 'px';
    alive[id2] = 1;
  }
  for(var id3 in wanted){
    if(alive[id3]) continue;
    var d = document.createElement('div');
    d.className = 'peek-dot in';   /* 新出现 → 入场动画 */
    d.dataset.id = id3;
    d.style.left = wanted[id3].x + 'px';
    d.style.top = wanted[id3].y + 'px';
    d.title = '下层块（被遮挡）：悬停临时置顶';
    (function(id4){ d.addEventListener('mouseenter', function(){ peekBlock(id4, true); }); })(id3);
    d.addEventListener('animationend', function(){ d.classList.remove('in'); });   /* 入场播完摘除标记 */
    layer.appendChild(d);
  }
}
/* v6.17：最近操作的块置顶（遮挡关系受操作记录影响） */
var activeId = null;
function bringToFront(id){
  if(activeId === id) return;
  activeId = id;
  var cards = board.querySelectorAll('.block');
  for(var i = 0; i < cards.length; i++){
    cards[i].classList.toggle('active', cards[i].dataset.id === id);
  }
  updatePeekDots();
}
function peekBlock(id, on){
  var card = board.querySelector('.block[data-id="' + id + '"]');
  if(!card) return;
  if(on){ card.classList.add('peek'); }else{ card.classList.remove('peek'); }
  updatePeekDots();
}
/* v6.16：光线层 —— 画布块 ↔ 拼接栏条目（朦胧渐变色贝塞尔曲线） */
function updateLinks(growIds){   /* v7：growIds 存在且含 bid 时该连线播生长动画 */
  var svg = document.getElementById('linkLayer');
  if(!svg) return;
  svg.innerHTML = '';
  if(state.collapsed) return;
  var ns = 'http://www.w3.org/2000/svg';
  var defs = document.createElementNS(ns, 'defs');
  var lg = document.createElementNS(ns, 'linearGradient');
  lg.id = 'lnkGrad';
  lg.setAttribute('x1', '0%'); lg.setAttribute('y1', '0%'); lg.setAttribute('x2', '100%'); lg.setAttribute('y2', '0%');
  var s1 = document.createElementNS(ns, 'stop'); s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', 'rgba(0,113,227,.6)');
  var s2 = document.createElementNS(ns, 'stop'); s2.setAttribute('offset', '100%'); s2.setAttribute('stop-color', 'rgba(124,58,237,.5)');
  lg.appendChild(s1); lg.appendChild(s2);
  defs.appendChild(lg);
  svg.appendChild(defs);
  state.splice.items.forEach(function(it){
    if(it.type === 'block'){
      addLink(svg, ns, it.id, '.sp-item[data-id="' + it.id + '"]', growIds);
    }else if(it.blockIds){
      it.blockIds.forEach(function(bid){ addLink(svg, ns, bid, '.sp-ublock[data-id="' + bid + '"]', growIds); });
    }
  });
  /* v7.3：拼模式拖拽中——源块 → 虚影 的渐变连线（实时跟随，两端最近边 + 双圆点） */
  if(ghostEl && ghostSrcId){
    var gsc = board.querySelector('.block[data-id="' + ghostSrcId + '"]');
    if(gsc){
      var gsr = gsc.getBoundingClientRect();
      var ghr = ghostEl.getBoundingClientRect();
      var pA = { x: gsr.right, y: gsr.top + gsr.height / 2 };
      var pB = { x: ghr.left, y: ghr.top + ghr.height / 2 };
      if(ghr.left < gsr.left){   /* 虚影在源块左侧 → 反转连接边 */
        pA = { x: gsr.left, y: gsr.top + gsr.height / 2 };
        pB = { x: ghr.right, y: ghr.top + ghr.height / 2 };
      }
      var gdx = Math.max(40, Math.abs(pB.x - pA.x) / 2);
      var gpath = document.createElementNS(ns, 'path');
      gpath.setAttribute('class', 'lnk lnk-ghost');   /* v7.3：虚影光线专属标识（便于识别/验收） */
      gpath.setAttribute('d', 'M' + pA.x.toFixed(1) + ',' + pA.y.toFixed(1) + ' C' + (pA.x + gdx).toFixed(1) + ',' + pA.y.toFixed(1) + ' ' + (pB.x - gdx).toFixed(1) + ',' + pB.y.toFixed(1) + ' ' + pB.x.toFixed(1) + ',' + pB.y.toFixed(1));
      gpath.setAttribute('stroke', 'url(#lnkGrad)');
      gpath.setAttribute('opacity', '.8');
      svg.appendChild(gpath);
      var gcA = document.createElementNS(ns, 'circle');
      gcA.setAttribute('class', 'lnk-dot');
      gcA.setAttribute('cx', pA.x.toFixed(1)); gcA.setAttribute('cy', pA.y.toFixed(1)); gcA.setAttribute('r', '3');
      gcA.setAttribute('fill', 'rgba(0,113,227,.75)');
      var gcB = document.createElementNS(ns, 'circle');
      gcB.setAttribute('class', 'lnk-dot');
      gcB.setAttribute('cx', pB.x.toFixed(1)); gcB.setAttribute('cy', pB.y.toFixed(1)); gcB.setAttribute('r', '3');
      gcB.setAttribute('fill', 'rgba(124,58,237,.75)');
      svg.appendChild(gcA); svg.appendChild(gcB);
    }
  }
}
function addLink(svg, ns, bid, sel, growIds){
  var bc = board.querySelector('.block[data-id="' + bid + '"]');
  var sc = document.querySelector(sel);
  if(!bc || !sc) return;
  var br = bc.getBoundingClientRect();
  var sr = sc.getBoundingClientRect();
  if(!br.width || !sr.width) return;   /* 隐藏/折叠中 */
  var x1 = br.right, y1 = br.top + br.height / 2;
  var x2 = sr.left, y2 = sr.top + sr.height / 2;
  var dx = Math.max(50, (x2 - x1) / 2);
  var path = document.createElementNS(ns, 'path');
  path.setAttribute('class', 'lnk');
  if(growIds && growIds.indexOf(bid) >= 0) path.classList.add('lnk-grow');   /* v7：新增连线播生长（pathLength 归一化 dash） */
  path.setAttribute('pathLength', '1');   /* v7：dash 按路径总长归一化（生长动画与长度无关） */
  path.setAttribute('d', 'M' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' C' + (x1 + dx).toFixed(1) + ',' + y1.toFixed(1) + ' ' + (x2 - dx).toFixed(1) + ',' + y2.toFixed(1) + ' ' + x2.toFixed(1) + ',' + y2.toFixed(1));
  path.setAttribute('stroke', 'url(#lnkGrad)');
  path.setAttribute('opacity', '.5');
  svg.appendChild(path);
  var c1 = document.createElementNS(ns, 'circle');
  c1.setAttribute('class', 'lnk-dot');
  c1.setAttribute('cx', x1.toFixed(1)); c1.setAttribute('cy', y1.toFixed(1)); c1.setAttribute('r', '3');
  c1.setAttribute('fill', 'rgba(0,113,227,.6)');
  var c2 = document.createElementNS(ns, 'circle');
  c2.setAttribute('class', 'lnk-dot');
  c2.setAttribute('cx', x2.toFixed(1)); c2.setAttribute('cy', y2.toFixed(1)); c2.setAttribute('r', '3');
  c2.setAttribute('fill', 'rgba(124,58,237,.6)');
  svg.appendChild(c1); svg.appendChild(c2);
  /* v7.5：目标条目左缘「渐变朦胧光线接口」——有画布块光线接入时显示（class 幂等；条目重建后自动重加） */
  if(sc.classList) sc.classList.add('lnk-in');
}

function isSel(id){ return selected.indexOf(id) >= 0; }
/* v6.3：Ctrl+左键点选多选（toggle：已选则取消） */
function toggleSel(card){
  if(!card) return;
  var i = state.blocks.findIndex(function(b){ return b.id === card.dataset.id; });
  if(i < 0) return;
  var id = state.blocks[i].id;
  var at = selected.indexOf(id);
  if(at >= 0){ selected.splice(at, 1); }else{ selected.push(id); }
  refreshSel();
}
function refreshSel(){
  var cards = board.querySelectorAll('.block');
  for(var i = 0; i < cards.length; i++){
    cards[i].classList.toggle('selected', isSel(cards[i].dataset.id));
  }
}
function clearSel(){ selected = []; refreshSel(); }
/* v6.1：批量操作（多选「新单体」：原本对单块的操作对选中集全部可用） */
function findBlockById(id){
  for(var j = 0; j < state.blocks.length; j++){ if(state.blocks[j].id === id) return state.blocks[j]; }
  return null;
}
function actIds(bi){
  /* v6.3：右键块在选中集内 → 批量作用于整个选中集；否则单块 */
  if(bi >= 0 && selected.length > 1 && isSel(state.blocks[bi].id)) return selected.slice();
  if(bi >= 0) return [state.blocks[bi].id];
  return [];
}
function bulkAction(act, ids){
  if(!ids.length) return;
  var lastNew = null;
  if(act === 'splice'){
    ids.forEach(function(id){ spliceAdd(id); });
    toast(ids.length > 1 ? '已加入拼接（' + ids.length + ' 块）' : '已加入拼接');
  }else if(act === 'copy'){
    var parts = ids.map(function(id){ var b = findBlockById(id); return (b && b.text) ? b.text.trim() : ''; }).filter(Boolean);   /* v6.16：图片块无文本，跳过 */
    if(!parts.length){ toast('所选块还没有内容'); return; }
    copyText(parts.join('\n\n')).then(function(ok){
      toast(ok ? (ids.length > 1 ? '已复制 ' + ids.length + ' 块（按序拼接）' : '已复制该块') : '复制失败，请手动全选复制');
    });
  }else if(act === 'clone'){
    var added = 0;
    for(var k = ids.length - 1; k >= 0; k--){   /* 从后往前插，索引不漂移 */
      var idx = state.blocks.findIndex(function(b){ return b.id === ids[k]; });
      if(idx < 0) continue;
      if(state.blocks[idx].type === 'image') continue;   /* v6.16：图片块不可克隆（仅展示） */
      var cp = JSON.parse(JSON.stringify(state.blocks[idx]));
      cp.id = uid();
      cp.x += 28; cp.y += 28;
      state.blocks.splice(idx + 1, 0, cp);
      lastNew = cp;
      added++;
    }
    toast('已克隆 ' + added + ' 块');
  }else if(act === 'strip-blank'){
    var done = 0;
    ids.forEach(function(id){
      var b = findBlockById(id);
      if(!b) return;
      var lines = (b.text || '').split('\n');
      var kept = lines.filter(function(l){ return l.trim() !== ''; });
      var v = kept.join('\n');
      if(v !== (b.text || '')){ b.text = v; done++; }
    });
    toast(done ? (done > 1 ? '已移除空行（' + done + ' 块）' : '已移除空行') : '所选块没有空行');
  }else if(act === 'del'){
      var snap = null;
      if(ids.length > 1) snap = JSON.parse(JSON.stringify({ blocks: state.blocks, splice: state.splice }));   /* 批量删除快照，可撤销 */
      /* v7：先播删除动画（110ms 收拢淡出），再真正移除——块「消失」有质感 */
      ids.forEach(function(id){
        var dc = board.querySelector('.block[data-id="' + id + '"]');
        if(dc) dc.classList.add('del-anim');
      });
      setTimeout(function(){
        spliceRemoveIds(ids);
        state.blocks = state.blocks.filter(function(b){ return ids.indexOf(b.id) < 0; });   /* v6.15 修复：v6.6 重构丢失画布块删除（此前「删除」仅移出拼接引用，块留在画布） */
        selected = [];
        render();
        if(snap){
          toast('已删除 ' + ids.length + ' 块', { label: '撤销', fn: function(){
            state.blocks = snap.blocks;
            state.splice = snap.splice;
            render();
            saveNow();
            toast('已恢复删除的块');
          }});
        }else{
          toast('已删除');
        }
        saveNow();
      }, 130);
      return;   /* v7：删除走动画分支自行收尾（render/saveNow 在动画后执行） */
    }
  selected = [];
  if(act === 'clone' || act === 'del' || act === 'strip-blank'){
    render();
    if(act === 'clone' && lastNew){
      var nc = board.querySelector('.block[data-id="' + lastNew.id + '"]');
      if(nc){ popCard(nc); var nt = nc.querySelector('.block-text'); if(nt) focusCaretEnd(nt); }   /* v7：克隆弹入 */
    }
  }else{
    refreshSel();
  }
  saveNow();
}
/* ---- 拼接侧边栏（v6.6：平铺条目 = 块条目 + 模板单元窗口条目） ---- */
function renderSplice(growIds){   /* v7：growIds = 本次新增连线 id 列表 → 光线生长动画（其余刷新静态） */
  var panel = document.getElementById('splicePanel');

  body.innerHTML = '';

    var e = document.createElement('div');

function countSpliced(){

/* ---- 拼接操作（v6.6） ---- */
function activeUnit(){
  if(state.splice.activeUnitId){
    for(var i = 0; i < state.splice.items.length; i++){
      var it = state.splice.items[i];
      if(it.type === 'unit' && it.id === state.splice.activeUnitId) return it;
    }
  }
  for(var j = state.splice.items.length - 1; j >= 0; j--){
    if(state.splice.items[j].type === 'unit') return state.splice.items[j];
  }
  return null;
}
function isActiveUnit(id){ return state.splice.activeUnitId === id; }
function setActiveUnit(id){ state.splice.activeUnitId = id; renderSplice(); saveNow(); }
/* v7：动效 helper —— 块创建弹入 / 拼入吸入 / 拼接栏条目弹入 */
function popCard(card){
  if(!card) return;
  card.classList.add('pop-in');
  setTimeout(function(){ card.classList.remove('pop-in'); }, 220);
}
function suckBlock(id){
  var c = board.querySelector('.block[data-id="' + id + '"]');

function spliceAdd(id){
  var b = findBlockById(id);
  if(!b || b.type === 'image') return;   /* v6.16：图片块不可拼入（仅展示） */
  var u = activeUnit();
  if(u){ u.blockIds.push(id); }
  else{ state.splice.items.push({ type: 'block', id: id }); }
  renderSplice([id]);   /* v7：光线生长 */
  suckBlock(id);        /* v7：画布块微缩「吸入」 */
  popSpliceEntry(id);   /* v7：条目弹入落定 */

}
function spliceRemoveIds(ids){
  state.splice.items = state.splice.items.filter(function(it){ return !(it.type === 'block' && ids.indexOf(it.id) >= 0); });
  state.splice.items.forEach(function(it){ if(it.type === 'unit') it.blockIds = it.blockIds.filter(function(b){ return ids.indexOf(b) < 0; }); });
}
function spliceRemove(id){
  spliceRemoveIds([id]);
  renderSplice();
  saveNow();
}
function spliceRemoveUnit(uid){
  state.splice.items = state.splice.items.filter(function(it){ return !(it.type === 'unit' && it.id === uid); });
  if(state.splice.activeUnitId === uid) state.splice.activeUnitId = null;
  renderSplice();
  saveNow();
}
function spliceClear(){
  state.splice.items = [];
  state.splice.activeUnitId = null;
  renderSplice();
  saveNow();
}
function copySpliced(){
  var parts = [];
  state.splice.items.forEach(function(it){
    if(it.type === 'block'){
      var b = findBlockById(it.id);
      if(b && b.text.trim()) parts.push(b.text.trim());
    }else{
      var seg = [];
      if(it.prefixes.length) seg.push('\n' + it.prefixes.join('\n'));   /* v6.21 修正：前缀值段上方加入一个空行（加在前缀段前，而非整段开头——前缀不在开头时同样生效） */
      var blks = it.blockIds.map(function(bid){ var bl = findBlockById(bid); return bl ? bl.text.trim() : ''; }).filter(Boolean);
      if(blks.length) seg.push(blks.join('\n'));
      if(it.suffixes.length) seg.push(it.suffixes.join('\n'));
      if(seg.length) parts.push(seg.join('\n'));
    }
  });
  if(!parts.length){ toast('拼接列表是空的，先套用模板或把块加进来'); return; }
  /* v6.21：空行规则——提示词块不参与空行加入（块间无空行）、前缀值段上方加一个空行（加在前缀段前，非整段开头）、后缀值不参与（值间无空行）；其余全部 \n 紧挨连接 */
  copyText(parts.join('\n')).then(function(ok){
    toast(ok ? '已复制拼接（' + countSpliced() + ' 块）' : '复制失败，请手动全选复制');
  });
}
/* ---- 拼接栏模板（v6）：多预设单元（模板），每单元容纳多个 prompt 块；套用=替换当前拼接 ---- */

/* ---- 模板定制窗口（v6.7）：单模板工作模式——每次定制一个模板，窗口中创建的皆为同一模板的组成部分 ---- */
var tplCur = 0;   /* 当前编辑的模板索引 */
function openTplWin(){
  if(!state.templates.length) newTemplate();   /* v6.12：打开定制窗口立刻新建模板（用户拍板） */
  if(tplCur >= state.templates.length || tplCur < 0) tplCur = 0;
  blurActive();   /* v6.19：抢走画布焦点（否则打字/方向键作用于背景画布） */
  document.getElementById('tplMask').classList.remove('hide');
  renderTplWin();
  var win = document.querySelector('#tplMask .tpl-win');
  if(win && win.focus) win.focus();
}
function closeTplWin(){

  saveNow();
}
function renderTplSelect(){
  var sel = document.getElementById('tplSelect');
  sel.innerHTML = '';
  if(!state.templates.length){ tplCur = -1; return; }
  state.templates.forEach(function(t, i){
    var o = document.createElement('option');
    o.value = i;
    o.textContent = '模板 ' + (i + 1);   /* v6.13：序号区分 */
    sel.appendChild(o);
  });
  var oNew = document.createElement('option');   /* v6.12：新建模板入口收进下拉（按钮形态移除） */
  oNew.value = '-1';
  oNew.textContent = '＋ 新建模板…';
  sel.appendChild(oNew);
  sel.value = String(Math.max(0, tplCur));
}
/* v6.12：模板 = 容器，包含任意数量「模板单元」（单元 = 前缀 + 提示词块 + 后缀） */
function newUnitObj(){
  return { id: uid(), prefixes: [], blocks: [], suffixes: [] };
}
function newTemplate(){
  var t = { id: uid(), units: [newUnitObj()] };
  state.templates.push(t);
  tplCur = state.templates.length - 1;
  renderTplWin();
  renderTplList();
  saveNow();
  return t;
}
function newUnit(){
  var t = state.templates[tplCur];
  if(!t){ newTemplate(); t = state.templates[tplCur]; }
  t.units.push(newUnitObj());
  renderTplWin();
  renderTplList();
  saveNow();
}
function renderTplWin(){
  renderTplSelect();
  var body = document.getElementById('tplBody');
  body.innerHTML = '';
  if(!state.templates.length){
    var e = document.createElement('div');

    body.appendChild(e);
    return;
  }
  var t = state.templates[tplCur];
  if(!t || !Array.isArray(t.units)){ tplCur = 0; t = state.templates[0]; }
  if(!t.units.length) t.units.push(newUnitObj());
  /* v6.13：模板名称已移除（序号区分）；直接渲染全部单元卡片（从上到下排列） */
  t.units.forEach(function(u, i){ body.appendChild(tplUnitCard(t, u, i)); });
}
/* v6.12：模板单元卡片 = 前缀值 + 提示词块（任意数量）+ 后缀值 */
/* v6.18：单元卡片可拖拽排序（HTML5 DnD） */
function tplUnitCard(t, u, idx){
  var card = document.createElement('div');
  card.className = 'tpl-card';
  card.draggable = true;
  card.addEventListener('dragstart', function(e){
    e.dataTransfer.setData('text/plain', String(idx));
    e.dataTransfer.effectAllowed = 'move';
    card.classList.add('dragging');
  });
  card.addEventListener('dragend', function(){
    card.classList.remove('dragging');
    var cards = document.querySelectorAll('.tpl-card.drag-over');
    for(var i = 0; i < cards.length; i++) cards[i].classList.remove('drag-over');
  });
  card.addEventListener('dragover', function(e){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    card.classList.add('drag-over');
  });
  card.addEventListener('dragleave', function(){ card.classList.remove('drag-over'); });
  card.addEventListener('drop', function(e){
    e.preventDefault();
    card.classList.remove('drag-over');
    var from = parseInt(e.dataTransfer.getData('text/plain'), 10);
    if(isNaN(from) || from === idx) return;
    var units = t.units;
    var moved = units.splice(from, 1)[0];
    units.splice(idx, 0, moved);   /* v6.18 修正：插到目标卡片位置（移除后索引自然对齐） */
    renderTplWin();
    renderTplList();
    scheduleSave();
  });
  var head = document.createElement('div');
  head.className = 'tpl-card-head';
  var no = document.createElement('div');
  no.className = 'tpl-unit-no';
  no.textContent = '单元 ' + (idx + 1);
  head.appendChild(no);
  var hint = document.createElement('span');
  hint.className = 'tpl-drag-hint';
  hint.textContent = '≡ 拖动排序';
  head.appendChild(hint);
  card.appendChild(head);
  card.appendChild(tplChipsRow('前缀值（每个独立一行）', u.prefixes));
  card.appendChild(tplChipsRow('后缀值（每个独立一行）', u.suffixes));   /* v6.13：提示词块不是模板定制的一部分（中间为拼入容器） */
  var del = document.createElement('button');
  del.className = 'tpl-block-op danger';
  del.textContent = '删除本单元';
  del.style.alignSelf = 'flex-start';
  del.addEventListener('click', function(){
    var ui = t.units.findIndex(function(x){ return x.id === u.id; });
    if(ui >= 0){ t.units.splice(ui, 1); renderTplWin(); renderTplList(); scheduleSave(); }
  });
  card.appendChild(del);
  return card;
}
function tplChipsRow(label, arr){
  var wrap = document.createElement('div');
  var lbl = document.createElement('div');
  lbl.className = 'tpl-lbl';
  lbl.textContent = label;
  wrap.appendChild(lbl);
  var chips = document.createElement('div');
  chips.className = 'tpl-chips';
  arr.forEach(function(v, vi){
    var c = document.createElement('span');
    c.className = 'tpl-chip';
    c.textContent = v;
    var x = document.createElement('button');
    x.className = 'tpl-chip-x';
    x.textContent = '×';
    x.title = '删除该值';
    x.addEventListener('click', function(){ arr.splice(vi, 1); renderTplWin(); renderTplList(); scheduleSave(); });
    c.appendChild(x);
    chips.appendChild(c);
  });
  wrap.appendChild(chips);
  var add = document.createElement('button');
  add.className = 'tpl-add';
  add.textContent = '+ 添加' + (label.indexOf('前缀') === 0 ? '前缀' : '后缀');
  add.addEventListener('click', function(){
    var inp = document.createElement('input');
    inp.className = 'tpl-add-input';
    inp.placeholder = '输入值后回车';
    add.style.display = 'none';
    wrap.appendChild(inp);
    inp.focus();
    var commit = function(){
      if(inp.dataset.done) return;
      inp.dataset.done = '1';
      var v = inp.value.trim();
      if(v){ arr.push(v); renderTplWin(); renderTplList(); scheduleSave(); }
      else{ renderTplWin(); }
    };
    inp.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ commit(); }
      else if(e.key === 'Escape'){ renderTplWin(); }
    });
    inp.addEventListener('blur', commit);
  });
  wrap.appendChild(add);
  return wrap;
}

function applyTemplate(id){
  var t = state.templates.find(function(x){ return x.id === id; });
  if(!t) return;
  /* v6.13：套用 = 替换清空 + 模板全部单元按序生成（单元 = 前缀+空块区+后缀，块由拼入填充）；拼入目标 = 第一个单元 */
  if(!t.units || !t.units.length){ toast('该模板还没有单元：先到「模板定制」添加单元'); return; }
  var ti = state.templates.findIndex(function(x){ return x.id === id; });
  var tname = '模板 ' + (ti + 1);   /* v6.13：模板序号名 */
  var items = t.units.map(function(u){
    return { type: 'unit', id: uid(), name: tname, prefixes: u.prefixes.slice(), suffixes: u.suffixes.slice(), blockIds: [] };
  });
  state.splice.items = items;
  state.splice.activeUnitId = items[0].id;
  renderSplice();
  renderTplList();
  saveNow();
  toast('已套用模板「' + tname + '」（' + items.length + ' 个单元），拼入的块进入第一个单元');
}
/* v6.18：模板预览（只读）——查看模板的单元结构（前缀/块区/后缀） */
function previewTemplate(ti){
  var t = state.templates[ti];
  if(!t) return;
  document.getElementById('tplPrevTitle').textContent = '模板 ' + (ti + 1) + ' 预览';
  var body = document.getElementById('tplPrevBody');
  body.innerHTML = '';

/* ==================== v7.6 coding 编辑器引擎（叠层高亮 + 行号栏 + 状态栏 + 错误标记） ====================
   设计：划分依据 = 文本中出现的符号本身（Unicode 标点/符号）；引擎零领域语义（不为任何符号预设"代表什么内容"）。
   规则：R0 错误符号表（，,）→ 红 + 波浪下划线 + 行号标红；优先级最高；不参与括号配对
        R0.5 台词区豁免（v7.7）：被**一行内成对的中文双引号“ ”包住**的错误符号一律无视——随所在层级族色正常显示、
             不计入状态栏错误数、不使行号标红。边界＝仅中文双引号（半角 " 不算）；**未闭合不算台词区**（照旧标红）；
             判定按「祖先链含双引号」（引号内再嵌 {}/() 等成对符号，里层也豁免）
        R1 成对符号包裹的成分 → 括符与其内文本同族色
        R2 嵌套 → 内层覆盖外层（最近的开符号决定）
        R3 其余符号（句读/运算符/箭头…）→ 配对区域内随该族色，区域外着句读色
        R4 未闭合开符号 → 至行尾着该族色（换行即重置）
        R5 其余正文 → 叙述专属墨蓝（= 彩色层基线色，不产生 span）
   ================================================================================================== */
var HL_ERR = {'，':1, ',':1};                                  /* 错误符号表（常量，加一个字符即可扩展） */
var HL_DLG = {'“':'”'};                                       /* v7.7 台词区边界表（成对中文双引号，加一对即扩展；未闭合不生效） */
var HL_DLG_OPEN = {};                                          /* 台词区闭合符 → 开启符（由 HL_DLG 生成） */
for(var _dk in HL_DLG) HL_DLG_OPEN[HL_DLG[_dk]] = _dk;
var HL_PAIRS = {'{':'}','（':'）','(' : ')' ,'<':'>','〈':'〉','《':'》','「':'」','『':'』','【':'】','〔':'〕','[':']','［':'］','“':'”','‘':'’'};
var HL_TOGGLE = {'"':1, "'":1, '`':1};
var HL_CLOSERS = {};
for(var _hk in HL_PAIRS) HL_CLOSERS[HL_PAIRS[_hk]] = _hk;
function hlFamOf(ch){
  if('{}'.indexOf(ch) >= 0) return 'brace';
  if('<>〈〉'.indexOf(ch) >= 0) return 'angle';
  if('()（）'.indexOf(ch) >= 0) return 'paren';
  if('【】〔〕'.indexOf(ch) >= 0) return 'lent';
  if('[]［］'.indexOf(ch) >= 0) return 'square';
  if('《》'.indexOf(ch) >= 0) return 'title';
  if('「」『』“”‘’"\'`'.indexOf(ch) >= 0) return 'quote';
  return 'punct';
}
var HL_SYM = /[\p{P}\p{S}]/u;
/* v7.7 台词区掩码：一行内成对中文双引号“ ”包住的字符 → 1（含更内层嵌套；未闭合的开引号不生效）
   实现：行内深度配对出闭合区间 → 差分区累计覆盖数（O(n)，不做区间双重循环，嵌套区间亦正确） */
function hlDialogueMask(text){
  var n = text.length, diff = new Int32Array(n + 1), m = new Uint8Array(n), st = [], i, ch, o, acc = 0;
  for(i = 0; i < n; i++){
    ch = text.charAt(i);
    if(ch === '\n'){ st.length = 0; continue; }                                  /* 换行重置：跨行不成对 → 未闭合不生效 */
    if(HL_DLG[ch]) st.push(i);
    else if(HL_DLG_OPEN[ch] && st.length){ o = st.pop(); diff[o + 1]++; diff[i]--; }  /* 闭合对 → 标记内部区间 [o+1, i-1] */
  }
  for(i = 0; i < n; i++){ acc += diff[i]; if(acc > 0) m[i] = 1; }
  return m;
}
/* 逐字符分类：返回长度 = 文本长度的族名数组 */
function hlClassify(text){
  var fam = new Array(text.length), stack = [], i, ch, t, dlg = hlDialogueMask(text);
  function top(){ return stack.length ? stack[stack.length - 1] : null; }
  for(i = 0; i < text.length; i++){
    ch = text.charAt(i);
    if(ch === '\n'){ stack.length = 0; fam[i] = 'body'; continue; }              /* R4：换行重置 */
    if(HL_ERR[ch] && !dlg[i]){ fam[i] = 'err'; continue; }                       /* R0：不参与配对（v7.7：台词区内豁免，继续走 R1~R5 随层级族色） */
    if(!HL_SYM.test(ch)){ t = top(); fam[i] = t ? t.fam : 'body'; continue; }    /* R5 / R1 */
    if(HL_PAIRS[ch]){ fam[i] = hlFamOf(ch); stack.push({ch:ch, fam:fam[i]}); }
    else if(HL_CLOSERS[ch]){
      t = top();
      if(t && HL_PAIRS[t.ch] === ch){ stack.pop(); fam[i] = t.fam; } else fam[i] = 'punct';
    } else if(HL_TOGGLE[ch]){
      t = top();
      if(t && t.ch === ch){ stack.pop(); fam[i] = t.fam; }
      else { fam[i] = hlFamOf(ch); stack.push({ch:ch, fam:fam[i]}); }
    } else { t = top(); fam[i] = t ? t.fam : 'punct'; }                          /* R3 */
  }
  return fam;
}
/* 括号配对（coding 语义）：光标紧邻的括号 → 配对两端索引；不跨行 */
function hlFindMatch(text, caret){
  var cands = [caret - 1, caret], c, p, ch, i, j, d;
  for(c = 0; c < cands.length; c++){
    p = cands[c];
    if(p < 0 || p >= text.length) continue;
    ch = text.charAt(p);
    if(HL_ERR[ch]) continue;
    if(HL_PAIRS[ch]){
      d = 0;
      for(i = p; i < text.length; i++){
        var x = text.charAt(i);
        if(x === '\n') break;
        if(x === ch) d++;
        else if(x === HL_PAIRS[ch]){ d--; if(!d) return [p, i]; }
      }
    } else if(HL_CLOSERS[ch]){
      var open = HL_CLOSERS[ch]; d = 0;
      for(j = p; j >= 0; j--){
        var y = text.charAt(j);
        if(y === '\n') break;
        if(y === ch) d++;
        else if(y === open){ d--; if(!d) return [j, p]; }

function hlEsc(s){ return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
/* 逐行渲染：行号栏 + 族色 + 错误标记 + 配对高亮 */
function hlToHTML(text, match, fam){
  fam = fam || hlClassify(text);                              /* v7.7：可传入预分类结果（与状态栏计数同源，避免重复分类） */
  var lines = text.split('\n'), idx = 0, html = '', li, line, lineHasErr, body, i, j, f, q, g, isM, cur, curM, parts, pi, mm, ss;
  for(li = 0; li < lines.length; li++){
    line = lines[li]; lineHasErr = false; body = ''; i = 0;
    while(i < line.length){
      f = fam[idx + i]; j = i;
      while(j < line.length && fam[idx + j] === f) j++;
      cur = ''; curM = false; parts = [];
      for(q = i; q < j; q++){
        g = idx + q; isM = !!(match && (g === match[0] || g === match[1]));
        if(isM !== curM && cur){ parts.push([curM, cur]); cur = ''; }
        curM = isM; cur += hlEsc(line.charAt(q));

      if(cur) parts.push([curM, cur]);
      for(pi = 0; pi < parts.length; pi++){
        mm = parts[pi][0]; ss = parts[pi][1];
        if(f === 'body' && !mm){ body += ss; }

      }

          + (line.length ? body : '\u200b') + '</div>';           /* 空行补零宽字符，防塌陷 */
    idx += line.length + 1;
  }
  return html;
}

  /* v7.4 修复：cloneNode 会连原块的 inline 定位样式（left/top = 画布坐标）一起复制，
     而 inline 优先级高于 CSS 类的 left:0 → 虚影整体错位（实测偏差 ≈ 块坐标值）。
     必须显式归零/清空这些继承来的 inline 属性。 */
  g.style.left = '0px';
  g.style.top = '0px';
  g.style.transform = '';
  g.style.transition = 'none';
  g.style.transitionDelay = '0ms';
  g.style.width = card.offsetWidth + 'px';
  g.style.height = card.offsetHeight + 'px';
  var src = card.querySelector('.block-text'), dst = g.querySelector('.block-text');
  if(src && dst){ dst.value = src.value; dst.setAttribute('readonly', ''); }   /* cloneNode 不复制用户输入的 value */
  document.body.appendChild(g);
  return g;
}
function moveGhost(x, y){
  if(!ghostEl) return;
  ghostEl.style.transform = 'translate(' + Math.round(x - ghostOffX) + 'px,' + Math.round(y - ghostOffY) + 'px)';
}
function destroyGhost(){
  if(ghostEl){ ghostEl.remove(); ghostEl = null; }
  ghostSrcId = null;
  var ss = document.querySelectorAll('.splice-src');
  for(var i = 0; i < ss.length; i++) ss[i].classList.remove('splice-src');
  updateLinks();
}
/* v6.18：拼模式投放（mouseup 在单元上 → 拼入该单元） */
function spliceDropAt(x, y, ids){
  if(!spliceMode || !ids || !ids.length) return;
  var el = document.elementFromPoint(x, y);
  var ue = el && el.closest ? el.closest('.sp-unit') : null;
  if(!ue) return;
  var unit = state.splice.items.find(function(it){ return it.type === 'unit' && it.id === ue.dataset.id; });
  if(!unit) return;
  var added = 0;
  var addedIds = [];   /* v7：动效目标 = 本次实际加入的块 */
  ids.forEach(function(id){
    var b = findBlockById(id);
    if(!b || b.type === 'image') return;   /* 图片块不可拼入 */
    if(unit.blockIds.indexOf(id) < 0){ unit.blockIds.push(id); added++; addedIds.push(id); }
  });
  clearDropTarget();
  if(added){
    renderSplice(addedIds);   /* v7：光线生长 */
    addedIds.forEach(function(id){ suckBlock(id); popSpliceEntry(id); });   /* v7：吸入 + 条目弹入 */
    saveNow();
    toast('已拼入' + (added > 1 ? ' ' + added + ' 块到' : '') + '单元 ' + (state.splice.items.indexOf(unit) + 1));
  }
}
/* v6.17：平移启动（拖空白 / 中键拖动共用） */
function panStart(clientX, clientY){
  panning = { startX: clientX, startY: clientY, panX: state.pan.x, panY: state.pan.y, x: state.pan.x, y: state.pan.y, lastX: clientX, lastY: clientY };
  canvas.classList.add('panning');
}
/* v6.9：拖拽位移统一换算——client 位移 /zoom 得画布坐标；pan/zoom 变化自动补偿（块保持相对鼠标，滚轮滚动/缩放期间不脱离） */
function dragOffset(){
  return {
    x: (drag.lastX - drag.startX + drag.basePanX + drag.origX * drag.baseZoom - state.pan.x) / state.zoom - drag.origX,
    y: (drag.lastY - drag.startY + drag.basePanY + drag.origY * drag.baseZoom - state.pan.y) / state.zoom - drag.origY
  };
}
function updateDragTransform(){
  if(!drag) return;
  var d = dragOffset();
  if(drag.group){
    for(var gi = 0; gi < drag.els.length; gi++){
      var ge = drag.els[gi];
      if(ge) ge.style.transform = 'translate(' + (d.x + drag.offsets[gi].x) + 'px,' + (d.y + drag.offsets[gi].y) + 'px) scale(1.02)';   /* v7.1：lift */
    }
  }else{
    drag.el.style.transform = 'translate(' + d.x + 'px,' + d.y + 'px) scale(1.02)';   /* v7.1：lift（跟手无过渡） */
  }
}
function onMouseMove(e){
  if(drag){
    drag.lastX = e.clientX;
    drag.lastY = e.clientY;
    if(drag.ghost){   /* v7.3：虚影跟随（源块不动），光线/高亮实时刷新 */
      moveGhost(e.clientX, e.clientY);
      updateLinks();
      updatePeekDots();
      updateDropTarget(e.clientX, e.clientY);
      return;
    }
    updateDragTransform();
    updateLinks();
    updatePeekDots();
    updateDropTarget(e.clientX, e.clientY);   /* v6.18：拼模式单元高亮跟随 */
    return;
  }
  if(panning){
    panning.lastX = e.clientX;
    panning.lastY = e.clientY;
    if(!panLooping){ panLooping = true; requestAnimationFrame(panStep); }   /* 阻尼循环接管 transform */
  }
}
function onMouseUp(e){
  if(drag){
    if(drag.ghost){   /* v7.3：虚影投放——源块位置不变；落单元则拼入（spliceDropAt 内部 saveNow） */
      var gids = drag.group ? drag.group.slice() : [state.blocks[drag.idx].id];
      var glx = (typeof drag.lastX === 'number') ? drag.lastX : drag.startX;
      var gly = (typeof drag.lastY === 'number') ? drag.lastY : drag.startY;
      destroyGhost();
      drag = null;
      spliceDropAt(glx, gly, gids);
      return;
    }
    var lx = (typeof drag.lastX === 'number') ? drag.lastX : drag.startX;
    var ly = (typeof drag.lastY === 'number') ? drag.lastY : drag.startY;
    var gdx = (lx - drag.startX + drag.basePanX + drag.origX * drag.baseZoom - state.pan.x) / state.zoom - drag.origX;
    var gdy = (ly - drag.startY + drag.basePanY + drag.origY * drag.baseZoom - state.pan.y) / state.zoom - drag.origY;   /* v6.9：/zoom 换算 + pan/zoom 补偿并入落点 */
    if(drag.group){
      drag.group.forEach(function(id, gi){
        var gb = findBlockById(id);
        if(!gb) return;
        gb.x += gdx;
        gb.y += gdy;
        var ge = drag.els[gi];
        if(ge){
          ge.style.transform = '';
          ge.style.left = gb.x + 'px';
          ge.style.top = gb.y + 'px';
          void ge.offsetWidth;              /* v7.2：先以「无过渡」状态提交最终位置 */
          ge.style.transition = '';          /* 再恢复 CSS 过渡（属性无变化 → 不触发回弹动画） */
          ge.style.transitionDelay = '';
        }
      });
    }else{
      var b = state.blocks[drag.idx];
      b.x = drag.origX + gdx;
      b.y = drag.origY + gdy;
      drag.el.style.transform = '';
      drag.el.style.left = b.x + 'px';
      drag.el.style.top = b.y + 'px';
      void drag.el.offsetWidth;              /* v7.2：先以「无过渡」状态提交最终位置 */
      drag.el.style.transition = '';          /* 再恢复 CSS 过渡（属性无变化 → 不触发回弹动画） */
      drag.el.style.transitionDelay = '';
    }
    drag.el.classList.remove('drag');
    spliceDropAt(lx, ly, drag.group ? drag.group.slice() : [state.blocks[drag.idx].id]);   /* v6.18：拼模式投放（在 drag 置空前取 ids） */
    drag = null;
    saveNow();
    return;
    }
  if(panning){
    /* v6：位移 <4px 视为「点击空白」（取消焦点/双击新增块），不产生平移 */
    var tdx = panning.lastX - panning.startX;
    var tdy = panning.lastY - panning.startY;
    if(Math.abs(tdx) < 4 && Math.abs(tdy) < 4){
      panVel = null;
      panLooping = false;
    }else{
      /* v6.1：有位移 → 视觉已由阻尼循环跟随；记录惯性终点（不越过），松手后惯性滑行或立即落盘 */
      panEndX = panning.panX + tdx / state.zoom;   /* v6.9：client 位移换算画布坐标（/zoom） */
      panEndY = panning.panY + tdy / state.zoom;
      if(!panVel || (Math.abs(panVel.x) < 1.2 && Math.abs(panVel.y) < 1.2)){
        panVel = null;
        panLooping = false;
        saveNow();
      }
    }
    canvas.classList.remove('panning');
    panning = null;
  }
}
document.addEventListener('mousedown', onMouseDown);
document.addEventListener('mousemove', onMouseMove);
document.addEventListener('mouseup', onMouseUp);

/* ---- 事件 ---- */
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('btnArrange').addEventListener('click', arrangeAll);
  /* v6.16：顶栏简化——「导」= 导出/导入收纳下拉（复用自定义右键菜单） */
  document.getElementById('btnMenu').addEventListener('click', function(e){
    e.stopPropagation();   /* 阻止冒泡到 document（否则菜单刚开就被关） */
    var cm = document.getElementById('ctxMenu');
    if(cm.classList.contains('open')){ closeCtxMenu(); return; }
    var r = this.getBoundingClientRect();
    openCtxMenu([
      { label: '导出 JSON', act: 'export' },
      { label: '导入 JSON', act: 'import' }
    ], r.left, r.bottom + 6);
  });

  /* v6：左键双击画布空白处新增块（复用右键「在此处新增块」逻辑） */
  canvas.addEventListener('dblclick', function(e){
    if(e.target.closest('.block')) return;        /* 块内双击 = 文本选择/编辑 */
    if(e.target.closest('.splice-panel')) return; /* 侧边栏内不响应 */
    if(e.target.closest('.topbar')) return;
    addBlockHere(e.clientX, e.clientY);
  });

  /* v6：滚轮上下滑动画布（纵向平移视角）；v6.9：Ctrl+滚轮 = 缩放（以光标为基准） */
  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    if(e.ctrlKey){
      zoomAt(e.clientX, e.clientY, Math.pow(1.1, -e.deltaY / 120));
      return;
    }
    var dy = (e.deltaMode === 1) ? e.deltaY * 16 : e.deltaY;   /* 行模式换算为像素 */
    if(!dy) return;
    state.pan.y -= dy / state.zoom;   /* v6.9：缩放后滚动按视觉 1:1（画布坐标 /zoom） */
    applyPan();
    if(drag && !drag.ghost) updateDragTransform();   /* 拖拽中滚轮：pan 变，块补偿保持相对鼠标（v7.3：虚影拖拽中真实块不动） */
    scheduleSave();
  }, { passive: false });

  document.getElementById('btnZoom').addEventListener('click', resetZoom);

  var fileInput = document.getElementById('fileInput');
  fileInput.addEventListener('change', function(){
    var f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var d = JSON.parse(reader.result);
        if(!d || d.app !== 'storyboard-prompt-panel' || !Array.isArray(d.blocks)) throw new Error('bad');
        try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(state)); }catch(e){}
        state = migrate(d);
        document.title = '拼好镜';
        render();
        saveNow();
        toast('导入成功 · 原数据已备份', {label:'撤销', fn: undoImport});
      }catch(e2){
        toast('导入失败：不是有效的面板数据文件');
      }
    };
    reader.onerror = function(){ toast('读取文件失败'); };
    reader.readAsText(f, 'utf-8');
  });

  function undoImport(){
    try{
      var bk = localStorage.getItem(BACKUP_KEY);
      if(bk){ state = JSON.parse(bk); render(); saveNow(); toast('已恢复导入前的数据'); }
    }catch(e){}
  }

  /* ---- 拼接侧边栏事件（v4） ---- */
  document.getElementById('spCopy').addEventListener('click', copySpliced);
  document.getElementById('spClear').addEventListener('click', function(){ spliceClear(); toast('已清空拼接'); });
  document.getElementById('spFold').addEventListener('click', toggleCollapsed);
  /* 拼接栏模板（v6.5：模板定制窗口） */
  document.getElementById('spTplCustom').addEventListener('click', openTplWin);
  /* v6.18：拼模式开关 */
  document.getElementById('spSplice').addEventListener('click', function(){ toggleSpliceMode(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && spliceMode) toggleSpliceMode(false);
  });
  document.getElementById('spTplFold').addEventListener('click', function(){
    tplOpen = !tplOpen;
    renderTplList();
  });
  /* 模板定制窗口（v6.12：模板 = 任意数量单元；新建单元按钮 + 下拉新建模板） */
  document.getElementById('tplNew').addEventListener('click', newUnit);
  document.getElementById('tplSelect').addEventListener('change', function(){
    var v = parseInt(this.value, 10);
    if(v === -1){ newTemplate(); return; }   /* 下拉「＋ 新建模板…」 */
    tplCur = v;
    renderTplWin();
  });
  document.getElementById('tplDone').addEventListener('click', closeTplWin);
  document.getElementById('tplMask').addEventListener('click', function(e){ if(e.target.id === 'tplMask') closeTplWin(); });
  /* v6.18：模板预览窗口 */
  document.getElementById('tplPrevClose').addEventListener('click', function(){ document.getElementById('tplPrevMask').classList.add('hide'); });
  document.getElementById('tplPrevMask').addEventListener('click', function(e){ if(e.target.id === 'tplPrevMask') document.getElementById('tplPrevMask').classList.add('hide'); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !document.getElementById('tplPrevMask').classList.contains('hide')) document.getElementById('tplPrevMask').classList.add('hide');
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !document.getElementById('tplMask').classList.contains('hide') && document.getElementById('blkMask').classList.contains('hide')) closeTplWin();
  });
  /* v6.12：提示词块编辑窗口事件 */
  document.getElementById('blkOk').addEventListener('click', function(){
    var cb = blkCb;
    var v = document.getElementById('blkInput').value;
    closeBlockEditor();
    if(cb) cb(v);
  });
  /* v6.14：输入时实时自适应宽度；v7.6：同步重渲染着色/行号/状态栏 */
  document.getElementById('blkInput').addEventListener('input', function(){ fitBlkWidth(); hlRefresh(); });
  /* v7.6：coding 编辑器事件（滚动同步 / 光标驱动状态栏与配对高亮 / 改高同步） */
  (function(){
    var ta = document.getElementById('blkInput');
    ta.addEventListener('scroll', hlSyncBox);
    ta.addEventListener('click', hlRefresh);
    ta.addEventListener('keyup', hlRefresh);
    ta.addEventListener('select', hlRefresh);
    ta.addEventListener('focus', hlRefresh);
    if(window.ResizeObserver) new ResizeObserver(hlSyncBox).observe(ta);
    window.addEventListener('resize', hlSyncBox);
  })();
  /* v6.15：编辑窗口内一键移除空行 */
  document.getElementById('blkStrip').addEventListener('click', function(){
    var ta = document.getElementById('blkInput');
    var lines = (ta.value || '').split('\n');
    var kept = lines.filter(function(l){ return l.trim() !== ''; });
    var v = kept.join('\n');
    if(v !== ta.value){ ta.value = v; fitBlkWidth(); hlRefresh(); toast('已移除空行'); }   /* v7.6：改值后重渲染 */
    else{ toast('没有空行可移除'); }
  });
  document.getElementById('blkCancel').addEventListener('click', closeBlockEditor);
  document.getElementById('blkMask').addEventListener('click', function(e){ if(e.target.id === 'blkMask') closeBlockEditor(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !document.getElementById('blkMask').classList.contains('hide')) closeBlockEditor();
  });
  /* 命名模态框（v6/v6.4 多字段） */
  document.getElementById('modalOk').addEventListener('click', function(){
    var cb = modalCb;
    var vals = Array.prototype.slice.call(document.getElementById('modalBody').querySelectorAll('.modal-input')).map(function(i){ return i.value; });
    closeModal();
    if(cb) cb(vals);
  });
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalMask').addEventListener('click', function(e){ if(e.target.id === 'modalMask') closeModal(); });
  document.getElementById('modalBody').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ document.getElementById('modalOk').click(); }
    else if(e.key === 'Escape'){ closeModal(); }
  });

  /* v6.16：peek 置顶块鼠标离开 → 恢复原层级 */
  board.addEventListener('mouseout', function(e){
    var card = e.target && e.target.closest ? e.target.closest('.block.peek') : null;
    if(!card) return;
    var rt = e.relatedTarget;
    if(rt && rt.closest && rt.closest('.block') === card) return;   /* 仍在块内（子元素间移动） */
    peekBlock(card.dataset.id, false);
  });
  /* 块内输入（textarea 原生编辑，无任何干预） */
  board.addEventListener('input', function(e){
    if(e.target.classList && e.target.classList.contains('block-text')){
      var card = e.target.closest('.block');
      if(!card) return;
      bringToFront(card.dataset.id);   /* v6.17：编辑中的块置顶 */
      var b = findBlock(card.dataset.id);
      if(!b) return;
      b.text = e.target.value;
      autoResize(e.target);
      fitBlock(e.target);
      syncSpliceText(card.dataset.id);   /* v7.5：拼接栏同一条目文本即时同步 */
      updateLinks();                     /* 条目高度变化 → 光线端点跟随 */
      scheduleSave();
    }
  });
  /* 块操作 */
  board.addEventListener('click', function(e){
    var btn = e.target.closest('.op-btn');
    if(!btn) return;
    var card = btn.closest('.block');
    if(!card) return;
    var i = state.blocks.findIndex(function(b){ return b.id === card.dataset.id; });
    if(i < 0) return;
    var act = btn.dataset.act;
    /* v7.6：放大 → 打开 coding 编辑器窗口（单块语义，不参与多选批量；写回不 trim，与画布内联编辑一致） */
    if(act === 'zoom'){
      var bz = state.blocks[i];
      openBlockEditor(bz.text, function(v){
        bz.text = (v === undefined || v === null) ? '' : v;
        var tz = board.querySelector('.block[data-id="' + bz.id + '"] .block-text');
        if(tz){ tz.value = bz.text; autoResize(tz); fitBlock(tz); }
        syncSpliceText(bz.id);
        updateLinks();
        scheduleSave();
      });
      return;
    }
    /* v6.1：该块在多选集内 → 批量作用于整个选中集（「新单体」语义） */
    var ids = (selected.length > 1 && isSel(state.blocks[i].id)) ? selected.slice() : [state.blocks[i].id];
    bulkAction(act, ids);
  });
  function findBlock(id){
    for(var j=0;j<state.blocks.length;j++){ if(state.blocks[j].id === id) return state.blocks[j]; }
    return null;
  }
});

function exportName(){
  var base = '拼好镜';
  var d = new Date();
  function p(n){ return (n<10 ? '0' : '') + n; }
  return base + '_' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + '.json';
}
/* v6.16：导出 JSON（剔除图片块——仅会话内） */
function exportJSON(){
  var blob = new Blob([JSON.stringify(sanitizeState(), null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = exportName();
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('已导出 JSON');
}

/* v6.4：Ctrl+V 将剪贴板文本创建为 prompt 块（焦点不在输入区时生效，整段单块，视口中心错位摆放） */
/* v6.16：剪贴板含图片 → 创建图片块（按原始分辨率，仅会话内，不落盘不导出） */
function addImageBlock(dataUrl, w, h){
  var n = state.blocks.length;
  var b = { id: uid(), type: 'image', img: dataUrl, iw: w, ih: h };
  b.x = (-state.pan.x + (canvas.clientWidth / 2)) / state.zoom - (w / 2) + ((n % 5) - 2) * 20;
  b.y = (-state.pan.y + (canvas.clientHeight / 2)) / state.zoom - (h / 2) + ((n % 5) - 2) * 16;
  state.blocks.push(b);
  render();
  popCard(board.querySelector('.block[data-id="' + b.id + '"]'));   /* v7：创建弹入 */
  saveNow();   /* 图片不落盘，其余数据照常保存 */
  toast('已粘贴为图片块（' + w + '×' + h + '）');
}
document.addEventListener('paste', function(e){
  if(e.target && e.target.closest && (e.target.closest('.block-text') || e.target.closest('.modal-body') || e.target.closest('.sp-item'))) return;   /* 编辑/输入场景保留原生粘贴 */
  var cd = e.clipboardData;
  if(cd && cd.items){
    var imgItem = null;
    for(var i = 0; i < cd.items.length; i++){
      var it = cd.items[i];
      if(it.type && it.type.indexOf('image/') === 0){ imgItem = it; break; }
    }
    if(imgItem){
      var f = imgItem.getAsFile();
      if(f){
        e.preventDefault();
        var rd = new FileReader();
        rd.onload = function(){
          var img = new Image();
          img.onload = function(){ addImageBlock(rd.result, img.naturalWidth, img.naturalHeight); };
          img.src = rd.result;
        };
        rd.readAsDataURL(f);
        return;
      }
    }
  }
  var txt = (cd && cd.getData('text/plain')) || '';
  if(!txt || !txt.trim()) return;
  e.preventDefault();
  var n = state.blocks.length;
  var b = { id: uid(), text: txt.trim() };
  b.x = (-state.pan.x + (canvas.clientWidth / 2)) / state.zoom - (MIN_BLOCK_W / 2) + ((n % 5) - 2) * 20;
  b.y = (-state.pan.y + (canvas.clientHeight / 2)) / state.zoom - 60 + ((n % 5) - 2) * 16;
  state.blocks.push(b);
  render();
  popCard(board.querySelector('.block[data-id="' + b.id + '"]'));   /* v7：创建弹入 */
  saveNow();
  toast('已粘贴为块（' + b.text.length + ' 字符）');
});

window.addEventListener('beforeunload', flush);
document.addEventListener('visibilitychange', function(){ if(document.hidden) flush(); });

load();
