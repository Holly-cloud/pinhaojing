<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>拼好镜 · 响应式适配</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-50: #FFFBEB; --primary-100: #FEF3C7; --primary-200: #FDE68A;
    --primary-300: #FCD34D; --primary-400: #FBBF24; --primary-500: #F59E0B;
    --primary-600: #D97706; --primary-700: #B45309; --primary-800: #92400E; --primary-900: #78350F;
    --secondary-500: #14B8A6; --secondary-700: #0F766E;
    --accent-500: #F43F5E; --accent-600: #E11D48;
    --bg-canvas: #FBF7F0; --bg-surface: #FFFFFF; --bg-sidebar: #F5EFE6;
    --bg-muted: #EDE6DA; --border-subtle: #E5DDD0; --border-strong: #D4C9B8;
    --text-ink: #1C1917; --text-primary: #292524; --text-secondary: #78716C;
    --text-tertiary: #A8A29E; --text-inverse: #FFFBEB;
    --success: #059669; --warning: #D97706; --error: #DC2626;
    --font-display: "Fraunces", Georgia, "Noto Serif SC", serif;
    --font-sans: "Space Grotesk", "Inter", system-ui, "Microsoft YaHei", sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
    --shadow-sm: 0 1px 2px rgba(120, 53, 15, 0.06), 0 1px 3px rgba(120, 53, 15, 0.04);
    --shadow-md: 0 4px 12px rgba(120, 53, 15, 0.08), 0 2px 4px rgba(120, 53, 15, 0.05);
    --shadow-lg: 0 12px 32px rgba(120, 53, 15, 0.10), 0 4px 8px rgba(120, 53, 15, 0.05);
    --shadow-xl: 0 24px 56px rgba(120, 53, 15, 0.12);
    --shadow-2xl: 0 40px 80px rgba(120, 53, 15, 0.18);
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-full: 999px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    width: 1440px;
    height: 900px;
    background: var(--bg-canvas);
    position: relative;
    overflow: hidden;
  }

  /* 背景装饰 */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(251, 191, 36, 0.07) 0%, transparent 50%),
      radial-gradient(circle at 85% 75%, rgba(217, 119, 6, 0.05) 0%, transparent 50%);
    z-index: 0;
    pointer-events: none;
  }

  body::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(180, 83, 9, 0.07) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* ===== Page Header ===== */
  .page-header {
    padding: 28px 48px 12px;
  }

  .eyebrow {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--primary-600);
    margin-bottom: 6px;
  }

  .page-title {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--text-ink);
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .page-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  /* ===== Devices Showcase ===== */
  .devices-showcase {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 32px;
    padding: 16px 48px 20px;
  }

  .device-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .device-label {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .device-label .name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-ink);
  }

  .device-label .size {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .device-label .desc {
    font-size: 11px;
    color: var(--text-secondary);
  }

  /* ===== Device Frame - Desktop ===== */
  .device-desktop {
    width: 520px;
    height: 360px;
    background: var(--bg-surface);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    box-shadow: var(--shadow-xl);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .device-desktop .frame-topbar {
    height: 26px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 6px;
    flex-shrink: 0;
  }

  .traffic-light {
    display: flex;
    gap: 5px;
  }

  .traffic-light span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: block;
  }

  .traffic-light .red { background: #EF4444; }
  .traffic-light .yellow { background: #F59E0B; }
  .traffic-light .green { background: #10B981; }

  .device-desktop .app-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Mini app topbar - desktop */
  .mini-topbar-desktop {
    height: 28px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    flex-shrink: 0;
  }

  .mini-logo {
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-ink);
    letter-spacing: 0.02em;
  }

  .mini-mode-toggle {
    display: flex;
    background: var(--bg-muted);
    border-radius: var(--radius-full);
    padding: 2px;
    gap: 1px;
  }

  .mini-mode-toggle span {
    font-size: 7px;
    padding: 2px 6px;
    border-radius: var(--radius-full);
    color: var(--text-secondary);
    font-weight: 500;
  }

  .mini-mode-toggle span.active {
    background: var(--bg-surface);
    color: var(--text-ink);
    box-shadow: var(--shadow-sm);
  }

  .mini-topbar-icons {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .mini-icon {
    width: 11px;
    height: 11px;
    position: relative;
    color: var(--text-secondary);
  }

  .mini-icon svg {
    width: 100%;
    height: 100%;
  }

  /* Desktop app body - canvas + splice bar */
  .mini-app-body-desktop {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  .mini-canvas-area {
    flex: 1;
    background: var(--bg-canvas);
    position: relative;
    padding: 10px;
    overflow: hidden;
  }

  .mini-canvas-block {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    margin-bottom: 6px;
    box-shadow: var(--shadow-sm);
  }

  .mini-canvas-block .block-line {
    height: 3px;
    background: var(--border-subtle);
    border-radius: 2px;
    margin-bottom: 3px;
  }

  .mini-canvas-block .block-line.short { width: 60%; }
  .mini-canvas-block .block-line.medium { width: 85%; }
  .mini-canvas-block .block-line.long { width: 100%; }

  .mini-canvas-block .block-title {
    height: 4px;
    background: var(--text-ink);
    border-radius: 2px;
    margin-bottom: 4px;
    width: 45%;
    opacity: 0.7;
  }

  /* Splice bar - desktop (right side) */
  .mini-splice-bar {
    width: 100px;
    background: var(--bg-surface);
    border-left: 1px solid var(--border-subtle);
    flex-shrink: 0;
    padding: 8px 6px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    overflow: hidden;
  }

  .mini-splice-title {
    font-size: 8px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 2px;
    padding: 0 2px;
  }

  .mini-splice-unit {
    background: var(--bg-canvas);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 4px 5px;
  }

  .mini-splice-unit .unit-line {
    height: 2px;
    background: var(--border-strong);
    border-radius: 1px;
    margin-bottom: 2px;
  }

  .mini-splice-unit .unit-line:nth-child(1) { width: 75%; }
  .mini-splice-unit .unit-line:nth-child(2) { width: 90%; }
  .mini-splice-unit .unit-line:nth-child(3) { width: 55%; }

  .mini-splice-unit + .mini-splice-unit {
    opacity: 0.6;
  }

  /* Write button - desktop */
  .mini-write-btn-desktop {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 24px;
    height: 24px;
    background: linear-gradient(135deg, var(--primary-400), var(--primary-600));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-inverse);
    font-size: 10px;
    font-weight: 700;
    box-shadow: var(--shadow-md);
    font-family: var(--font-sans);
  }

  /* ===== Device Frame - Tablet ===== */
  .device-tablet {
    width: 360px;
    height: 480px;
    background: var(--bg-surface);
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    box-shadow: var(--shadow-xl);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    margin-top: 20px;
  }

  .device-tablet::before {
    content: "";
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border-strong);
    z-index: 10;
  }

  .device-tablet .app-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    margin-top: 14px;
  }

  /* Mini app topbar - tablet */
  .mini-topbar-tablet {
    height: 32px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    flex-shrink: 0;
  }

  .mini-topbar-tablet .left-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .mini-hamburger {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1;
  }

  .mini-topbar-tablet .right-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Tablet app body */
  .mini-app-body-tablet {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .mini-canvas-tablet {
    flex: 1;
    background: var(--bg-canvas);
    position: relative;
    padding: 12px;
    overflow: hidden;
  }

  /* Bottom docked splice bar - tablet */
  .mini-splice-dock {
    height: 80px;
    background: var(--bg-surface);
    border-top: 1px solid var(--border-subtle);
    flex-shrink: 0;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .mini-splice-dock-title {
    font-size: 8px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .mini-splice-units-row {
    display: flex;
    gap: 6px;
    flex: 1;
    overflow: hidden;
  }

  .mini-splice-unit-horizontal {
    flex: 1;
    min-width: 0;
    background: var(--bg-canvas);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 4px 5px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .mini-splice-unit-horizontal .unit-line {
    height: 2px;
    background: var(--border-strong);
    border-radius: 1px;
  }

  .mini-splice-unit-horizontal .unit-line:nth-child(1) { width: 70%; }
  .mini-splice-unit-horizontal .unit-line:nth-child(2) { width: 85%; }
  .mini-splice-unit-horizontal .unit-line:nth-child(3) { width: 50%; }

  .mini-splice-unit-horizontal:nth-child(3) {
    opacity: 0.5;
  }

  /* Floating write button - tablet */
  .mini-write-btn-tablet {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, var(--primary-400), var(--primary-600));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-inverse);
    font-size: 11px;
    font-weight: 700;
    box-shadow: var(--shadow-md);
    font-family: var(--font-sans);
  }

  /* ===== Device Frame - Mobile ===== */
  .device-mobile {
    width: 240px;
    height: 480px;
    background: var(--bg-surface);
    border: 1px solid var(--border-strong);
    border-radius: 28px;
    box-shadow: var(--shadow-xl);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    margin-top: 20px;
  }

  .device-mobile::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 16px;
    background: var(--border-strong);
    border-radius: 0 0 14px 14px;
    z-index: 10;
    opacity: 0.5;
  }

  .device-mobile::after {
    content: "";
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 3px;
    background: var(--border-strong);
    border-radius: 2px;
    z-index: 10;
    opacity: 0.4;
  }

  .device-mobile .app-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    margin-top: 20px;
    margin-bottom: 12px;
  }

  /* Mini app topbar - mobile */
  .mini-topbar-mobile {
    height: 36px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    flex-shrink: 0;
  }

  .mini-topbar-mobile .mini-logo {
    text-align: center;
  }

  /* Mobile app body */
  .mini-app-body-mobile {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .mini-canvas-mobile {
    flex: 1;
    background: var(--bg-canvas);
    position: relative;
    padding: 12px;
    overflow: hidden;
  }

  /* Bottom tab bar - mobile */
  .mini-tab-bar {
    height: 48px;
    background: var(--bg-surface);
    border-top: 1px solid var(--border-subtle);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 4px;
  }

  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    position: relative;
  }

  .tab-icon {
    width: 16px;
    height: 16px;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  .tab-label {
    font-size: 8px;
    color: var(--text-tertiary);
  }

  .tab-item.active .tab-icon {
    color: var(--primary-500);
  }

  .tab-item.active .tab-label {
    color: var(--primary-600);
    font-weight: 600;
  }

  .tab-item.active::after {
    content: "";
    position: absolute;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--primary-500);
  }

  /* Floating + button - mobile */
  .mini-fab-mobile {
    position: absolute;
    bottom: 14px;
    right: 12px;
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--primary-400), var(--primary-600));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-inverse);
    font-size: 16px;
    font-weight: 300;
    box-shadow: var(--shadow-lg);
    font-family: var(--font-sans);
    line-height: 1;
  }

  /* ===== Breakpoint Reference Table ===== */
  .breakpoint-section {
    padding: 0 48px 36px;
  }

  .breakpoint-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 700;
    color: var(--text-ink);
    margin-bottom: 12px;
  }

  .breakpoint-table {
    display: grid;
    grid-template-columns: 1fr 1.5fr 2fr;
    max-width: 640px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    overflow: hidden;
    background: var(--bg-surface);
    box-shadow: var(--shadow-sm);
  }

  .breakpoint-table .table-header {
    background: var(--bg-sidebar);
    padding: 8px 14px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-subtle);
    letter-spacing: 0.02em;
  }

  .breakpoint-table .table-cell {
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border-subtle);
  }

  .breakpoint-table .row:last-child .table-cell {
    border-bottom: none;
  }

  .breakpoint-table .row {
    display: contents;
  }

  .breakpoint-table .bp-name {
    font-weight: 600;
    color: var(--text-ink);
  }

  .breakpoint-table .bp-range {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
  }

  .breakpoint-table .bp-layout {
    color: var(--text-secondary);
    font-size: 12px;
  }

  /* SVG icon styles */
  .icon-svg {
    width: 100%;
    height: 100%;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
<body>
<div class="page">

  <!-- Page Header -->
  <header class="page-header">
    <div class="eyebrow">Responsive</div>
    <h1 class="page-title">响应式适配</h1>
    <p class="page-subtitle">桌面 · 平板 · 手机 三端一致体验</p>
  </header>

  <!-- Devices Showcase -->
  <div class="devices-showcase">

    <!-- Device 1: Desktop -->
    <div class="device-wrapper">
      <div class="device-desktop">
        <div class="frame-topbar">
          <div class="traffic-light">
            <span class="red"></span>
            <span class="yellow"></span>
            <span class="green"></span>
          </div>
        </div>
        <div class="app-content">
          <!-- Mini topbar -->
          <div class="mini-topbar-desktop">
            <div class="mini-logo">PHJ</div>
            <div class="mini-mode-toggle">
              <span class="active">写</span>
              <span>拼</span>
            </div>
            <div class="mini-topbar-icons">
              <div class="mini-icon">
                <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              </div>
              <div class="mini-icon">
                <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
              </div>
            </div>
          </div>
          <!-- App body: canvas + splice bar -->
          <div class="mini-app-body-desktop">
            <div class="mini-canvas-area">
              <div class="mini-canvas-block">
                <div class="block-title"></div>
                <div class="block-line long"></div>
                <div class="block-line medium"></div>
                <div class="block-line short"></div>
              </div>
              <div class="mini-canvas-block">
                <div class="block-title"></div>
                <div class="block-line long"></div>
                <div class="block-line short"></div>
              </div>
              <div class="mini-write-btn-desktop">写</div>
            </div>
            <!-- Right splice bar -->
            <div class="mini-splice-bar">
              <div class="mini-splice-title">拼接栏</div>
              <div class="mini-splice-unit">
                <div class="unit-line"></div>
                <div class="unit-line"></div>
                <div class="unit-line"></div>
              </div>
              <div class="mini-splice-unit">
                <div class="unit-line"></div>
                <div class="unit-line"></div>
                <div class="unit-line"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="device-label">
        <div class="name">桌面 · Desktop</div>
        <div class="size">1440px+</div>
        <div class="desc">完整功能 · 三栏布局</div>
      </div>
    </div>

    <!-- Device 2: Tablet -->
    <div class="device-wrapper">
      <div class="device-tablet">
        <div class="app-content">
          <!-- Mini topbar -->
          <div class="mini-topbar-tablet">
            <div class="left-group">
              <div class="mini-hamburger">&#9776;</div>
              <div class="mini-logo">拼好镜</div>
            </div>
            <div class="right-group">
              <div class="mini-icon">
                <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              </div>
