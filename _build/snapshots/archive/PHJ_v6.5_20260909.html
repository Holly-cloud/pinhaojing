<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拼好镜</title>
<style>
*{box-sizing:border-box}
:root{--card:rgba(255,255,255,.74);--bg:#eef0f3;--border:rgba(255,255,255,.55);--text:#1d1d1f;--muted:rgba(0,0,0,.48);--accent:#0071e3;--accent-dark:#0066cc;--radius:16px}
html,body{height:100%;margin:0;overflow:hidden}
body{background:
  radial-gradient(1300px 820px at 8% -8%, rgba(0,113,227,.14), transparent 58%),
  radial-gradient(1000px 680px at 94% 2%, rgba(175,82,222,.13), transparent 56%),
  radial-gradient(1100px 760px at 48% 114%, rgba(0,173,216,.11), transparent 58%),
  radial-gradient(760px 540px at 82% 72%, rgba(255,159,28,.09), transparent 55%),
  radial-gradient(700px 500px at 18% 90%, rgba(88,196,120,.07), transparent 55%),
  #eef0f3;
  color:var(--text);font:14px/1.47 system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue","Microsoft YaHei",Arial,sans-serif;letter-spacing:-.12px;-webkit-font-smoothing:antialiased}
.topbar{position:fixed;top:12px;left:16px;right:16px;z-index:500;display:flex;align-items:center;gap:8px;background:rgba(250,250,252,.5);-webkit-backdrop-filter:saturate(200%) blur(24px);backdrop-filter:saturate(200%) blur(24px);border:1px solid rgba(255,255,255,.65);border-radius:16px;padding:8px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 8px 32px rgba(0,0,0,.10);flex-wrap:wrap;transition:box-shadow .2s,background .2s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.5);-webkit-backdrop-filter:saturate(160%) blur(12px);backdrop-filter:saturate(160%) blur(12px);color:var(--text);border-radius:14px;min-height:36px;padding:0 14px;font-size:13px;letter-spacing:-.12px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{background:rgba(255,255,255,.72);border-color:rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.btn.primary{background:rgba(0,113,227,.85);-webkit-backdrop-filter:saturate(140%) blur(12px);backdrop-filter:saturate(140%) blur(12px);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.primary:hover{background:rgba(10,123,228,.92)}
.btn .ic{font-size:14px;line-height:1;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.canvas{position:fixed;top:70px;left:16px;right:16px;bottom:16px;background:rgba(255,255,255,.42);-webkit-backdrop-filter:saturate(160%) blur(32px);backdrop-filter:saturate(160%) blur(32px);border:1px solid rgba(255,255,255,.6);border-radius:16px;overflow:hidden;cursor:grab;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 32px rgba(0,0,0,.06)}
.canvas.panning{cursor:grabbing}
.board{position:absolute;top:0;left:0;will-change:transform}
.block{position:absolute;background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border:1px solid rgba(255,255,255,.7);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 16px rgba(0,0,0,.08);display:flex;gap:4px;padding:10px 8px 10px 4px;transition:box-shadow .15s}
.block:hover{z-index:7000;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 8px 28px rgba(0,0,0,.12)}
.block.drag{z-index:8000;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 20px 48px rgba(0,0,0,.16);cursor:grabbing}
.block.selected{outline:2px solid var(--accent);outline-offset:1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 28px rgba(0,113,227,.22)}  /* v6.1：多选高亮 */
.drag-handle{position:relative;z-index:9999;flex:0 0 18px;display:flex;flex-wrap:wrap;align-content:center;gap:2.5px;padding:4px 2px;cursor:grab;color:#9aa4b5;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);border-radius:8px;user-select:none;touch-action:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.drag-handle:hover{color:#4d5769;background:rgba(255,255,255,.95)}
.drag-handle:active{cursor:grabbing}
.drag-handle i{display:block;width:3.5px;height:3.5px;border-radius:50%;background:currentColor}
.block-text{flex:1;min-width:0;min-height:84px;border:1px solid transparent;outline:none;background:transparent;font-size:13.5px;color:var(--text);padding:6px;border-radius:10px;resize:none;line-height:1.65;overflow:hidden;font-family:inherit;letter-spacing:-.1px;white-space:pre;overflow-wrap:normal;word-break:normal}  /* v6：文本不自动换行，整行完整显示 */
.block-text:focus{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.75);box-shadow:inset 0 1px 3px rgba(0,0,0,.04)}
.block-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.block-ops{display:flex;flex-direction:column;gap:4px;opacity:0;transition:opacity .15s}
.block:hover .block-ops,.block.drag .block-ops{opacity:1}
.op-btn{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 0;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;min-width:46px;height:26px}
.op-btn:hover{background:rgba(0,0,0,.05);color:var(--text)}
.op-btn.danger:hover{color:#d64545;background:rgba(214,69,69,.10)}
.empty{position:absolute;left:16px;right:16px;top:38%;text-align:center;color:var(--muted);font-size:14px;pointer-events:none;transform:translateY(-50%)}
.empty span{font-size:12.5px}
.hint{position:fixed;left:24px;bottom:10px;color:rgba(0,0,0,.3);font-size:12px;pointer-events:none;user-select:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(29,29,31,.7);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);color:#fff;font-size:13px;padding:9px 16px;border-radius:12px;display:flex;align-items:center;gap:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 28px rgba(0,0,0,.28);z-index:99;max-width:80vw}
.toast button{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:10px;font-size:12px;padding:3px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.toast button:hover{background:rgba(255,255,255,.15)}
.toast.hide{display:none}
/* ---- 画布右键菜单（v5.2：取代浏览器默认菜单，macOS 浮层风格） ---- */
.ctx-menu{position:fixed;z-index:10000;min-width:168px;background:rgba(250,250,252,.6);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid rgba(255,255,255,.7);border-radius:12px;padding:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 16px 48px rgba(0,0,0,.18);display:none}
.ctx-menu.open{display:block}
.ctx-item{display:flex;align-items:center;gap:12px;padding:7px 12px;font-size:13px;border-radius:7px;cursor:pointer;color:var(--text);white-space:nowrap;letter-spacing:-.1px;user-select:none}
.ctx-item:hover{background:var(--accent);color:#fff}
.ctx-item.danger{color:#d64545}
.ctx-item.danger:hover{background:#d64545;color:#fff}
.ctx-item.disabled{color:rgba(0,0,0,.28);pointer-events:none}
.ctx-sep{height:1px;background:rgba(0,0,0,.08);margin:5px 4px}
/* ---- 拼接侧边栏（v5：独立悬浮层，不挤压画布；毛玻璃） ---- */
.splice-panel{position:fixed;top:70px;right:16px;bottom:16px;width:280px;background:rgba(250,250,252,.46);-webkit-backdrop-filter:saturate(200%) blur(24px);backdrop-filter:saturate(200%) blur(24px);border:1px solid rgba(255,255,255,.65);border-radius:16px;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 8px 32px rgba(0,0,0,.12);z-index:450;transition:width .15s}
.splice-panel.collapsed{width:40px}
.sp-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(0,0,0,.06)}
.sp-title{flex:1;font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;letter-spacing:-.1px}
.splice-panel.collapsed .sp-head{flex-direction:column;gap:8px;padding:14px 6px;align-items:center;border-bottom:none}
.splice-panel.collapsed .sp-title{display:none}   /* 折叠态只留单个圆形按钮 */
.sp-count{font-size:12px;color:var(--muted);background:rgba(0,0,0,.05);border-radius:10px;padding:1px 8px}
.splice-panel.collapsed .sp-count,.splice-panel.collapsed .sp-body,.splice-panel.collapsed .sp-foot{display:none}
.sp-fold{border:0;background:transparent;color:var(--muted);font-size:14px;cursor:pointer;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1;transition:background .15s}
.sp-fold:hover{background:rgba(0,0,0,.06);color:var(--text)}
.sp-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.sp-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:18px 6px;line-height:1.8}
.sp-item{display:flex;align-items:flex-start;gap:8px;background:rgba(255,255,255,.58);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:8px 10px;cursor:grab;user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 2px 8px rgba(0,0,0,.05)}
.sp-item.dragging{opacity:.75;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 20px rgba(0,0,0,.14);z-index:2}
.sp-item:hover{border-color:rgba(255,255,255,.95);background:rgba(255,255,255,.75)}
.sp-idx{flex:0 0 auto;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600}
.sp-text{flex:1;min-width:0;font-size:12.5px;color:var(--text);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-all}
.sp-x{flex:0 0 auto;border:0;background:transparent;color:rgba(0,0,0,.32);font-size:14px;cursor:pointer;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1;transition:background .15s,color .15s}
.sp-x:hover{color:#d64545;background:#fdeeee}
.sp-foot{padding:10px;border-top:1px solid rgba(0,0,0,.06);display:flex;flex-direction:column;gap:6px}
.sp-copy{width:100%;justify-content:center;font-size:14px;padding:9px 12px}
.sp-clear{align-self:flex-end;border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 12px;border-radius:10px;transition:background .15s,color .15s}
.sp-clear:hover{color:#d64545;background:#fdeeee}
/* ---- 拼接栏模板（v6：多预设单元，每单元容纳多 prompt 块；套用=替换当前拼接） ---- */
.sp-tpl{border-top:1px solid rgba(0,0,0,.06);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.sp-tpl-bar{display:flex;align-items:center;gap:6px}
.sp-tpl-save{flex:1;justify-content:center;min-height:30px;padding:0 10px;font-size:12.5px;border-radius:11px}
.sp-tpl-fold{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 10px;border-radius:10px;transition:background .15s,color .15s;white-space:nowrap}
.sp-tpl-fold:hover{background:rgba(0,0,0,.06);color:var(--text)}
.sp-tpl-list{display:none;flex-direction:column;gap:5px;max-height:180px;overflow-y:auto}
.sp-tpl-list.open{display:flex}
.sp-tpl-item{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);border-radius:11px;padding:5px 8px}
.sp-tpl-name{flex:1;min-width:0;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-tpl-num{font-size:11px;color:var(--muted);background:rgba(0,0,0,.05);border-radius:8px;padding:0 6px;flex:0 0 auto}
.sp-tpl-act{border:0;background:transparent;color:var(--accent);font-size:12px;cursor:pointer;padding:3px 7px;border-radius:8px;flex:0 0 auto;transition:background .15s}
.sp-tpl-act:hover{background:rgba(0,113,227,.10)}
.sp-tpl-act.danger{color:var(--muted)}
.sp-tpl-act.danger:hover{color:#d64545;background:#fdeeee}
.sp-tpl-empty{color:var(--muted);font-size:12px;text-align:center;padding:8px 4px}
/* ---- 模板命名模态框（v6：替代原生 prompt，macOS 浮层风格） ---- */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:11000;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal-mask.hide{display:none}
.modal{width:320px;background:rgba(250,250,252,.92);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid rgba(255,255,255,.7);border-radius:16px;padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 24px 64px rgba(0,0,0,.25)}
.modal-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text);letter-spacing:-.1px}
.modal-label{font-size:12px;color:var(--muted);margin:0 0 4px 2px;letter-spacing:-.1px}
.modal-input{width:100%;border:1px solid rgba(0,0,0,.14);background:rgba(255,255,255,.85);border-radius:10px;padding:8px 10px;font-size:13.5px;color:var(--text);outline:none;margin-bottom:14px;letter-spacing:-.1px}
.modal-input:last-child{margin-bottom:0}
.modal-row{margin-bottom:12px}
.modal-row:last-child{margin-bottom:0}
.modal-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
/* ---- 模板定制窗口（v6.5：居中弹窗，风格统一；多单元/多前后缀） ---- */
.tpl-win{width:560px;height:min(72vh, 640px);display:flex;flex-direction:column;background:rgba(250,250,252,.92);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid rgba(255,255,255,.7);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 24px 64px rgba(0,0,0,.25)}
.tpl-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.06)}
.tpl-title{flex:1;font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.1px}
.tpl-new{min-height:30px;padding:0 12px;font-size:12.5px;border-radius:11px}
.tpl-body{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.tpl-card{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.75);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 2px 8px rgba(0,0,0,.04)}
.tpl-card-head{display:flex;align-items:center;gap:8px}
.tpl-name-input{flex:1;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.85);border-radius:9px;padding:6px 10px;font-size:13.5px;color:var(--text);outline:none;letter-spacing:-.1px}
.tpl-name-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.tpl-del{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 8px;border-radius:8px;flex:0 0 auto;transition:background .15s,color .15s}
.tpl-del:hover{color:#d64545;background:#fdeeee}
.tpl-lbl{font-size:12px;color:var(--muted);letter-spacing:-.1px}
.tpl-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tpl-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(0,113,227,.08);border:1px solid rgba(0,113,227,.22);color:var(--accent);font-size:12.5px;padding:3px 8px;border-radius:9px;letter-spacing:-.1px}
.tpl-chip-x{border:0;background:transparent;color:inherit;cursor:pointer;font-size:12px;padding:0 2px;line-height:1;opacity:.6}
.tpl-chip-x:hover{opacity:1}
.tpl-add{border:1px dashed rgba(0,0,0,.18);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;padding:3px 10px;border-radius:9px;letter-spacing:-.1px;transition:color .15s,border-color .15s}
.tpl-add:hover{color:var(--accent);border-color:var(--accent)}
.tpl-add-input{width:180px;border:1px solid rgba(0,113,227,.5);background:rgba(255,255,255,.9);border-radius:9px;padding:4px 8px;font-size:12.5px;color:var(--text);outline:none}
.tpl-items{width:100%;min-height:80px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.85);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text);outline:none;resize:vertical;line-height:1.6;letter-spacing:-.1px}
.tpl-items:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.tpl-load{border:0;background:transparent;color:var(--accent);font-size:12px;cursor:pointer;padding:3px 8px;border-radius:8px;align-self:flex-start;letter-spacing:-.1px}
.tpl-load:hover{background:rgba(0,113,227,.08)}
.tpl-foot{padding:12px 16px;border-top:1px solid rgba(0,0,0,.06);display:flex;justify-content:flex-end}
.tpl-empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 8px;letter-spacing:-.1px}
</style>
</head>
<body>
<div class="topbar">
  <button class="btn primary" id="btnArrange">⇩ 整理</button>
  <button class="btn" id="btnExport"><span class="ic">⭳</span>导出</button>
  <button class="btn" id="btnImport"><span class="ic">⤒</span>导入</button>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</div>
<div class="canvas" id="canvas"><div class="board" id="board"></div></div>
<div class="splice-panel" id="splicePanel">
  <div class="sp-head">
    <span class="sp-title" id="spTitle">拼接栏</span>
    <span class="sp-count" id="spCount">0</span>
    <button class="sp-fold" id="spFold" title="折叠 / 展开">⏷</button>
  </div>
  <div class="sp-body" id="spBody"></div>
  <div class="sp-foot">
    <button class="btn primary sp-copy" id="spCopy">⧉ 复制拼接</button>
    <button class="sp-clear" id="spClear">清空</button>
    <div class="sp-tpl">
      <div class="sp-tpl-bar">
        <button class="btn sp-tpl-save" id="spTplCustom">⚙ 模板定制</button>
        <button class="sp-tpl-fold" id="spTplFold">模板 ▾</button>
      </div>
      <div class="sp-tpl-list" id="spTplList"></div>
    </div>
  </div>
</div>
<div class="hint">无限画布：拖块把手摆放，拖空白平移视角，滚轮上下滑动，双击空白新增块，Ctrl+左键点块多选，Ctrl+V 粘贴建块 ｜ 自动保存于本机，导出 JSON 做便携备份</div>
<div class="toast hide" id="toast"></div>
<div class="ctx-menu" id="ctxMenu"></div>
<div class="modal-mask hide" id="modalMask">
  <div class="modal">
    <div class="modal-title" id="modalTitle">模板</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalOk">确定</button>
    </div>
  </div>
</div>
<div class="modal-mask hide" id="tplMask">
  <div class="tpl-win">
    <div class="tpl-head">
      <span class="tpl-title">模板定制</span>
      <button class="btn primary tpl-new" id="tplNew">＋ 新建模板单元</button>
    </div>
    <div class="tpl-body" id="tplBody"></div>
    <div class="tpl-foot">
      <button class="btn primary" id="tplDone">完成</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============ 拼好镜 · 单文件版 · v5.4 ============
   无限画布 + 把手置顶 + 原生 textarea + 无复制全部 + 无序号徽章
   v4：右侧拼接侧边栏（圆角气泡列表 + 复制拼接 + 拖入/按钮收集 + 侧边栏内拖拽排序）
   v5：侧边栏独立悬浮（不挤压画布）；拼接复制块间空行分隔；macOS 浅色视觉重构（Apple 模板）
   v5.1：浅灰/毛玻璃显性化；全部按钮圆润居中
   v5.1.1：顶栏按钮错位修复（等高 + 图标定框）
   v5.1.2：折叠态窄条布局修复（竖排头部）
   v5.2：「＋拼」改「拼」；画布自定义右键菜单
   v5.3：textarea 右键恢复原生菜单；拖拽手势重构（左键=移动块，右键拖把手=拼入手势且块位置不变）；全面高透明圆角毛玻璃
   v5.4：项目更名「拼好镜」；移除面板命名功能（title 字段仅兼容旧数据）；「拼接」改「拼接栏」；折叠态只留单按钮；边缘滚动（鼠标贴画布边缘自动平移，LoL 式）
   v6.0：移除边缘滚动；移除「＋新增块」按钮；左键双击画布空白新增块；滚轮上下滑动画布；一键整理（自上而下左对齐，视角归零）；块宽自适应最长行（文本不自动换行）；拼接栏模板（多预设单元/每单元容纳多 prompt 块/套用=替换当前拼接）
   v6.1：画布移动粘滞感（拖动阻尼+松手轻惯性）；移除空文本框默认文本（placeholder）；Ctrl+右键多选（选中集=新单体：拖把手组拖、右键菜单与块按钮批量拼入/复制/克隆/删除，批量删除可撤销）
   v6.2：Ctrl+右键多选改为 mousedown 层处理（把手轻移不再被拼入手势吞掉、不被抑制标志吞掉，任意位置含 textarea 均可用）；拖动块中滚轮上下滑动画布，拖拽块保持跟随鼠标（滚轮补偿并入落点）
   v6.3：放弃 Ctrl+右键多选（右键恢复纯菜单/拼入手势语义）；新增 Ctrl+左键点块多选（toggle 选中/取消，任意位置含把手与 textarea，不启动拖拽/编辑；选中集=新单体语义保持）
   v6.4：Ctrl+V 粘贴剪贴板文本为 prompt 块（焦点不在输入区时，整段单块，视口中心错位）；模板系统重构——模板单元 = 前缀值 + 内容块列表 + 后缀值（前缀/后缀可空，输出各自独占一行，块间空行分隔），存/改名模态框多字段化，旧模板自动补前缀后缀
   v6.5：移除「存为模板」；新增「模板定制」居中窗口（风格统一）——新建任意数量模板单元，每单元可配置任意数量的前缀值与后缀值（标签式增删，每个值独立一行），内容块多行文本区（空行分隔），支持载入当前拼接；数据模型升级 prefixes/suffixes 数组（旧单值自动迁移） */

var LS_KEY = 'storyboard-prompt-panel:v1';
var BACKUP_KEY = LS_KEY + ':backup';
var state = null;
var saveTimer = null;
var toastTimer = null;
var drag = null;      /* 块拖拽：{idx,startX,startY,origX,origY,lastX,lastY,el}；v6.1 支持 group 组拖 */
var panning = null;   /* 画布平移：{startX,startY,panX,panY,x,y} */
var panVel = null;    /* v6.1 画布平移惯性速度 */
var panLooping = false;
var panEndX = 0, panEndY = 0;   /* v6.1 惯性滑行终点（拖动最后目标，防过冲） */
var selected = [];    /* v6.1 多选：选中块 id 列表（内存态，刷新不保留） */
var MIN_BLOCK_W = 140;   /* 空块/短行的最小块宽；块宽随最长行自适应（v6） */

function uid(){ return 'b_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function defaultState(){
  return {
    app: 'storyboard-prompt-panel',
    version: 7,
    title: '未命名分镜',
    pan: { x: 0, y: 0 },
    order: [],
    collapsed: false,
    templates: [],
    blocks: [{
      id: uid(),
      text: '示例块：这是一段提示词——雨夜小巷，霓虹倒映在水洼里，镜头缓慢推近，侦探撑伞走来。\n\n第二段：角色停步回望，眼神警惕，雨水沿帽沿滑落。\n\n左键拖把手=移动位置；右键拖把手=拼入右侧栏（块位置不变）；点「拼」也能加入，按顺序拼成整条 prompt。',
      x: 20,
      y: 20
    }]
  };
}
/* v1 列表数据补网格坐标（仅迁移用） */
function gridPos(i){
  return { x: 20 + (i % 4) * 360, y: 20 + Math.floor(i / 4) * 150 };
}
/* 兼容 v1/v2/v3/v4：补 x/y、pan、order、collapsed，标题字段丢弃；order 过滤失效块 id */
function migrate(d){
  var blocks = d.blocks.map(function(b, i){
    var pos = (typeof b.x === 'number' && typeof b.y === 'number') ? { x: b.x, y: b.y } : gridPos(i);
    return { id: b.id || uid(), text: b.text || '', x: pos.x, y: pos.y };
  });
  var pan = (d.pan && typeof d.pan.x === 'number' && typeof d.pan.y === 'number') ? { x: d.pan.x, y: d.pan.y } : { x: 0, y: 0 };
  var ids = {};
  blocks.forEach(function(b){ ids[b.id] = 1; });
  var order = Array.isArray(d.order) ? d.order.filter(function(id){ return ids[id]; }) : [];
  var templates = Array.isArray(d.templates) ? d.templates.filter(function(t){
    return t && typeof t.name === 'string' && Array.isArray(t.items);
  }).map(function(t){
    return {
      id: t.id || uid(),
      name: t.name,
      prefixes: Array.isArray(t.prefixes) ? t.prefixes.map(String).filter(Boolean) : (typeof t.prefix === 'string' && t.prefix ? [t.prefix] : []),
      suffixes: Array.isArray(t.suffixes) ? t.suffixes.map(String).filter(Boolean) : (typeof t.suffix === 'string' && t.suffix ? [t.suffix] : []),
      items: t.items.map(function(s){ return String(s); })
    };
  }) : [];
  return { app: 'storyboard-prompt-panel', version: 7, title: d.title || '未命名分镜', pan: pan, order: order, collapsed: !!d.collapsed, templates: templates, blocks: blocks };
}

function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d && d.app === 'storyboard-prompt-panel' && Array.isArray(d.blocks)){
        state = migrate(d);
        document.title = '拼好镜';
        render();
        renderTplList();
        if(d.version < 7) saveNow();
        return;
      }
    }
  }catch(e){}
  state = defaultState();
  document.title = '拼好镜';
  render();
  renderTplList();
  saveNow();
}

function scheduleSave(){ if(saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
function flush(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; } saveNow(); }
function saveNow(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast('保存失败：' + e.message); }
}

/* ---- 复制（单块） ---- */
function copyText(text){
  if(window.navigator.clipboard && window.navigator.clipboard.writeText){
    return window.navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return fallbackCopy(text); });
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  try{
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false; }
}

/* ---- toast ---- */
function toast(msg, action){
  var el = document.getElementById('toast');
  el.innerHTML = '';
  var span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if(action){
    var b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = function(){ clearTimeout(toastTimer); el.classList.add('hide'); action.fn(); };
    el.appendChild(b);
  }
  el.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.add('hide'); }, 2600);
}

/* ---- 渲染 ---- */
var canvas, board;

function render(){
  canvas = document.getElementById('canvas');
  board = document.getElementById('board');
  board.innerHTML = '';
  var empty = canvas.querySelector('.empty');
  if(empty) empty.remove();
  if(!state.blocks.length){
    var e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = '双击画布空白处新增块<br><span>无限画布：拖块把手摆放位置 ｜ 拖空白平移视角 ｜ 滚轮上下滑动</span>';
    canvas.appendChild(e);
  }else{
    state.blocks.forEach(function(b){
      board.appendChild(buildCard(b));
    });
    autoSizeAll();
  }
  applyPan();
  renderSplice();
  refreshSel();
}
/* v6.1：多选高亮刷新（DOM 按 dataset.id 同步 .selected） */
function isSel(id){ return selected.indexOf(id) >= 0; }
/* v6.3：Ctrl+左键点选多选（toggle：已选则取消） */
function toggleSel(card){
  if(!card) return;
  var i = state.blocks.findIndex(function(b){ return b.id === card.dataset.id; });
  if(i < 0) return;
  var id = state.blocks[i].id;
  var at = selected.indexOf(id);
  if(at >= 0){ selected.splice(at, 1); }else{ selected.push(id); }
  refreshSel();
}
function refreshSel(){
  var cards = board.querySelectorAll('.block');
  for(var i = 0; i < cards.length; i++){
    cards[i].classList.toggle('selected', isSel(cards[i].dataset.id));
  }
}
function clearSel(){ selected = []; refreshSel(); }
/* v6.1：批量操作（多选「新单体」：原本对单块的操作对选中集全部可用） */
function findBlockById(id){
  for(var j = 0; j < state.blocks.length; j++){ if(state.blocks[j].id === id) return state.blocks[j]; }
  return null;
}
function actIds(bi){
  /* v6.3：右键块在选中集内 → 批量作用于整个选中集；否则单块 */
  if(bi >= 0 && selected.length > 1 && isSel(state.blocks[bi].id)) return selected.slice();
  if(bi >= 0) return [state.blocks[bi].id];
  return [];
}
function bulkAction(act, ids){
  if(!ids.length) return;
  var lastNew = null;
  if(act === 'splice'){
    ids.forEach(function(id){ spliceAdd(id); });
    toast(ids.length > 1 ? '已加入拼接（' + ids.length + ' 块）' : '已加入拼接');
  }else if(act === 'copy'){
    var parts = ids.map(function(id){ var b = findBlockById(id); return b ? b.text.trim() : ''; }).filter(Boolean);
    if(!parts.length){ toast('所选块还没有内容'); return; }
    copyText(parts.join('\n\n')).then(function(ok){
      toast(ok ? (ids.length > 1 ? '已复制 ' + ids.length + ' 块（按序拼接）' : '已复制该块') : '复制失败，请手动全选复制');
    });
  }else if(act === 'clone'){
    var added = 0;
    for(var k = ids.length - 1; k >= 0; k--){   /* 从后往前插，索引不漂移 */
      var idx = state.blocks.findIndex(function(b){ return b.id === ids[k]; });
      if(idx < 0) continue;
      var cp = JSON.parse(JSON.stringify(state.blocks[idx]));
      cp.id = uid();
      cp.x += 28; cp.y += 28;
      state.blocks.splice(idx + 1, 0, cp);
      lastNew = cp;
      added++;
    }
    toast('已克隆 ' + added + ' 块');
  }else if(act === 'del'){
    var snap = null;
    if(ids.length > 1) snap = JSON.parse(JSON.stringify({ blocks: state.blocks, order: state.order }));   /* 批量删除快照，可撤销 */
    ids.forEach(function(id){
      state.order = state.order.filter(function(x){ return x !== id; });
      var idx = state.blocks.findIndex(function(b){ return b.id === id; });
      if(idx >= 0) state.blocks.splice(idx, 1);
    });
    if(snap){
      toast('已删除 ' + ids.length + ' 块', { label: '撤销', fn: function(){
        state.blocks = snap.blocks;
        state.order = snap.order;
        render();
        saveNow();
        toast('已恢复删除的块');
      }});
    }else{
      toast('已删除');
    }
  }
  selected = [];
  if(act === 'clone' || act === 'del'){
    render();
    if(act === 'clone' && lastNew){
      var nc = board.querySelector('.block[data-id="' + lastNew.id + '"]');
      if(nc){ var nt = nc.querySelector('.block-text'); if(nt) focusCaretEnd(nt); }
    }
  }else{
    refreshSel();
  }
  saveNow();
}
/* ---- 拼接侧边栏（v4） ---- */
function renderSplice(){
  var panel = document.getElementById('splicePanel');
  var body = document.getElementById('spBody');
  panel.classList.toggle('collapsed', !!state.collapsed);
  document.getElementById('spCount').textContent = state.order.length;
  document.getElementById('spFold').textContent = state.collapsed ? '⏴' : '⏷';
  body.innerHTML = '';
  var valid = state.order.map(function(id){ return state.blocks.find(function(b){ return b.id === id; }); }).filter(Boolean);
  if(!valid.length){
    var e = document.createElement('div');
    e.className = 'sp-empty';
    e.innerHTML = '右键拖块把手到拼接栏，<br>或点块上的「拼」';
    body.appendChild(e);
    return;
  }
  valid.forEach(function(b, i){ body.appendChild(spItem(b, i)); });
}
function spItem(b, i){
  var it = document.createElement('div');
  it.className = 'sp-item';
  it.dataset.id = b.id;
  var idx = document.createElement('span');
  idx.className = 'sp-idx';
  idx.textContent = i + 1;
  var tx = document.createElement('span');
  tx.className = 'sp-text';
  tx.textContent = b.text || '(空块)';
  var x = document.createElement('button');
  x.className = 'sp-x';
  x.title = '移出拼接';
  x.textContent = '×';
  x.addEventListener('click', function(e){
    e.stopPropagation();
    spliceRemove(b.id);
  });
  it.appendChild(idx);
  it.appendChild(tx);
  it.appendChild(x);
  return it;
}
function spliceAdd(id){
  if(state.order.indexOf(id) < 0) state.order.push(id);
  renderSplice();
  saveNow();
}
function spliceRemove(id){
  state.order = state.order.filter(function(x){ return x !== id; });
  renderSplice();
  saveNow();
}
function spliceClear(){
  state.order = [];
  renderSplice();
  saveNow();
}
/* ---- 拼接栏模板（v6）：多预设单元（模板），每单元容纳多个 prompt 块；套用=替换当前拼接 ---- */
var tplOpen = false;
function renderTplList(){
  var list = document.getElementById('spTplList');
  list.innerHTML = '';
  list.classList.toggle('open', tplOpen);
  var fold = document.getElementById('spTplFold');
  fold.textContent = '模板' + (state.templates.length ? ' (' + state.templates.length + ')' : '') + (tplOpen ? ' ▴' : ' ▾');
  if(!state.templates.length){
    var e = document.createElement('div');
    e.className = 'sp-tpl-empty';
    e.textContent = '暂无模板：点「模板定制」创建模板单元';
    list.appendChild(e);
    return;
  }
  state.templates.forEach(function(t){
    var it = document.createElement('div');
    it.className = 'sp-tpl-item';
    var nm = document.createElement('span');
    nm.className = 'sp-tpl-name';
    nm.textContent = t.name;
    var extra = t.items.length + ' 块' + (t.prefixes.length ? ' · 前缀×' + t.prefixes.length : '') + (t.suffixes.length ? ' · 后缀×' + t.suffixes.length : '');
    nm.title = t.name + '（' + extra + '）';
    var num = document.createElement('span');
    num.className = 'sp-tpl-num';
    num.textContent = t.items.length + ' 块';
    if(t.prefixes.length || t.suffixes.length){
      var pf = document.createElement('span');
      pf.className = 'sp-tpl-num';
      pf.textContent = (t.prefixes.length ? '▶' : '') + (t.suffixes.length ? '◀' : '');
      pf.title = '前缀:' + (t.prefixes.length ? t.prefixes.join(' / ') : '无') + ' 后缀:' + (t.suffixes.length ? t.suffixes.join(' / ') : '无');
      it.appendChild(pf);
    }
    var ap = document.createElement('button');
    ap.className = 'sp-tpl-act';
    ap.textContent = '套用';
    ap.title = '套用模板：清空当前拼接，替换为模板内容';
    ap.addEventListener('click', function(){ applyTemplate(t.id); });
    var dl = document.createElement('button');
    dl.className = 'sp-tpl-act danger';
    dl.textContent = '删除';
    dl.addEventListener('click', function(){ deleteTemplate(t.id); });
    it.appendChild(nm);
    it.appendChild(num);
    it.appendChild(ap);
    it.appendChild(dl);
    list.appendChild(it);
  });
}
function defaultTplName(){
  var n = 1;
  var names = {};
  state.templates.forEach(function(t){ names[t.name] = 1; });
  while(names['模板 ' + n]) n++;
  return '模板 ' + n;
}
/* ---- 模板定制窗口（v6.5）：新建任意数量模板单元，每单元可配任意数量前缀/后缀值 ---- */
function openTplWin(){
  document.getElementById('tplMask').classList.remove('hide');
  renderTplWin();
}
function closeTplWin(){
  document.getElementById('tplMask').classList.add('hide');
  renderTplList();
  saveNow();
}
function newTemplateUnit(){
  state.templates.push({ id: uid(), name: defaultTplName(), prefixes: [], suffixes: [], items: [] });
  renderTplWin();
  renderTplList();
  saveNow();
}
function deleteTemplateUnit(ti){
  state.templates.splice(ti, 1);
  renderTplWin();
  renderTplList();
  saveNow();
}
function renderTplWin(){
  var body = document.getElementById('tplBody');
  body.innerHTML = '';
  if(!state.templates.length){
    var e = document.createElement('div');
    e.className = 'tpl-empty';
    e.textContent = '暂无模板单元：点「＋ 新建模板单元」开始';
    body.appendChild(e);
    return;
  }
  state.templates.forEach(function(t, ti){ body.appendChild(tplCard(t, ti)); });
}
function tplCard(t, ti){
  var card = document.createElement('div');
  card.className = 'tpl-card';
  /* 头部：名称 + 删除单元 */
  var head = document.createElement('div');
  head.className = 'tpl-card-head';
  var name = document.createElement('input');
  name.className = 'tpl-name-input';
  name.value = t.name;
  name.placeholder = '模板名称';
  name.addEventListener('input', function(){ t.name = name.value.trim() || defaultTplName(); scheduleSave(); });
  var del = document.createElement('button');
  del.className = 'tpl-del';
  del.textContent = '删除单元';
  del.addEventListener('click', function(){ deleteTemplateUnit(ti); });
  head.appendChild(name);
  head.appendChild(del);
  card.appendChild(head);
  card.appendChild(tplChipsRow('前缀值（每个独立一行）', t.prefixes));
  card.appendChild(tplChipsRow('后缀值（每个独立一行）', t.suffixes));
  /* 内容块：多行文本区（空行分隔 = 多个块） */
  var lbl = document.createElement('div');
  lbl.className = 'tpl-lbl';
  lbl.textContent = '内容块（空行分隔 = 多个块）';
  var ta = document.createElement('textarea');
  ta.className = 'tpl-items';
  ta.placeholder = '每段（空行分隔）为一个 prompt 块……';
  ta.value = t.items.join('\n\n');
  ta.addEventListener('input', function(){
    t.items = ta.value.split(/\n\s*\n/).map(function(s){ return s.trim(); }).filter(Boolean);
    scheduleSave();
  });
  var loadBtn = document.createElement('button');
  loadBtn.className = 'tpl-load';
  loadBtn.textContent = '↺ 载入当前拼接';
  loadBtn.addEventListener('click', function(){
    var parts = state.order.map(function(id){ var b = findBlockById(id); return b ? b.text : ''; }).filter(Boolean);
    if(!parts.length){ toast('拼接列表是空的，先把块加进来'); return; }
    ta.value = parts.join('\n\n');
    t.items = parts;
    scheduleSave();
    toast('已载入当前拼接');
  });
  card.appendChild(lbl);
  card.appendChild(ta);
  card.appendChild(loadBtn);
  return card;
}
function tplChipsRow(label, arr){
  var wrap = document.createElement('div');
  var lbl = document.createElement('div');
  lbl.className = 'tpl-lbl';
  lbl.textContent = label;
  wrap.appendChild(lbl);
  var chips = document.createElement('div');
  chips.className = 'tpl-chips';
  arr.forEach(function(v, vi){
    var c = document.createElement('span');
    c.className = 'tpl-chip';
    c.textContent = v;
    var x = document.createElement('button');
    x.className = 'tpl-chip-x';
    x.textContent = '×';
    x.title = '删除该值';
    x.addEventListener('click', function(){ arr.splice(vi, 1); renderTplWin(); renderTplList(); scheduleSave(); });
    c.appendChild(x);
    chips.appendChild(c);
  });
  wrap.appendChild(chips);
  var add = document.createElement('button');
  add.className = 'tpl-add';
  add.textContent = '+ 添加' + (label.indexOf('前缀') === 0 ? '前缀' : '后缀');
  add.addEventListener('click', function(){
    var inp = document.createElement('input');
    inp.className = 'tpl-add-input';
    inp.placeholder = '输入值后回车';
    add.style.display = 'none';
    wrap.appendChild(inp);
    inp.focus();
    var commit = function(){
      if(inp.dataset.done) return;
      inp.dataset.done = '1';
      var v = inp.value.trim();
      if(v){ arr.push(v); renderTplWin(); renderTplList(); scheduleSave(); }
      else{ renderTplWin(); }
    };
    inp.addEventListener('keydown', function(e){

var PAN_LERP = 0.32;     /* 阻尼系数：每帧向目标收敛比例（轻微滞后、有粘度） */
var PAN_FRICTION = 0.92; /* 惯性摩擦：每帧速度衰减（轻滑缓停） */
function panStep(){
  if(panning){
    var tx = panning.panX + (panning.lastX - panning.startX);
    var ty = panning.panY + (panning.lastY - panning.startY);
    panVel = { x: (tx - state.pan.x) * PAN_LERP, y: (ty - state.pan.y) * PAN_LERP };
    state.pan.x += panVel.x;
    state.pan.y += panVel.y;
    applyPan();
  }else if(panVel){
    /* 惯性滑行：沿最后速度滑行，但不越过拖动终点（避免甩动过冲） */
    var nx = state.pan.x + panVel.x;
    var ny = state.pan.y + panVel.y;
    var hitX = false, hitY = false;
    if((panVel.x > 0 && nx >= panEndX) || (panVel.x < 0 && nx <= panEndX)){ nx = panEndX; hitX = true; }
    if((panVel.y > 0 && ny >= panEndY) || (panVel.y < 0 && ny <= panEndY)){ ny = panEndY; hitY = true; }
    state.pan.x = nx;
    state.pan.y = ny;
    panVel.x *= PAN_FRICTION;
    panVel.y *= PAN_FRICTION;
    applyPan();
    if((hitX && hitY) || (Math.abs(panVel.x) < 0.4 && Math.abs(panVel.y) < 0.4)){
      panVel = null;
      panLooping = false;
      saveNow();          /* 惯性结束才落盘 pan */

    }

    return;
  }

/* ---- 交互：块拖拽 + 画布平移 ---- */
function onMouseDown(e){
  /* v6.3：Ctrl+左键点块 = 多选 toggle（任意位置含把手/textarea；不启动拖拽/编辑） */
  if(e.button === 0 && e.ctrlKey){
    var tCard = e.target.closest('.block');
    if(tCard){
      toggleSel(tCard);
      e.preventDefault();
      return;
    }
  }
  var handle = e.target.closest('.drag-handle');
  if(handle){
    if(e.button === 2){   /* 右键拖把手 = 拼入手势（块位置不受影响） */
      var sCard = handle.closest('.block');
      var sIdx = state.blocks.findIndex(function(b){ return b.id === sCard.dataset.id; });
      if(sIdx < 0) return;
      spliceDrag = { idx: sIdx, startX: e.clientX, startY: e.clientY, lastX: e.clientX, lastY: e.clientY, el: sCard, moved: false };
      sCard.classList.add('drag');
      e.preventDefault();
      return;
    }
    if(e.button !== 0) return;
    var card = handle.closest('.block');
    var idx = state.blocks.findIndex(function(b){ return b.id === card.dataset.id; });
    if(idx < 0) return;
    /* v6.1：该块在选中集内 → 组拖（整组一起动）；否则单选该块并重置选择 */
    var group = (isSel(state.blocks[idx].id) && selected.length > 1) ? selected.slice() : null;
    if(!group){ selected = [state.blocks[idx].id]; refreshSel(); }
    drag = { idx: idx, group: group, startX: e.clientX, startY: e.clientY, origX: state.blocks[idx].x, origY: state.blocks[idx].y, el: card, els: [], offsets: [], wheelCompY: 0 };
    if(group){
      group.forEach(function(id){
        var b = findBlockById(id);
        if(!b) return;
        drag.els.push(board.querySelector('.block[data-id="' + id + '"]'));
        drag.offsets.push({ x: b.x - state.blocks[idx].x, y: b.y - state.blocks[idx].y });

    }
    card.classList.add('drag');
    e.preventDefault();
    return;
  }
  if(e.button !== 0) return;   /* 空白右键留给 contextmenu */

  if(e.target.closest('.splice-panel')) return;  /* 侧边栏内不启动平移（拼接排序拖拽由自身处理） */

  if(selected.length){ selected = []; refreshSel(); }   /* v6.1：点空白清空多选 */

/* v6.2：拖块中滚轮补偿——重算 transform（鼠标位移 + 滚轮补偿，块保持跟随鼠标不脱离） */
function updateDragTransform(){
  if(!drag) return;
  var dx = drag.lastX - drag.startX;
  var dy = (drag.lastY - drag.startY) + drag.wheelCompY;
  if(drag.group){
    for(var gi = 0; gi < drag.els.length; gi++){
      var ge = drag.els[gi];
      if(ge) ge.style.transform = 'translate(' + (dx + drag.offsets[gi].x) + 'px,' + (dy + drag.offsets[gi].y) + 'px)';

function onMouseMove(e){

    if(spliceDrag.moved) spliceDrag.el.style.transform = 'translate(' + (e.clientX - spliceDrag.startX) + 'px,' + (e.clientY - spliceDrag.startY) + 'px)';
    return;
  }
  if(drag){
    drag.lastX = e.clientX;
    drag.lastY = e.clientY;
    updateDragTransform();
    return;
  }
  if(panning){
    panning.lastX = e.clientX;
    panning.lastY = e.clientY;

    var ly = (typeof drag.lastY === 'number') ? drag.lastY : drag.startY;

        gb.y += gdy;

          ge.style.left = gb.x + 'px';

    panning = null;
  }

  /* v6：左键双击画布空白处新增块（复用右键「在此处新增块」逻辑） */
  canvas.addEventListener('dblclick', function(e){
    if(e.target.closest('.block')) return;        /* 块内双击 = 文本选择/编辑 */
    if(e.target.closest('.splice-panel')) return; /* 侧边栏内不响应 */
    if(e.target.closest('.topbar')) return;
    addBlockHere(e.clientX, e.clientY);
  });

  /* v6：滚轮上下滑动画布（纵向平移视角） */
  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    var dy = (e.deltaMode === 1) ? e.deltaY * 16 : e.deltaY;   /* 行模式换算为像素 */
    if(!dy) return;
    state.pan.y -= dy;
    board.style.transform = 'translate(' + state.pan.x + 'px,' + state.pan.y + 'px)';
    /* v6.2：拖动块中滚轮 → 画布滚动，同时补偿拖拽块保持跟随鼠标 */
    if(drag){
      drag.wheelCompY += dy;
      updateDragTransform();
    }
    scheduleSave();
  }, { passive: false });

  document.getElementById('btnExport').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = exportName();
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('已导出 JSON');
  });

  document.getElementById('btnImport').addEventListener('click', function(){
    document.getElementById('fileInput').click();
  });

  var fileInput = document.getElementById('fileInput');
  fileInput.addEventListener('change', function(){
    var f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var d = JSON.parse(reader.result);
        if(!d || d.app !== 'storyboard-prompt-panel' || !Array.isArray(d.blocks)) throw new Error('bad');
        try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(state)); }catch(e){}
        state = migrate(d);
        document.title = '拼好镜';
        render();
        saveNow();
        toast('导入成功 · 原数据已备份', {label:'撤销', fn: undoImport});
      }catch(e2){
        toast('导入失败：不是有效的面板数据文件');
      }
    };
    reader.onerror = function(){ toast('读取文件失败'); };
    reader.readAsText(f, 'utf-8');
  });

  function undoImport(){
    try{
      var bk = localStorage.getItem(BACKUP_KEY);
      if(bk){ state = JSON.parse(bk); render(); saveNow(); toast('已恢复导入前的数据'); }
    }catch(e){}
  }

  /* ---- 拼接侧边栏事件（v4） ---- */
  document.getElementById('spCopy').addEventListener('click', copySpliced);
  document.getElementById('spClear').addEventListener('click', function(){ spliceClear(); toast('已清空拼接'); });
  document.getElementById('spFold').addEventListener('click', toggleCollapsed);
  /* 拼接栏模板（v6.5：模板定制窗口） */
  document.getElementById('spTplCustom').addEventListener('click', openTplWin);
  document.getElementById('spTplFold').addEventListener('click', function(){
    tplOpen = !tplOpen;
    renderTplList();
  });
  /* 模板定制窗口 */
  document.getElementById('tplNew').addEventListener('click', newTemplateUnit);
  document.getElementById('tplDone').addEventListener('click', closeTplWin);
  document.getElementById('tplMask').addEventListener('click', function(e){ if(e.target.id === 'tplMask') closeTplWin(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !document.getElementById('tplMask').classList.contains('hide')) closeTplWin(); });
  /* 命名模态框（v6/v6.4 多字段） */
  document.getElementById('modalOk').addEventListener('click', function(){
    var cb = modalCb;
    var vals = Array.prototype.slice.call(document.getElementById('modalBody').querySelectorAll('.modal-input')).map(function(i){ return i.value; });
    closeModal();
    if(cb) cb(vals);
  });
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalMask').addEventListener('click', function(e){ if(e.target.id === 'modalMask') closeModal(); });
  document.getElementById('modalBody').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ document.getElementById('modalOk').click(); }
    else if(e.key === 'Escape'){ closeModal(); }
  });
  /* 气泡拖拽排序：手写 mouse 事件，越过相邻气泡中线即交换 */
  var spDrag = null;
  document.getElementById('spBody').addEventListener('mousedown', function(e){
    var item = e.target.closest('.sp-item');
    if(!item || e.target.closest('.sp-x')) return;
    spDrag = { id: item.dataset.id, startY: e.clientY, el: item };
    item.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e){
    if(!spDrag) return;
    spDrag.el.style.transform = 'translateY(' + (e.clientY - spDrag.startY) + 'px)';
    var items = Array.prototype.slice.call(document.getElementById('spBody').querySelectorAll('.sp-item'));
    var curIdx = items.indexOf(spDrag.el);
    if(curIdx < 0) return;
    for(var i = 0; i < items.length; i++){
      if(i === curIdx) continue;
      var r = items[i].getBoundingClientRect();
      var mid = r.top + r.height / 2;
      if((e.clientY < mid && i < curIdx) || (e.clientY > mid && i > curIdx)){
        var from = state.order.indexOf(spDrag.id);
        var to = state.order.indexOf(items[i].dataset.id);
        if(from >= 0 && to >= 0){
          state.order.splice(from, 1);
          state.order.splice(to, 0, spDrag.id);
          renderSplice();
          spDrag.el = document.getElementById('spBody').querySelector('.sp-item[data-id="' + spDrag.id + '"]');
          if(spDrag.el){
            spDrag.el.classList.add('dragging');
            spDrag.el.style.transform = 'translateY(' + (e.clientY - spDrag.startY) + 'px)';
          }
        }
        break;
      }
    }
  });
  document.addEventListener('mouseup', function(){
    if(!spDrag) return;
    if(spDrag.el){ spDrag.el.style.transform = ''; spDrag.el.classList.remove('dragging'); }
    spDrag = null;
    saveNow();
  });

  /* 块内输入（textarea 原生编辑，无任何干预） */
  board.addEventListener('input', function(e){
    if(e.target.classList && e.target.classList.contains('block-text')){
      var card = e.target.closest('.block');
      if(!card) return;
      var b = findBlock(card.dataset.id);
      if(!b) return;
      b.text = e.target.value;
      autoResize(e.target);
      fitBlock(e.target);
      scheduleSave();
    }
  });
  /* 块操作 */
  board.addEventListener('click', function(e){
    var btn = e.target.closest('.op-btn');
    if(!btn) return;
    var card = btn.closest('.block');
    if(!card) return;
    var i = state.blocks.findIndex(function(b){ return b.id === card.dataset.id; });
    if(i < 0) return;
    var act = btn.dataset.act;
    /* v6.1：该块在多选集内 → 批量作用于整个选中集（「新单体」语义） */
    var ids = (selected.length > 1 && isSel(state.blocks[i].id)) ? selected.slice() : [state.blocks[i].id];
    bulkAction(act, ids);
  });
  function findBlock(id){
    for(var j=0;j<state.blocks.length;j++){ if(state.blocks[j].id === id) return state.blocks[j]; }
    return null;
  }
});

function exportName(){
  var base = '拼好镜';
  var d = new Date();
  function p(n){ return (n<10 ? '0' : '') + n; }
  return base + '_' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + '.json';
}

/* v6.4：Ctrl+V 将剪贴板文本创建为 prompt 块（焦点不在输入区时生效，整段单块，视口中心错位摆放） */
document.addEventListener('paste', function(e){
  if(e.target && e.target.closest && (e.target.closest('.block-text') || e.target.closest('.modal-body') || e.target.closest('.sp-item'))) return;   /* 编辑/输入场景保留原生粘贴 */
  var txt = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
  if(!txt || !txt.trim()) return;
  e.preventDefault();
  var n = state.blocks.length;
  var b = { id: uid(), text: txt.trim() };
  b.x = -state.pan.x + (canvas.clientWidth / 2) - (MIN_BLOCK_W / 2) + ((n % 5) - 2) * 20;
  b.y = -state.pan.y + (canvas.clientHeight / 2) - 60 + ((n % 5) - 2) * 16;
  state.blocks.push(b);
  render();
  saveNow();
  toast('已粘贴为块（' + b.text.length + ' 字符）');
});

window.addEventListener('beforeunload', flush);
document.addEventListener('visibilitychange', function(){ if(document.hidden) flush(); });

load();
</script>
