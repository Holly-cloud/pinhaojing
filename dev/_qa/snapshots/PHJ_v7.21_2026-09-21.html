<style>
*{box-sizing:border-box}
:root{--card:rgba(255,255,255,.74);--bg:#eef0f3;--border:rgba(255,255,255,.55);--text:#1d1d1f;--muted:rgba(0,0,0,.48);--accent:#0071e3;--accent-dark:#0066cc;--radius:16px}
html,body{height:100%;margin:0;overflow:hidden}
body{background:
  radial-gradient(1300px 820px at 8% -8%, rgba(0,113,227,.14), transparent 58%),
  radial-gradient(1000px 680px at 94% 2%, rgba(175,82,222,.13), transparent 56%),
  radial-gradient(1100px 760px at 48% 114%, rgba(0,173,216,.11), transparent 58%),
  radial-gradient(760px 540px at 82% 72%, rgba(255,159,28,.09), transparent 55%),
  radial-gradient(700px 500px at 18% 90%, rgba(88,196,120,.07), transparent 55%),
  #eef0f3;
  color:var(--text);font:14px/1.47 system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue","Microsoft YaHei",Arial,sans-serif;letter-spacing:-.12px;-webkit-font-smoothing:antialiased}
.topbar{position:fixed;top:12px;left:16px;right:16px;z-index:500;display:flex;align-items:center;gap:8px;background:rgba(250,250,252,.5);-webkit-backdrop-filter:saturate(200%) blur(24px);backdrop-filter:saturate(200%) blur(24px);border:1px solid rgba(255,255,255,.65);border-radius:16px;padding:8px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 8px 32px rgba(0,0,0,.10);flex-wrap:wrap;transition:box-shadow .2s,background .2s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.5);-webkit-backdrop-filter:saturate(160%) blur(12px);backdrop-filter:saturate(160%) blur(12px);color:var(--text);border-radius:14px;min-height:36px;padding:0 14px;font-size:13px;letter-spacing:-.12px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{background:rgba(255,255,255,.72);border-color:rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.btn.primary{background:rgba(0,113,227,.85);-webkit-backdrop-filter:saturate(140%) blur(12px);backdrop-filter:saturate(140%) blur(12px);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.primary:hover{background:rgba(10,123,228,.92)}
.btn .ic{font-size:14px;line-height:1;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.canvas{position:fixed;top:70px;left:16px;right:16px;bottom:16px;background:rgba(255,255,255,.42);-webkit-backdrop-filter:saturate(160%) blur(32px);backdrop-filter:saturate(160%) blur(32px);border:1px solid rgba(255,255,255,.6);border-radius:16px;overflow:hidden;cursor:grab;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 32px rgba(0,0,0,.06)}
.canvas.panning{cursor:grabbing}
.board{position:absolute;top:0;left:0;will-change:transform}
.block{position:absolute;background:rgba(255,255,255,.5);-webkit-backdrop-filter:saturate(150%) blur(12px);backdrop-filter:saturate(150%) blur(12px);border:0;border-radius:12px;box-shadow:0 1px 5px rgba(0,0,0,.04);display:flex;gap:4px;padding:10px 8px;transition:box-shadow .15s}  /* v6.16：无边框窗口（除拖手外），轻盈无框 */
.block:hover{z-index:7000;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.block.drag{z-index:8000;box-shadow:0 4px 16px rgba(0,0,0,.10);cursor:grabbing}
.block.peek{z-index:9900}  /* v6.16：拖手被遮挡时悬停光点临时置顶，鼠标离开恢复 */
.block.active{z-index:6000}  /* v6.17：最近被点击/编辑过的块置顶（遮挡关系受操作记录影响）——hover 7000/drag 8000/peek 9900 仍可临时盖过 */
.block.rf{will-change:transform}  /* v6.18：缩放后强制重绘触发类（修复放大后文字模糊：浏览器 transform scale 光栅化滞留，重绘后按新缩放渲染） */
.block.selected{outline:2px solid var(--accent);outline-offset:1px;box-shadow:0 2px 10px rgba(0,113,227,.18)}  /* v6.1：多选高亮 */
.drag-handle{position:relative;z-index:9999;flex:0 0 30px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 2px;color:#9aa4b5;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.9);border-radius:10px;user-select:none;touch-action:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}  /* v6.15：纵向布局 = 顶部「拼」+ 中部拖点 + 底部「删」 */
.drag-handle:hover{color:#4d5769;background:rgba(255,255,255,.95)}
.handle-grip{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2.5px;padding:2px 0;cursor:grab;min-height:26px}
.handle-grip:active{cursor:grabbing}
.handle-grip i{display:block;width:3.5px;height:3.5px;border-radius:50%;background:currentColor}
.block-text{flex:1;min-width:0;min-height:84px;border:1px solid transparent;outline:none;background:transparent;font-size:13.5px;color:var(--text);padding:6px;border-radius:10px;resize:none;line-height:1.65;overflow:hidden;font-family:inherit;letter-spacing:-.1px;white-space:pre;overflow-wrap:normal;word-break:normal}  /* v6：文本不自动换行，整行完整显示 */
.block-text:focus{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.75);box-shadow:inset 0 1px 3px rgba(0,0,0,.04)}
/* v6.15：右侧按钮列移除——块功能按钮简化为拖手上「拼」（顶部）+「删」（底部），复制/克隆等收进右键菜单 */
.op-btn.handle-btn{min-width:0;width:100%;height:22px;padding:0;font-size:11.5px;border-radius:7px;line-height:1}
.op-btn.handle-btn.splice{color:#d64545;font-weight:600;background:rgba(214,69,69,.09)}  /* v6.15：「拼」常显红色（主操作醒目），继承 v6.10 语义 */
.op-btn.handle-btn.splice:hover{background:rgba(214,69,69,.18);color:#d64545}
.op-btn{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 0;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;min-width:46px;height:26px}
.op-btn:hover{background:rgba(0,0,0,.05);color:var(--text)}
.op-btn.danger:hover{color:#d64545;background:rgba(214,69,69,.10)}
/* v6.16：拖手被遮挡的朦胧渐变色光点（hover 临时置顶对应块） */
#peekLayer{position:fixed;inset:0;pointer-events:none;z-index:9997}
.peek-dot{position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle, rgba(0,113,227,.55) 0%, rgba(124,58,237,.28) 50%, transparent 72%);cursor:grab;pointer-events:auto;box-shadow:0 0 10px rgba(0,113,227,.4),0 0 4px rgba(124,58,237,.35);transition:transform .12s ease,box-shadow .12s ease}
.peek-dot:hover{transform:scale(1.4);box-shadow:0 0 16px rgba(0,113,227,.6),0 0 6px rgba(124,58,237,.5)}
/* v6.16：拼接光线层（画布块 ↔ 拼接栏条目，朦胧渐变色） */
#linkLayer{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:440}
#linkLayer path.lnk{fill:none;stroke-width:2}
#linkLayer circle.lnk-dot{stroke-width:1.5}
/* v6.16：图片块（无边框窗口，仅展示 + 删按钮左下角 hover 浮现） */
.block-img{padding:0;background:transparent;box-shadow:none;border-radius:12px;overflow:hidden}
.block-img:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}
.block-img .block-img-el{display:block;width:100%;height:100%;object-fit:fill;border-radius:12px;background:#fff;cursor:default}
.op-btn.block-img-del{position:absolute;left:8px;bottom:8px;min-width:0;width:auto;height:22px;padding:0 10px;font-size:11.5px;border-radius:8px;background:rgba(255,255,255,.9);box-shadow:0 1px 5px rgba(0,0,0,.14);color:#d64545;opacity:0;visibility:hidden;transition:opacity .15s,visibility 0s .15s}  /* v6.17：图片块无拖手，按钮回到左下角 left:8 */
.block-img:hover .block-img-del,.block-img.drag .block-img-del,.block-img.peek .block-img-del{opacity:1;visibility:visible;transition:opacity .15s,visibility 0s}
.op-btn.block-img-del:hover{background:rgba(214,69,69,.16);color:#d64545}
.empty{position:absolute;left:16px;right:16px;top:38%;text-align:center;color:var(--muted);font-size:14px;pointer-events:none;transform:translateY(-50%)}
.empty span{font-size:12.5px}
.hint{position:fixed;left:24px;bottom:10px;color:rgba(0,0,0,.3);font-size:12px;pointer-events:none;user-select:none}  /* v6.21：底部说明小字已移除（保留样式备用） */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(29,29,31,.7);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);color:#fff;font-size:13px;padding:9px 16px;border-radius:12px;display:flex;align-items:center;gap:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 28px rgba(0,0,0,.28);z-index:13000;max-width:80vw}  /* v7.17：toast 提到全域置顶（>modal-mask 11000 / >cmpl-order-pop 12050）——否则放大编辑弹窗内「逗号转空格」反馈与「撤销」被 80vh 遮罩盖住点不到 */
.toast button{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:10px;font-size:12px;padding:3px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.toast button:hover{background:rgba(255,255,255,.15)}
.toast.hide{display:none}
/* ---- 画布右键菜单（v5.2：取代浏览器默认菜单，macOS 浮层风格） ---- */
.ctx-menu{position:fixed;z-index:10000;min-width:168px;background:rgba(250,250,252,.6);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid rgba(255,255,255,.7);border-radius:12px;padding:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 16px 48px rgba(0,0,0,.18);display:none;max-height:60vh;overflow:auto}   /* v7.18：项目多时超出视口 → 限高滚动 */
.ctx-menu.open{display:block}
.ctx-item{display:flex;align-items:center;gap:12px;padding:7px 12px;font-size:13px;border-radius:7px;cursor:pointer;color:var(--text);white-space:nowrap;letter-spacing:-.1px;user-select:none}

/* ---- 通用模态框说明文字（v7.18：确认框顶部一句） ---- */
.modal-msg{font-size:12.5px;line-height:1.6;color:var(--muted);letter-spacing:-.12px;margin:0 0 10px}
/* ---- 拼接侧边栏（v5：独立悬浮层，不挤压画布；毛玻璃） ---- */
.splice-panel{position:fixed;top:70px;right:16px;bottom:16px;width:560px;background:rgba(250,250,252,.46);-webkit-backdrop-filter:saturate(200%) blur(24px);backdrop-filter:saturate(200%) blur(24px);border:1px solid rgba(255,255,255,.65);border-radius:16px;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 8px 32px rgba(0,0,0,.12);z-index:450;transition:width .15s}

.sp-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(0,0,0,.06)}

.sp-count{font-size:12px;color:var(--muted);background:rgba(0,0,0,.05);border-radius:10px;padding:1px 8px}

.sp-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.sp-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:18px 6px;line-height:1.8}
.sp-item{display:flex;align-items:flex-start;gap:8px;background:rgba(255,255,255,.58);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:8px 10px;cursor:grab;user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 2px 8px rgba(0,0,0,.05)}
.sp-item.dragging{opacity:.75;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 20px rgba(0,0,0,.14);z-index:2}
.sp-item:hover{border-color:rgba(255,255,255,.95);background:rgba(255,255,255,.75)}
.sp-idx{flex:0 0 auto;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600}
.sp-text{flex:1;min-width:0;font-size:12.5px;color:var(--text);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-all}

.sp-x:hover{color:#d64545;background:#fdeeee}
/* ---- 模板单元窗口（v6.6：拼接栏内圆角窗口，含前后缀行与内部 prompt 块小窗） ---- */
.sp-unit{display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.62);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border:1px solid rgba(255,255,255,.75);border-radius:16px;padding:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 3px 10px rgba(0,0,0,.05)}

.sp-unit-suffix{background:rgba(255,159,28,.08);border-color:rgba(255,159,28,.25);color:#c06f00}
.sp-unit-body{display:flex;flex-direction:column;gap:5px}
.sp-unit-empty{font-size:12px;color:var(--muted);text-align:center;padding:6px 4px;letter-spacing:-.1px}
.sp-ublock{display:flex;align-items:flex-start;gap:6px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.85);border-radius:11px;padding:6px 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 4px rgba(0,0,0,.04)}

.sp-ub-x{flex:0 0 auto;border:0;background:transparent;color:rgba(0,0,0,.3);font-size:12px;cursor:pointer;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1;transition:background .15s,color .15s}

#spSplice{min-width:44px;padding:0 12px;font-size:14px}  /* v6.18：拼模式开关 */
.sp-copy{flex:1;justify-content:center;font-size:14px;padding:9px 12px}

.sp-clear:hover{color:#d64545;background:#fdeeee}
/* ---- 拼接栏模板（v6：多预设单元，每单元容纳多 prompt 块；套用=替换当前拼接） ---- */
.sp-tpl{border-top:1px solid rgba(0,0,0,.06);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.sp-tpl-bar{display:flex;align-items:center;gap:6px}

.sp-tpl-act:hover{background:rgba(0,113,227,.10)}
.sp-tpl-act.primary{background:rgba(0,113,227,.85);color:#fff;font-weight:500}  /* v6.18：套用 = 主题色主操作 */
.sp-tpl-act.primary:hover{background:rgba(10,123,228,.92)}

/* ---- 模板命名模态框（v6：替代原生 prompt，macOS 浮层风格） ---- */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:11000;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal-mask.hide{display:none}
.modal{width:320px;background:rgba(250,250,252,.92);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid rgba(255,255,255,.7);border-radius:16px;padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 24px 64px rgba(0,0,0,.25)}

.modal-input:last-child{margin-bottom:0}

.blk-edit{position:relative;border:1px solid rgba(0,0,0,.14);background:rgba(255,255,255,.85);border-radius:10px;transition:border-color .15s,box-shadow .15s}

.blk-hl{position:absolute;left:0;top:0;z-index:0;pointer-events:none;overflow:hidden;color:#2f3640}  /* 叙述正文的专属色 = 彩色层基线色 */

  color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--text)}  /* v6.14：编辑区 = 屏幕高度 80%；v7.6：文字透明，由彩色层显形 */
.blk-input::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted)}
/* v7.19：选中**只留底色，文字不再显形**。
   旧写法在此处把 `-webkit-text-fill-color` / `color` 覆盖成不透明深色，等于让「上层编辑层自己的字」
   在选中区间显形，压在底层彩色层**同一份字**上 → 两份字叠印（Holly 实测的「重影 / 双重叠」）。
   去掉覆盖后：文字**始终只由底层彩色层显示一份**，选中反馈由半透明蓝底表达（底色画在编辑层，
   位于彩色层之上，故底层文字被染成蓝调而依然可读）。 */

/* ==================== 55-write · 写作台（v7.15） ====================
   双栏布局（左大纲 + 右大编辑器）；两栏各自独立滚动；右栏编辑器**填满**。
   本片必须位于 50-editor / 51-complete / 52-library 之后 —— 才能覆盖弹窗尺寸约束（.blk-input{height:80vh} 等）；
   又必须在 90-effects 之前 —— 使 reduced-motion 降级位于最末。
   注意：不新增/不改动皮肤（skin/**）；类前缀一律 .wd-* / .vs-*，绝不复用 .block。
   ================================================================= */

/* ---- 顶栏：胶囊分段控件 + 条目计数 ---- */
.view-switch{display:inline-flex;align-items:center;gap:2px;background:rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.05);border-radius:13px;padding:3px}
.vs-seg{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;line-height:1;padding:6px 15px;border-radius:10px;cursor:pointer;letter-spacing:-.12px;transition:background .15s,color .15s,box-shadow .15s}
.vs-seg:hover{color:var(--text)}
.vs-seg.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.9)}
.view-count{font-size:12.5px;color:var(--muted);margin-left:4px;letter-spacing:-.12px;white-space:nowrap}

/* ---- 视图显隐 ---- */
.write-desk.hide{display:none}
body.view-canvas .write-desk{display:none}
body.view-write #viewCount{display:none}
body.view-write .canvas,
body.view-write #splicePanel,
body.view-write #peekLayer,
body.view-write #linkLayer{display:none}
/* 「整」与「100%」只对画布有效 → 仅画布视图可见 */
body.view-write #btnArrange,
body.view-write #btnZoom{display:none}

/* ---- 写作台容器（双栏） ---- */
.write-desk{position:fixed;top:70px;left:16px;right:16px;bottom:16px;display:flex;align-items:stretch;background:rgba(255,255,255,.42);-webkit-backdrop-filter:saturate(160%) blur(32px);backdrop-filter:saturate(160%) blur(32px);border:1px solid rgba(255,255,255,.6);border-radius:16px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 32px rgba(0,0,0,.06)}

/* ---- 左栏：大纲（固定宽 + 独立滚动） ---- */
.wd-outline{flex:0 0 320px;width:320px;display:flex;flex-direction:column;min-height:0;border-right:1px solid rgba(0,0,0,.07);background:rgba(255,255,255,.22)}
.wd-head{padding:12px 14px 6px}
.wd-head-title{font-size:12.5px;font-weight:600;color:var(--text);letter-spacing:-.12px}
.wd-head-hint{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;letter-spacing:-.12px}
.wd-list{flex:1;min-height:0;overflow-y:auto;padding:6px 8px}
.wd-empty{color:var(--muted);font-size:12.5px;line-height:1.8;padding:32px 16px;text-align:center;letter-spacing:-.12px}
.wd-add{margin:8px 12px 12px;flex:0 0 auto}

/* ---- 大纲条目行 ---- */
.wd-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;position:relative;transition:background .15s,box-shadow .15s}
.wd-item:hover{background:rgba(0,0,0,.045)}
.wd-item.active{background:rgba(0,113,227,.09)}
.wd-item.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent)}
.wd-item.dragging{opacity:.45}
.wd-item.drag-over{box-shadow:inset 0 2px 0 var(--accent)}
.wd-grip{cursor:grab;color:var(--muted);font-size:14px;line-height:1;user-select:none;flex:0 0 auto}
.wd-grip:active{cursor:grabbing}
.wd-no{flex:0 0 auto;min-width:18px;text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.wd-sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--text)}
.wd-sum.wd-muted{color:var(--muted)}
.wd-cnt{flex:0 0 auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wd-x{flex:0 0 auto;opacity:0;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 5px;border-radius:6px;transition:opacity .15s,color .15s,background .15s}
.wd-item:hover .wd-x,.wd-item.active .wd-x{opacity:1}
.wd-x:hover{color:#d64545;background:#fdeeee}

/* ---- 右栏：大编辑器（自适应 + 填满） ---- */
.wd-pane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.wd-panehead{display:flex;align-items:center;gap:8px;padding:12px 16px 8px}
.wd-pos{font-size:12.5px;color:var(--muted);letter-spacing:-.12px}
.wd-sp{flex:1}
.wd-mini{min-height:28px;padding:0 11px;font-size:12px;border-radius:11px}
.wd-edit{margin:0 16px;flex:1;min-height:0}                 /* 复用 .blk-edit 的边框/底色/相对定位 */
#wdPane .wd-input{height:100%;min-height:140px;resize:none} /* 覆盖 .blk-input 的 height:80vh（弹窗尺寸约束） */
#wdPane .wd-hl{height:100%}
.wd-status{margin:8px 16px 14px;padding:6px 4px}

/* ---- 动效（轻微淡入；reduced-motion 下无动画） ---- */
@keyframes wdFadeIn{from{opacity:0}to{opacity:1}}
body.view-write .write-desk:not(.hide){animation:wdFadeIn .18s ease-out}
@media (prefers-reduced-motion:reduce){
  .write-desk,.wd-item,.wd-x,.vs-seg,.wd-grip,.wd-add{transition:none!important;animation:none!important}
  body.view-write .write-desk:not(.hide){animation:none!important}
}

/* ==================== v7.20：项目身份行（左栏头部常显当前项目名 + 顶栏按钮同显） ==================== */
/* 风格沿用写作台既有头部语言（透明底 + 悬停微深 + --text/--muted），不引入新色彩体系 */
.wd-proj{display:flex;align-items:center;gap:5px;width:calc(100% + 12px);margin:-2px -6px 7px;padding:3px 6px;
  border:0;background:transparent;border-radius:8px;cursor:pointer;font:inherit;text-align:left;transition:background .15s}
.wd-proj:hover{background:rgba(0,0,0,.05)}
.wd-proj:active{background:rgba(0,0,0,.08)}
.wd-proj-name{flex:0 1 auto;min-width:0;max-width:16em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  font-size:13.5px;font-weight:600;color:var(--text);letter-spacing:-.12px}
.wd-proj-caret{flex:0 0 auto;font-size:10px;line-height:1;color:var(--muted)}
/* 顶栏按钮：项目名截断（span.btn-clip 承担 ellipsis——flex 容器自身不支持 text-overflow） */
.btn-clip{display:block;min-width:0;max-width:9em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ==================== v7.20：写作灵感气泡群（#wdBubbles · 编辑区右下角漂浮） ====================
   形态：半透明卡片群常驻右下角；容器 pointer-events:none（不挡正文/滚动条），气泡与按钮本体 auto；
   z-index 5 < .cmpl-pop 的 6（# 触发的候选气泡优先）；动效只动 opacity/transform（零布局抖动）。 */
.wd-bubbles{position:absolute;right:16px;bottom:14px;z-index:5;display:flex;flex-direction:column;align-items:flex-end;
  gap:8px;pointer-events:none;transition:opacity .2s}
.wd-bubbles.hide{display:none}
.wd-bubbles.wdb-dim{opacity:.35}                 /* 输入中 800ms 降存在感 */
.wd-bubbles.wdb-dim:hover{opacity:1}             /* 指针回到气泡上（本体 auto）即恢复 */
/* 折叠态小圆钮（收成「✦」；会话内存，不持久） */
.wdb-fab{display:none;pointer-events:auto;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.65);background:rgba(252,252,254,.85);
  -webkit-backdrop-filter:saturate(160%) blur(16px);backdrop-filter:saturate(160%) blur(16px);
  color:var(--accent);font-size:15px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.12);
  transition:transform .12s,box-shadow .12s,background .12s}
.wdb-fab:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.16);background:rgba(252,252,254,.95)}
.wd-bubbles.wdb-folded .wdb-fab{display:inline-flex}
/* 群卡片：折叠时收放过渡 200ms（只动 opacity/transform/visibility，不触发布局）。
   ★ 不写显式 visibility:visible——visibility 靠继承（父容器 hidden 时整群随之隐藏，含投影），
     显式 visible 会把折叠/外层隐藏短路掉（G6 计墨实测踩中）。 */
.wdb-cluster{display:flex;flex-direction:column;align-items:flex-end;gap:7px;padding:10px 10px 9px;border-radius:14px;
  max-width:min(300px,72%);pointer-events:auto;opacity:1;transform:none;
  background:rgba(252,252,254,.55);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);
  border:1px solid rgba(255,255,255,.65);box-shadow:0 10px 28px rgba(0,0,0,.10);
  transition:opacity .2s,transform .2s,visibility 0s}
.wd-bubbles.wdb-folded .wdb-cluster{opacity:0;transform:translateY(8px) scale(.96);visibility:hidden;pointer-events:none;
  transition:opacity .2s,transform .2s,visibility 0s .2s}
.wdb-cluster.wdb-out{opacity:0;transform:translateY(6px);transition:opacity .12s ease-out,transform .12s ease-out}  /* 换节：旧群淡出 120ms */
.wdb-head{display:flex;align-items:center;gap:6px;width:100%}
.wdb-tag{flex:1;min-width:0;font-size:11px;color:var(--muted);letter-spacing:-.12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wdb-more,.wdb-fold{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-size:11px;line-height:1;
  padding:3px 6px;border-radius:6px;cursor:pointer;transition:background .12s,color .12s}
.wdb-more:hover,.wdb-fold:hover{background:rgba(0,0,0,.06);color:var(--text)}
/* 气泡本体：入场 160ms ease-out（backwards 填充动画延迟期，结束后回落基础态 → hover 过渡不被锁） */
.wdb-wrap{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:100%}
.wdb-bubble{pointer-events:auto;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.6);color:var(--text);
  font:12px/1 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  padding:6px 10px;border-radius:999px;cursor:pointer;
  animation:wdbIn .16s ease-out backwards;   /* 交错延迟由 JS 写 animation-delay */
  transition:background .12s,transform .12s,box-shadow .12s}
@keyframes wdbIn{from{opacity:0;transform:translateY(6px)}}
.wdb-bubble:hover{background:rgba(0,113,227,.12);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.08)}  /* hover：上浮 1px + 加深 */
.wdb-bubble.wdb-blk{color:var(--accent)}
/* v7.21：大纲标签分组头 + 标签钮（仅写作界面消费；order 语义不变 ⇒ 拼接栏/画布零影响） */
.wd-group{display:flex;align-items:center;gap:6px;margin:10px 2px 3px;padding:0 5px;
  font-size:11px;color:var(--muted);letter-spacing:.04em;user-select:none}
.wd-group-t{flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wd-group-c{flex:0 0 auto;opacity:.72;font-variant-numeric:tabular-nums}
.wd-lab{flex:0 0 auto;min-width:20px;height:18px;padding:0 5px;border:0;border-radius:9px;
  background:rgba(0,0,0,.055);color:var(--muted);font-size:11px;font-family:inherit;line-height:18px;
  cursor:pointer;transition:background .12s,color .12s}
.wd-lab:hover{background:rgba(0,0,0,.11)}
.wd-lab.on{background:rgba(0,113,227,.14);color:var(--accent);font-weight:500}
.wd-lab.on[data-tag="补"]{background:rgba(217,119,6,.18);color:#8a5a00}
/* 无障碍（R4）：系统「减少动态」→ 气泡群全部动效降级为直接显隐（功能不变） */
@media (prefers-reduced-motion:reduce){
  .wd-bubbles,.wdb-cluster,.wdb-fab,.wdb-more,.wdb-fold,.wd-proj,.wdb-bubble,.wd-lab{transition:none!important;animation:none!important}
  .wdb-bubble{opacity:1!important;transform:none!important}
}
/* ================== v7 动效（2026-09-11：灵动精致风 · P0 九项） ==================
   铁律：只动 transform+opacity（GPU 合成零重排）；进入=decelerate、离开=accelerate、叙事=premium ease-out；
   反馈≤200ms、叙事≤350ms；拖拽/平移/缩放跟手保持 0 延迟（不挂 transition）；数据模型零改动 */
/* #1 块创建弹入（双击/粘贴/克隆） */
@keyframes blockIn{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
.block.pop-in{animation:blockIn .16s cubic-bezier(0,0,.2,1)}
/* #2 块删除收拢（播 110ms 后真正移除） */
@keyframes delOut{to{opacity:0;transform:scale(.9)}}
.block.del-anim{animation:delOut .11s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
/* #4 拼入吸入（画布块微缩瞬吸） */
@keyframes suckK{0%{transform:scale(1)}45%{transform:scale(.962)}100%{transform:scale(1)}}
.block.suck{animation:suckK .17s cubic-bezier(.16,1,.3,1)}
/* #4b 拼接栏条目弹入落定 */
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(4px)}to{opacity:1;transform:none}}
.sp-pop{animation:popIn .16s cubic-bezier(0,0,.2,1)}
/* #5 拼入光线生长（pathLength=1 归一化 dash；只给新增连线播放，常态刷新静态不闪） */
#linkLayer path.lnk-grow{stroke-dasharray:1;stroke-dashoffset:1;animation:lnkGrow .24s cubic-bezier(0,0,.2,1)}
@keyframes lnkGrow{to{stroke-dashoffset:0}}
/* #6 拖手光点淡入（出现即 120ms 淡入；消失由重建承担） */
@keyframes dotIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.peek-dot{animation:dotIn .12s ease-out}
/* #7 窗口开合：遮罩淡入 + 窗口弹入（display 切换自动重播；关闭即时=保持 Esc 即时应答） */
.modal-mask:not(.hide){animation:maskIn .18s ease-out}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
.modal-mask:not(.hide)>.modal,.modal-mask:not(.hide)>.tpl-win,.modal-mask:not(.hide)>.blk-win{animation:winIn .24s cubic-bezier(0,0,.2,1)}
@keyframes winIn{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
/* #8 右键菜单 / 「导」下拉小弹入 */
.ctx-menu.open{animation:menuIn .12s cubic-bezier(0,0,.2,1)}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* #9 toast 滑入 / 滑出 */
.toast{animation:toastIn .2s cubic-bezier(0,0,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.toast-out{animation:toastOut .15s cubic-bezier(.4,0,1,1) forwards}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,6px)}}
/* 无障碍：系统「减少动态」→ 动效全部降级为直切（功能不变，无 UI 开关） */
@media (prefers-reduced-motion:reduce){
  .block.pop-in,.block.del-anim,.block.suck,.sp-pop,#linkLayer path.lnk-grow,.peek-dot,
  .modal-mask:not(.hide)>.modal,.modal-mask:not(.hide)>.tpl-win,.modal-mask:not(.hide)>.blk-win,
  .modal-mask:not(.hide),.ctx-menu.open,.toast,.toast.toast-out{animation:none!important}
}

/* ================== v7.1 动效 · 微交互层（P1 五项 + P2 数字 tick，2026-09-11） ==================
   策略：尾部覆盖式声明（不改既有行，便于整体回退）；仍只动 transform+opacity */
/* #10 按钮按压（scale 反馈 90ms decelerate；各按钮 transition 完整保留原有属性） */
.btn{transition:background .15s,border-color .15s,box-shadow .15s,transform .09s cubic-bezier(0,0,.2,1)}
.op-btn{transition:transform .09s cubic-bezier(0,0,.2,1)}
.sp-x,.sp-unit-x,.sp-ub-x{transition:background .15s,color .15s,transform .09s cubic-bezier(0,0,.2,1)}
.sp-fold{transition:background .15s,transform .09s cubic-bezier(0,0,.2,1)}
.sp-clear{transition:background .15s,color .15s,transform .09s cubic-bezier(0,0,.2,1)}
.sp-tpl-fold{transition:background .15s,color .15s,transform .09s cubic-bezier(0,0,.2,1)}
.sp-tpl-act{transition:background .15s,transform .09s cubic-bezier(0,0,.2,1)}
.tpl-add{transition:color .15s,border-color .15s,transform .09s cubic-bezier(0,0,.2,1)}
.tpl-block-op{transition:background .15s,color .15s,transform .09s cubic-bezier(0,0,.2,1)}
.tpl-chip-x{transition:transform .09s cubic-bezier(0,0,.2,1)}
.ctx-item{transition:transform .09s cubic-bezier(0,0,.2,1)}
.btn:active,.op-btn:active,.sp-fold:active,.sp-clear:active,.sp-tpl-fold:active,.tpl-add:active,.sp-tpl-act:active{transform:scale(.96)}
.sp-x:active,.sp-unit-x:active,.sp-ub-x:active,.tpl-chip-x:active,.tpl-block-op:active{transform:scale(.88)}
.ctx-item:active{transform:scale(.985)}
/* #11 块 hover 浮起（-1px + 阴影加深；拖拽/FLIP 的 inline transform 优先级更高，不冲突） */
.block{transition:box-shadow .15s,transform .15s cubic-bezier(.4,0,.2,1)}
.block:hover{transform:translateY(-1px)}
/* #13 选中描边淡入（outline → box-shadow：可过渡，选中/取消 150ms 淡入淡出） */
.block.selected{outline:none;box-shadow:0 0 0 2px var(--accent),0 2px 10px rgba(0,113,227,.18)}
.block.selected:hover{box-shadow:0 0 0 2px var(--accent),0 2px 14px rgba(0,113,227,.22)}
/* #14 拼模式 drop-target 光晕呼吸（1.9s 循环，幅度克制） */
@keyframes breatheK{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 4px 14px rgba(0,113,227,.18)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 6px 24px rgba(0,113,227,.36)}}
.sp-unit.drop-target{animation:breatheK 1.9s ease-in-out infinite}
/* #16 缩放值数字 tick（值变化时 140ms 淡入；动画期间不重播，连续滚轮不闪） */
@keyframes tickK{from{opacity:.35;transform:scale(.94)}to{opacity:1;transform:none}}
.btn.tick{animation:tickK .14s cubic-bezier(0,0,.2,1)}
/* 无障碍：新增动效同样降级（按压/浮起/呼吸/tick 全关） */
@media (prefers-reduced-motion:reduce){
  .btn.tick,.sp-unit.drop-target{animation:none!important}
  .btn:active,.op-btn:active,.sp-x:active,.sp-unit-x:active,.sp-ub-x:active,.sp-fold:active,.sp-clear:active,.sp-tpl-fold:active,.tpl-add:active,.tpl-chip-x:active,.tpl-block-op:active,.ctx-item:active,.sp-tpl-act:active{transform:none!important}
  .block:hover{transform:none}
}

/* ================== v7.2 修复（2026-09-11）：拖拽跟手性 ==================
   根因：v7.1 为 hover 浮起给 .block 加了 transition:transform .15s —— 拖拽每帧写 inline transform 全被 150ms 过渡平滑
   （实测拖 150px 立即读滞后 115px）。修复：拖拽态/一次性动画态禁过渡（跟手优先），落位后再恢复。 */
.block.drag{transition:none}
.block.pop-in,.block.suck{transition:none}
/* 拖手光点：只在「新增」光点时播入场动画（拖拽/平移中每帧重建不再重复重播，消除闪烁与无谓开销） */
.peek-dot{animation:none}
.peek-dot.in{animation:dotIn .12s ease-out}

/* ================== v7.3（2026-09-11）：resetZoom 保持位置 + 拼模式虚影拖拽 ================== */
/* 拼模式拖拽中的源块标记（位置不动，仅半透明提示「正在被搬运」） */
.block.splice-src{opacity:.5}
/* 拼模式虚影：克隆块外观、跟随鼠标；transition 必须 none——否则虚影自身也会被过渡缓动而失去跟手（v7.2 教训） */
.block-ghost{position:fixed;left:0;top:0;margin:0;z-index:9998;pointer-events:none;opacity:.5;
  transition:none!important;box-shadow:0 12px 36px rgba(0,0,0,.20);will-change:transform}
.block-ghost .drag-handle{display:none}   /* 虚影不显示拖手按钮（纯内容预览） */

/* ================== v7.5（2026-09-11）：空格平移 + 拼接栏光线接口 + 文本同步 ================== */
/* 改进1：空格 + 左键 = 平移画布——光标反馈（画布内一切元素显示 grab，拖拽中 grabbing） */

body.space-pan .canvas.panning,body.space-pan .canvas.panning .block,body.space-pan .canvas.panning .drag-handle{cursor:grabbing}

  return cmpl;
}

/* 块归一：v6.16 剔图片（须在 map 前过滤——map 已剥离 type 字段）；
   v7.15 块投影新增 order；**v7.21 块投影新增 tag**（仅认 '初'/'补'，其余/缺失一律归 '' —— 老数据零丢失）；
   hasOrd/ord/i 仅供随后排序定序用（不进最终块对象）；
   按「有 order 的在前（order, y, x, i）、无 order 的在后（y, x, i）」全序排序，再赋连续 order = 0..N-1。
   ★★ 新增块字段必须同时改**两处**投影（中间对象 + 末尾 map），否则字段会在每次 load 时被静默剥离。 */
function migrateBlocks(blocksIn){
  var blocks = (Array.isArray(blocksIn) ? blocksIn : []).filter(function(b){ return b && b.type !== 'image'; }).map(function(b, i){
    var pos = (typeof b.x === 'number' && typeof b.y === 'number') ? { x: b.x, y: b.y } : gridPos(i);
    return { id: b.id || uid(), text: b.text || '', tag: (b.tag === '初' || b.tag === '补') ? b.tag : '', x: pos.x, y: pos.y,
             hasOrd: (Number.isInteger(b.order) && b.order >= 0), ord: b.order, i: i };
  });
  blocks.sort(function(A, B){
    if(A.hasOrd !== B.hasOrd) return A.hasOrd ? -1 : 1;
    if(A.hasOrd && A.ord !== B.ord) return A.ord - B.ord;
    if(A.y !== B.y) return A.y - B.y;
    if(A.x !== B.x) return A.x - B.x;
    return A.i - B.i;
  });
  return blocks.map(function(z, k){ return { id: z.id, text: z.text, tag: z.tag, x: z.x, y: z.y, order: k }; });
}

/* 拼接栏归一：v6.6 条目化——平铺块条目 + 模板单元窗口条目；旧 order 平铺迁移为块条目（依旧平铺）。
   按**本项目**块 id 集合过滤（splice.items[].id / unit.blockIds 跨项目必失效 → 必须按项目隔离）。 */
function migrateSplice(spliceIn, orderIn, ids){
  var spliceItems = [];
  if(spliceIn && Array.isArray(spliceIn.items)){
    spliceItems = spliceIn.items.filter(function(it){
      if(it && it.type === 'unit') return typeof it.name === 'string' && Array.isArray(it.blockIds);
      return it && typeof it.id === 'string' && ids[it.id];
    }).map(function(it){
      if(it.type === 'unit'){
        return {
          type: 'unit', id: it.id || uid(), name: it.name,
          prefixes: Array.isArray(it.prefixes) ? it.prefixes.map(String).filter(Boolean) : [],
          suffixes: Array.isArray(it.suffixes) ? it.suffixes.map(String).filter(Boolean) : [],
          blockIds: it.blockIds.filter(function(bid){ return ids[bid]; })
        };
      }
      return { type: 'block', id: it.id };
    });
  }else if(Array.isArray(orderIn)){
    spliceItems = orderIn.filter(function(id){ return ids[id]; }).map(function(id){ return { type: 'block', id: id }; });
  }
  var lastUnitId = null;
  spliceItems.forEach(function(it){ if(it.type === 'unit') lastUnitId = it.id; });
  var activeUnitId = (spliceIn && typeof spliceIn.activeUnitId === 'string' && spliceItems.some(function(it){ return it.type === 'unit' && it.id === spliceIn.activeUnitId; })) ? spliceIn.activeUnitId : lastUnitId;
  return { items: spliceItems, activeUnitId: activeUnitId };
}

/* 单个项目源 → 项目槽（id/title/blocks/pan/zoom/splice/collapsed）；v16 老数据由 migrate 合成单源后走此路径。 */
function migrateOneProject(p){
  p = (p && typeof p === 'object') ? p : {};
  var blocks = migrateBlocks(p.blocks);
  var ids = {};
  blocks.forEach(function(b){ ids[b.id] = 1; });
  return {
    id: (typeof p.id === 'string' && p.id) ? p.id : uid(),
    title: (typeof p.title === 'string' && p.title) ? p.title : '未命名分镜',
    blocks: blocks,
    pan: (p.pan && typeof p.pan.x === 'number' && typeof p.pan.y === 'number') ? { x: p.pan.x, y: p.pan.y } : { x: 0, y: 0 },
    zoom: (typeof p.zoom === 'number' && p.zoom > 0 && p.zoom <= 4) ? p.zoom : 1,
    splice: migrateSplice(p.splice, p.order, ids),
    collapsed: !!p.collapsed
  };
}

function migrate(d){
  /* ① 跨项目共享字段：模板 / 片段库（含 use）—— 逐字沿用既有逻辑，保持全局 */
  var templates = migrateTemplates(d.templates);
  var cmpl = migrateCmpl(d.cmpl);

  /* ② 收集「项目源」列表：v17+ 文档有 projects[]；v16 及更老（无 projects）→ 合成**恰好一个**项目源，
        其 blocks/pan/zoom/splice/title/collapsed 取自顶层 live 字段，order 取旧顶层 order（v1..v5 兼容）
        ⇒ 单项目路径与旧版 migrate 输出逐字等价 → 升级后画布/视角/拼接/order 逐字承接（观感不变） */
  var srcs;
  if(Array.isArray(d.projects) && d.projects.length){
    srcs = d.projects;
  }else{
    srcs = [{ id: (typeof d.activeProject === 'string' && d.activeProject) ? d.activeProject : null,
              title: d.title, blocks: d.blocks, pan: d.pan, zoom: d.zoom,
              splice: d.splice, collapsed: d.collapsed, order: d.order }];
  }

  /* ③ 逐项目归一（复用同一套块/拼接逻辑；老数据 → 单项目） */
  var projects = srcs.map(migrateOneProject);

  /* ④ 活动项目 id：命中则用，否则落第一个 */
  var activeProject = projects[0].id;
  for(var i = 0; i < projects.length; i++){ if(projects[i].id === d.activeProject){ activeProject = d.activeProject; break; } }
  var act = projects[0];
  for(var j = 0; j < projects.length; j++){ if(projects[j].id === activeProject){ act = projects[j]; break; } }

  /* ⑤ 顶层镜像 = 活动项目（**同一引用**） */
  /* v7.21：version **仍 17** —— 新增的 `block.tag` 是**纯增量可选字段**（缺失/脏值一律归 ''），
     迁移天然零丢失，故**不升版**：升版会连带改动 C / v7.8 / W / v7.20 四个套件里
     `version === 17` 的断言判定式，属无收益的大范围扰动。若将来需要「按版本区分是否有 tag」，
     直接按 `b.tag === undefined` 判定即可。 */
  return { app: 'storyboard-prompt-panel', version: 17,
           templates: templates, cmpl: cmpl,
           activeProject: activeProject, projects: projects,
           blocks: act.blocks, pan: act.pan, zoom: act.zoom,
           splice: act.splice, collapsed: act.collapsed, title: act.title };
}

function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d && d.app === 'storyboard-prompt-panel' && Array.isArray(d.blocks)){
        state = migrate(d);
        document.title = '拼好镜';
        render();
        renderTplList();
        if(d.version < 17) saveNow();   /* v7.15：升到 15 时补 order；v7.16：升到 16 时落盘 use 契约；v7.17：升到 17 时落多项目容器 */
        return;
      }
    }
  }catch(e){}
  state = defaultState();
  document.title = '拼好镜';
  render();
  renderTplList();
  saveNow();
}

function scheduleSave(){ if(saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
function flush(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; } saveNow(); }
/* v6.16：序列化前剔除图片块（图片块仅会话内存在，不落盘不导出）
   v7.18：多项目——**逐项目**也剔图片（顶层镜像与 projects[] 各存一份，两处都要净）。
   ★保留顶层镜像：不破坏 W4/W9 等读 `LS.blocks` 的既有断言（见设计 §14-12）。 */
function sanitizeState(){
  var c = JSON.parse(JSON.stringify(state));
  c.blocks = (c.blocks || []).filter(function(b){ return b.type !== 'image'; });
  if(Array.isArray(c.projects)){
    c.projects.forEach(function(p){
      if(p && Array.isArray(p.blocks)) p.blocks = p.blocks.filter(function(b){ return b.type !== 'image'; });
    });
  }
  return c;
}
function saveNow(){
  syncActiveProject();   /* ★v7.18：落盘前把 live 字段写回活动项目槽（幂等重连镜像，防「改动只在顶层未回写」） */
  try{ localStorage.setItem(LS_KEY, JSON.stringify(sanitizeState())); }
  catch(e){ toast('保存失败：' + e.message); }
}

/* 本模块对外面 = 被他模块引用的顶层名（P3 客观统计口径） */
PHJ.persist = { BACKUP_KEY, flush, load, migrate, sanitizeState, saveNow, scheduleSave, toastTimer };
/* ---- 复制（单块） ---- */
function copyText(text){
  if(window.navigator.clipboard && window.navigator.clipboard.writeText){
    return window.navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return fallbackCopy(text); });
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  try{
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false; }
}

/* ---- toast ---- */
function toast(msg, action){
  var el = document.getElementById('toast');
  el.classList.remove('toast-out');   /* v7：若上轮滑出中，先复位再滑入 */
  el.innerHTML = '';
  var span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if(action){
    var b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = function(){ clearTimeout(toastTimer); el.classList.remove('toast-out'); el.classList.add('hide'); action.fn(); };
    el.appendChild(b);
  }
  el.classList.remove('hide');
  clearTimeout(toastTimer);
  /* v7：自动滑出 = 先播 150ms 淡出，再隐藏（保持滑入/滑出对称） */
  toastTimer = setTimeout(function(){
    el.classList.add('toast-out');
    toastTimer = setTimeout(function(){ el.classList.remove('toast-out'); el.classList.add('hide'); }, 160);
  }, 2600);
}

/* 本模块对外面 = 被他模块引用的顶层名（P3 客观统计口径） */
PHJ.clipboard = { copyText, toast };
function refreshOverlays(){ updatePeekDots(); updateLinks(); }

function updatePeekDots(){
  var layer = document.getElementById('peekLayer');
  if(!layer || !board) return;
  var cards = board.querySelectorAll('.block');
  var rects = [];
  for(var i = 0; i < cards.length; i++){
    var el = cards[i];
    var r = el.getBoundingClientRect();
    /* v6.17：有效层级 peek(3) > drag(2) > active(1) > 普通(0) */
    var eff = el.classList.contains('peek') ? 3 : el.classList.contains('drag') ? 2 : el.classList.contains('active') ? 1 : 0;
    rects.push({ id: el.dataset.id, el: el, x: r.x, y: r.y, w: r.width, h: r.height, eff: eff, idx: i, isImg: el.classList.contains('block-img') });
  }
  var wanted = {};   /* v7.2：本帧需要的光点 { id: {x,y} } */
  for(var a = 0; a < rects.length; a++){
    var A = rects[a];
    if(A.eff >= 2) continue;   /* peek/drag 中的块拖手（或图片）一定可见 */
    /* v6.17：操作区 = 文本块拖手区（左 30px）/ 图片块中心（无拖手） */
    var opR = A.isImg
      ? { x: A.x + A.w / 2 - 9, y: A.y + A.h / 2 - 9, w: 18, h: 18 }
      : { x: A.x, y: A.y, w: 30, h: A.h };
    var covered = false;
    for(var b = 0; b < rects.length; b++){
      if(b === a) continue;
      var B = rects[b];
      if(B.eff >= 3) continue;   /* peek 置顶块不遮挡（自己会被操作） */
      if(B.eff < A.eff) continue;                    /* 层级更低不遮挡 */
      if(B.eff === A.eff && B.idx < A.idx) continue; /* 同层 DOM 靠前不遮挡 */
      if(opR.x + opR.w <= B.x || B.x + B.w <= opR.x || opR.y + opR.h <= B.y || B.y + B.h <= opR.y) continue;
      covered = true;
      break;
    }
    if(covered){
      wanted[A.id] = { x: Math.round(opR.x + opR.w / 2), y: Math.round(opR.y + opR.h / 2) };
    }
  }
  /* v7.2：复用式更新（不再每帧重建 DOM）——
     ① 新出现的光点创建元素并播 dotIn 入场；既有光点只更新位置（拖拽/平移中不重播，消除闪烁与 DOM 开销）；
     ② render() 内部会调用本函数两次（applyPan + refreshOverlays），重建式会让第二批丢掉入场标记，复用式天然免疫 */
  var kids = layer.children;
  var alive = {};
  for(var i2 = kids.length - 1; i2 >= 0; i2--){
    var el2 = kids[i2];
    var id2 = el2.dataset.id;
    if(!wanted[id2]){ layer.removeChild(el2); continue; }   /* 不再需要 → 移除（下次出现重新播入场） */
    el2.style.left = wanted[id2].x + 'px';
    el2.style.top = wanted[id2].y + 'px';
    alive[id2] = 1;
  }
  for(var id3 in wanted){
    if(alive[id3]) continue;
    var d = document.createElement('div');
    d.className = 'peek-dot in';   /* 新出现 → 入场动画 */
    d.dataset.id = id3;
    d.style.left = wanted[id3].x + 'px';
    d.style.top = wanted[id3].y + 'px';
    d.title = '下层块（被遮挡）：悬停临时置顶';
    (function(id4){ d.addEventListener('mouseenter', function(){ peekBlock(id4, true); }); })(id3);
    d.addEventListener('animationend', function(){ d.classList.remove('in'); });   /* 入场播完摘除标记 */
    layer.appendChild(d);
  }
}
/* v6.17：最近操作的块置顶（遮挡关系受操作记录影响） */
var activeId = null;
function bringToFront(id){
  if(activeId === id) return;
  activeId = id;
  var cards = board.querySelectorAll('.block');
  for(var i = 0; i < cards.length; i++){
    cards[i].classList.toggle('active', cards[i].dataset.id === id);
  }
  updatePeekDots();
}
function peekBlock(id, on){
  var card = board.querySelector('.block[data-id="' + id + '"]');
  if(!card) return;
  if(on){ card.classList.add('peek'); }else{ card.classList.remove('peek'); }
  updatePeekDots();
}
/* v6.16：光线层 —— 画布块 ↔ 拼接栏条目（朦胧渐变色贝塞尔曲线） */
function updateLinks(growIds){   /* v7：growIds 存在且含 bid 时该连线播生长动画 */
  var svg = document.getElementById('linkLayer');
  if(!svg) return;
  svg.innerHTML = '';
  if(state.collapsed) return;
  var ns = 'http://www.w3.org/2000/svg';
  var defs = document.createElementNS(ns, 'defs');
  var lg = document.createElementNS(ns, 'linearGradient');
  lg.id = 'lnkGrad';
  lg.setAttribute('x1', '0%'); lg.setAttribute('y1', '0%'); lg.setAttribute('x2', '100%'); lg.setAttribute('y2', '0%');
  var s1 = document.createElementNS(ns, 'stop'); s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', 'rgba(0,113,227,.6)');
  var s2 = document.createElementNS(ns, 'stop'); s2.setAttribute('offset', '100%'); s2.setAttribute('stop-color', 'rgba(124,58,237,.5)');
  lg.appendChild(s1); lg.appendChild(s2);
  defs.appendChild(lg);
  svg.appendChild(defs);
  state.splice.items.forEach(function(it){
    if(it.type === 'block'){
      addLink(svg, ns, it.id, '.sp-item[data-id="' + it.id + '"]', growIds);
    }else if(it.blockIds){
      it.blockIds.forEach(function(bid){ addLink(svg, ns, bid, '.sp-ublock[data-id="' + bid + '"]', growIds); });
    }
  });
  /* v7.3：拼模式拖拽中——源块 → 虚影 的渐变连线（实时跟随，两端最近边 + 双圆点） */
  if(ghostEl && ghostSrcId){
    var gsc = board.querySelector('.block[data-id="' + ghostSrcId + '"]');
    if(gsc){
      var gsr = gsc.getBoundingClientRect();
      var ghr = ghostEl.getBoundingClientRect();
      var pA = { x: gsr.right, y: gsr.top + gsr.height / 2 };
      var pB = { x: ghr.left, y: ghr.top + ghr.height / 2 };
      if(ghr.left < gsr.left){   /* 虚影在源块左侧 → 反转连接边 */
        pA = { x: gsr.left, y: gsr.top + gsr.height / 2 };
        pB = { x: ghr.right, y: ghr.top + ghr.height / 2 };
      }
      var gdx = Math.max(40, Math.abs(pB.x - pA.x) / 2);
      var gpath = document.createElementNS(ns, 'path');
      gpath.setAttribute('class', 'lnk lnk-ghost');   /* v7.3：虚影光线专属标识（便于识别/验收） */
      gpath.setAttribute('d', 'M' + pA.x.toFixed(1) + ',' + pA.y.toFixed(1) + ' C' + (pA.x + gdx).toFixed(1) + ',' + pA.y.toFixed(1) + ' ' + (pB.x - gdx).toFixed(1) + ',' + pB.y.toFixed(1) + ' ' + pB.x.toFixed(1) + ',' + pB.y.toFixed(1));
      gpath.setAttribute('stroke', 'url(#lnkGrad)');
      gpath.setAttribute('opacity', '.8');
      svg.appendChild(gpath);
      var gcA = document.createElementNS(ns, 'circle');
      gcA.setAttribute('class', 'lnk-dot');
      gcA.setAttribute('cx', pA.x.toFixed(1)); gcA.setAttribute('cy', pA.y.toFixed(1)); gcA.setAttribute('r', '3');
      gcA.setAttribute('fill', 'rgba(0,113,227,.75)');
      var gcB = document.createElementNS(ns, 'circle');
      gcB.setAttribute('class', 'lnk-dot');
      gcB.setAttribute('cx', pB.x.toFixed(1)); gcB.setAttribute('cy', pB.y.toFixed(1)); gcB.setAttribute('r', '3');
      gcB.setAttribute('fill', 'rgba(124,58,237,.75)');
      svg.appendChild(gcA); svg.appendChild(gcB);
    }
  }
}
function addLink(svg, ns, bid, sel, growIds){
  var bc = board.querySelector('.block[data-id="' + bid + '"]');
  var sc = document.querySelector(sel);
  if(!bc || !sc) return;
  var br = bc.getBoundingClientRect();
  var sr = sc.getBoundingClientRect();
  if(!br.width || !sr.width) return;   /* 隐藏/折叠中 */
  var x1 = br.right, y1 = br.top + br.height / 2;
  var x2 = sr.left, y2 = sr.top + sr.height / 2;
  var dx = Math.max(50, (x2 - x1) / 2);
  var path = document.createElementNS(ns, 'path');
  path.setAttribute('class', 'lnk');
  if(growIds && growIds.indexOf(bid) >= 0) path.classList.add('lnk-grow');   /* v7：新增连线播生长（pathLength 归一化 dash） */
  path.setAttribute('pathLength', '1');   /* v7：dash 按路径总长归一化（生长动画与长度无关） */
  path.setAttribute('d', 'M' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' C' + (x1 + dx).toFixed(1) + ',' + y1.toFixed(1) + ' ' + (x2 - dx).toFixed(1) + ',' + y2.toFixed(1) + ' ' + x2.toFixed(1) + ',' + y2.toFixed(1));
  path.setAttribute('stroke', 'url(#lnkGrad)');
  path.setAttribute('opacity', '.5');
  svg.appendChild(path);
  var c1 = document.createElementNS(ns, 'circle');
  c1.setAttribute('class', 'lnk-dot');
  c1.setAttribute('cx', x1.toFixed(1)); c1.setAttribute('cy', y1.toFixed(1)); c1.setAttribute('r', '3');
  c1.setAttribute('fill', 'rgba(0,113,227,.6)');
  var c2 = document.createElementNS(ns, 'circle');
  c2.setAttribute('class', 'lnk-dot');
  c2.setAttribute('cx', x2.toFixed(1)); c2.setAttribute('cy', y2.toFixed(1)); c2.setAttribute('r', '3');
  c2.setAttribute('fill', 'rgba(124,58,237,.6)');
  svg.appendChild(c1); svg.appendChild(c2);
  /* v7.5：目标条目左缘「渐变朦胧光线接口」——有画布块光线接入时显示（class 幂等；条目重建后自动重加） */
  if(sc.classList) sc.classList.add('lnk-in');
}

/* 本模块对外面 = 被他模块引用的顶层名（P3 客观统计口径） */
PHJ.overlay = { activeId, bringToFront, peekBlock, refreshOverlays, updateLinks, updatePeekDots };

/* ==================== v7.6 coding 编辑器引擎（叠层高亮 + 行号栏 + 状态栏 + 错误标记） ====================
   设计：划分依据 = 文本中出现的符号本身（Unicode 标点/符号）；引擎零领域语义（不为任何符号预设"代表什么内容"）。
   规则：R0 错误符号表（，,）→ 红 + 波浪下划线 + 行号标红；优先级最高；不参与括号配对
        R0.5 台词区豁免（v7.7）：被**一行内成对的中文双引号“ ”包住**的错误符号一律无视——随所在层级族色正常显示、
             不计入状态栏错误数、不使行号标红。边界＝仅中文双引号（半角 " 不算）；**未闭合不算台词区**（照旧标红）；

        R2 嵌套 → 内层覆盖外层（最近的开符号决定）
        R3 其余符号（句读/运算符/箭头…）→ 配对区域内随该族色，区域外着句读色

var HL_ERR = {'，':1, ',':1};                                  /* 错误符号表（常量，加一个字符即可扩展） */
var HL_DLG = {'“':'”'};                                       /* v7.7 台词区边界表（成对中文双引号，加一对即扩展；未闭合不生效） */

  if('()（）'.indexOf(ch) >= 0) return 'paren';
  if('【】〔〕'.indexOf(ch) >= 0) return 'lent';
  if('[]［］'.indexOf(ch) >= 0) return 'square';
  if('《》'.indexOf(ch) >= 0) return 'title';

   实现：行内深度配对出闭合区间 → 差分区累计覆盖数（O(n)，不做区间双重循环，嵌套区间亦正确） */

     本层只做机制 `!(exempt && exempt[i])`——不知道掩码的语义来源（领域策略在 editor/struct.js）。

    if(HL_ERR[ch] && !dlg[i] && !(exempt && exempt[i])){ fam[i] = 'err'; continue; }   /* R0：台词区/调用方掩码豁免 → 继续走 R1~R5 随层级族色 */
    if(!HL_SYM.test(ch)){ t = top(); fam[i] = t ? t.fam : 'body'; continue; }    /* R5 / R1 */
    if(HL_PAIRS[ch]){ fam[i] = hlFamOf(ch); stack.push({ch:ch, fam:fam[i]}); }
    else if(HL_CLOSERS[ch]){

/* 括号配对（coding 语义）：光标紧邻的括号 → 配对两端索引；不跨行 */

    ch = text.charAt(p);
    if(HL_ERR[ch]) continue;
    if(HL_PAIRS[ch]){

      for(i = p; i < text.length; i++){

     （同文件、与着色层同源，杜绝另写一套判定而与之脱钩）。
   边界：半角逗号 `,`（U+002C）与顿号 `、` 不处理；跨行/未闭合引号不算台词区（随 hlDialogueMask 既有口径）。

/* ---- 接线：彩色层尺寸/滚动同步 + 状态栏 + 渲染（v7.15：按宿主寻址；缺省 = 弹窗宿主 hostPopup） ----
   宿主守卫：既有监听会把 hlSyncBox/hlRefresh 直接当事件处理器（收到 Event / ResizeObserver entries 等

/* 本模块对外面 = 被他模块引用的顶层名（P3 客观统计口径）

var blkCb = null;
/* v7.15：本模块（弹窗编辑器接线）**固定弹窗宿主 hostPopup**——openBlockEditor/closeBlockEditor/fitBlkWidth

function openBlockEditor(initial, cb){
  document.getElementById('blkInput').value = initial || '';

  cmplReset();     /* v7.8：清掉上一次的候选气泡与槽位状态 */

/* v6.14：编辑窗口宽度自适应最长字行（canvas 测量，复用 textWidth；上限 94vw，下限 560px） */
function fitBlkWidth(){

/* 本模块对外面 = 被他模块引用的顶层名（P3 客观统计口径） */
PHJ.blockEditor = { blkCb, closeBlockEditor, fitBlkWidth, openBlockEditor };

/* ==================== v7.8 结构层（节解析） ====================

     · 着色引擎（editor/highlight.js）保持「零领域语义」不变——它不认识任何内容含义，只认符号；
     · 领域语义**只活在本文的 STRUCT_MARKS 标记表里**（一行一条，可增减）。

     · 风格包 = `风格：` 起 → `硬性要求：` 止（其间 `^【属性名】` 行各自成标签）；
     · `镜头N` 在叙事区内 = 分镜；在起手式区（行首即镜头N）= 起手式的一部分（实测 22 条语料都是后者）。

  [/^画面开始/, '画面开始', 'mark'],
  [/^画面结束/, '画面结束', 'mark'],
  [/^风格[:：]/, '风格包', 'style'],
  [/^硬性要求[:：]/, '硬性要求', 'tail'],
  [/^【(.+?)】/, null, 'para'],
  [/^镜头\s*([1-9]\d*)(?!\d)/, null, 'shot']

function structLineMark(line){

  for(var i = 0; i < STRUCT_MARKS.length; i++){

/* 逐行解析：返回与 lines 等长的 [{region, label}]（region = 区，label = 给状态栏看的节名） */

        label = mk.name;
      }else if(mk.kind === 'shot'){
        /* 叙事区里的 镜头N = 分镜；起手式区的 镜头N = 起手式的一部分 */

      }else if(mk.kind === 'tail'){

      }else if(mk.kind === 'para'){

      else if(region === 'style'){ label = '风格包'; }
      else if(region === 'anchor'){ label = '起手式'; }
      else if(region === 'body'){ label = '叙事正文'; }

function structAt(text, caret){

/* 整篇结构摘要（供后续检查器/侧栏用；最小版只在状态栏用得上单点查询） */
function structSummary(text){

    k = map[i].label;
    if(!seen[k]){ seen[k] = { label: k, count: 0, region: map[i].region }; order.push(seen[k]); }
    seen[k].count++;
  }
  return order;

/* v7.16（A 条）：结构区豁免掩码——风格区(style)/硬性要求区(tail) 的字符 → 1，其余 → 0。

   行级 → 字符级的映射：与 hlToHTML 同源的索引推进法（idx += 行长 + 1，+1 为该行末尾 '\n'，归 body 段 → 不置 1）。

    if(reg === 'style' || reg === 'tail'){
      for(k = 0; k < lines[li].length; k++) m[idx + k] = 1;
    }
    idx += lines[li].length + 1;     /* +1 = 该行末尾的 '\n'（'body' 段，不置 1） */
  }
  return m;
}

   撞出第二个同 id 元素，`getElementById` 只认第一个 → 高亮 / 行号 / 状态栏 / 补全全部错位。

   · 解析惰性（首次 el(name) 才查询）、**按 root 作用域**（root.querySelector）、结果缓存；
   · `host.el(name)` name ∈ ta/pre/code/pop/copy/strip/stStruct/stLine/stCol/stLen/stErr；
   · 切视图 / DOM 重建后调 `host.inval()` 清缓存；
   · 弹窗宿主复用既有 id（不动既有 DOM）；`<pre class="blk-hl">` 原无 id → 用 root 作用域选择器解决；
   · 写作台宿主用独立 id 前缀 `wd*`，无 id 冲突。

   ================================================================= */

  var h = { id: id, rootId: rootId, _root: null, _cache: {} };
  h.root = function(){ return h._root || (h._root = document.getElementById(h.rootId)); };
  h.el = function(name){
    if(h._cache[name] !== undefined) return h._cache[name];
    var r = h.root();
    var el = r ? r.querySelector(map[name]) : null;
    h._cache[name] = el;
    return el;
  };
  h.inval = function(){ h._root = null; h._cache = {}; };   /* 切视图 / 重建后清缓存 */
  return h;
}

   初衷 ② 的原话：「不应该直接照搬数据，要从数据里研究规律」——体检把「从数据里学」变成**持续**的：
     · 检测 1 · 重复句：统计你反复手打的句子（跨块），提示「要不要收进片段库」；
     · 检测 2 · 风格包漂移：你的风格包又被手改出第几个变体了？提示与定型件对齐。
   ★入口形态：同一窗口内的视图切换（cmplCfgView ∈ {'lib','check'}），**不新开窗口**、不新增 keydown/blur。
   ★唯一动作：把重复句「收进片段库」（cmplSetItems + saveNow）。
   ★R1 接缝：定型件经 editor/complete.js 的 cmplStyleRef()（方案 i：单一皮肤读取缝）取得，本文件不直读 skin。 */
var CMPL_CHECK_MINLEN = 8;   /* 重复句判据：非空行 trim 后长度下限 */
var CMPL_CHECK_MINCNT = 2;   /* 重复句判据：跨块出现次数下限 */
function cmplCheckToggle(){

/* 检测 1：遍历非图片块 → 逐行 trim → 频次 ≥2 且 ∉ 当前片段库 body 集合 */
function cmplCheckDup(){
  var blocks = (state && Array.isArray(state.blocks)) ? state.blocks : [];
  var counts = {}, order = [], bi, li, lines, t, act = cmplActive(), ai, activeSet = {};
  for(ai = 0; ai < act.length; ai++) activeSet[String(act[ai].body == null ? '' : act[ai].body).trim()] = 1;
  for(bi = 0; bi < blocks.length; bi++){
    var b = blocks[bi]; if(!b || b.type === 'image') continue;
    lines = String(b.text == null ? '' : b.text).split('\n');
    for(li = 0; li < lines.length; li++){
      t = lines[li].trim();
      if(t.length < CMPL_CHECK_MINLEN) continue;
      if(!Object.prototype.hasOwnProperty.call(counts, t)){ counts[t] = 0; order.push(t); }
      counts[t]++;
    }
  }
  var out = [], oi;
  for(oi = 0; oi < order.length; oi++){
    if(counts[order[oi]] >= CMPL_CHECK_MINCNT && !activeSet[order[oi]]) out.push({ text: order[oi], count: counts[order[oi]] });
  }
  out.sort(function(a, b){
    if(b.count !== a.count) return b.count - a.count;
    if(b.text.length !== a.text.length) return b.text.length - a.text.length;
    return a.text < b.text ? -1 : (a.text > b.text ? 1 : 0);
  });
  return out;
}
/* 检测 2 辅助：取某块的「风格段」（从 风格: 行起，到 硬性要求: 行含 或 块尾） */
function cmplStyleSegment(text){
  var lines = String(text == null ? '' : text).split('\n'), start = -1, end = lines.length, i;
  for(i = 0; i < lines.length; i++){ if(/^风格[:：]/.test(lines[i].trim())){ start = i; break; } }
  if(start < 0) return '';
  for(i = start + 1; i < lines.length; i++){ if(/^硬性要求[:：]/.test(lines[i].trim())){ end = i + 1; break; } }
  return lines.slice(start, end).join('\n');
}
function cmplStyleNormLines(s){ return String(s == null ? '' : s).replace(/\r\n/g, '\n').split('\n'); }
function cmplStyleTrimBlank(lines){
  var a = 0, b = lines.length - 1;
  while(a <= b && lines[a].trim() === '') a++;
  while(b >= a && lines[b].trim() === '') b--;
  return lines.slice(a, b + 1);
}
function cmplStyleSame(a, b){
  return cmplStyleTrimBlank(cmplStyleNormLines(a)).join('\n') === cmplStyleTrimBlank(cmplStyleNormLines(b)).join('\n');
}
function cmplStyleDiff(st, ref){
  var A = cmplStyleTrimBlank(cmplStyleNormLines(ref)).filter(function(l){ return l.trim() !== ''; });
  var B = cmplStyleTrimBlank(cmplStyleNormLines(st)).filter(function(l){ return l.trim() !== ''; });
  var missing = [], extra = [], i;
  for(i = 0; i < A.length; i++) if(B.indexOf(A[i]) < 0) missing.push(A[i]);
  for(i = 0; i < B.length; i++) if(A.indexOf(B[i]) < 0) extra.push(B[i]);
  return { missing: missing, extra: extra };
}
/* 检测 2：遍历含 风格: 行的块 → 风格段与定型件逐字比对 → 报告不一致 + 差异摘要 */
function cmplCheckStyleDrift(){
  var blocks = (state && Array.isArray(state.blocks)) ? state.blocks : [];
  var ref = cmplStyleRef();
  var res = { total: 0, bad: 0, items: [] }, bi, b, text, st, sum;
  for(bi = 0; bi < blocks.length; bi++){
    b = blocks[bi]; if(!b || b.type === 'image') continue;
    text = String(b.text == null ? '' : b.text);
    if(!/^风格[:：]/m.test(text)) continue;
    res.total++;
    st = cmplStyleSegment(text);
    if(!cmplStyleSame(st, ref)){
      res.bad++;
      sum = '';
      var ls = text.split('\n'), j;
      for(j = 0; j < ls.length; j++){ if(ls[j].trim() !== ''){ sum = ls[j].trim(); break; } }
      res.items.push({ text: text, summary: sum.slice(0, 40), diff: cmplStyleDiff(st, ref) });
    }
  }
  return res;
}

  var label = '模板 ' + (i + 1);   /* P3 修复：v6.13 起模板已无 name 字段，原 t.name 恒为 undefined */
  state.templates.splice(i, 1);
  renderTplList();
  saveNow();
  toast('已删除模板：' + label, { label: '撤销', fn: function(){
    state.templates.splice(i, 0, t);
    renderTplList();
    saveNow();
    toast('已恢复模板：' + label);
  }});
}

/* ---- 命名模态框（v6：替代原生 prompt，headless/嵌入环境不可靠；v6.4 多字段通用版）
   v7.18：+ 可选 message（在表单顶部渲一句说明文字；供「删除项目」等确认框复用，避免原生 confirm） ---- */
var modalCb = null;
function openModal(title, fields, cb, message){
  document.getElementById('modalTitle').textContent = title;
  var body = document.getElementById('modalBody');
  body.innerHTML = '';
  if(message){
    var msg = document.createElement('div');
    msg.className = 'modal-msg';
    msg.textContent = message;
    body.appendChild(msg);
  }
  (fields || []).forEach(function(f){
    var row = document.createElement('div');
    row.className = 'modal-row';
    var lab = document.createElement('div');
    lab.className = 'modal-label';
    lab.textContent = f.label;
    var inp = document.createElement('input');
    inp.className = 'modal-input';
    inp.maxLength = f.maxLength || 60;
    inp.value = f.value || '';
    if(f.placeholder) inp.placeholder = f.placeholder;
    row.appendChild(lab);
    row.appendChild(inp);
    body.appendChild(row);
  });
  modalCb = cb;
  document.getElementById('modalMask').classList.remove('hide');
  var first = body.querySelector('.modal-input');
  if(first){ first.focus(); first.select(); }
}
function closeModal(){
  document.getElementById('modalMask').classList.add('hide');
  modalCb = null;
}
function toggleCollapsed(){

/* ==================== v7.18：多项目（项目菜单 / 切换 / 新建 / 重命名 / 删除） ====================
   复用 #ctxMenu（与「导」下拉同型）与 #modalMask（确认 / 命名）；**不新增窗骨架、不新增监听**。
   切换只渲染**当前活动视图**（单向，不成环）；绝不在隐藏态渲染画布（守需求② —— 设计 §5.2）。 */

/* 顶栏「项目」入口：列出全部项目（● = 当前，disabled）+ 新建 / 重命名 / 删除。 */
function openProjectMenu(x, y){
  var items = [], i;
  for(i = 0; i < state.projects.length; i++){
    var p = state.projects[i];
    var cur = (p.id === state.activeProject);
    items.push({ label: (cur ? '● ' : '○ ') + (p.title || '未命名项目'), act: 'proj-switch', projId: p.id, disabled: cur });
  }
  items.push('sep');
  items.push({ label: '＋ 新建项目', act: 'proj-new' });
  items.push({ label: '重命名当前项目', act: 'proj-rename' });
  items.push({ label: '删除当前项目', act: 'proj-del', danger: true });
  openCtxMenu(items, x, y);
}

/* 切到目标项目：写回当前槽（引用）→ 载入目标槽 → 只重渲染当前视图。 */
function switchProject(targetId){
  if(!state || !Array.isArray(state.projects)) return;
  if(targetId === state.activeProject) return;      /* 0 幂等 */
  if(!projectAt(targetId)) return;
  flush();                                           /* ① 立即落盘（清防抖，不丢字） */
  cmplUseInvalidate();                               /* ② 「未用过」缓存失效（编辑器文本将整体更换） */
  if(activeView === 'write'){ cmplReset(hostDesk); } /* ③ 收当前视图的临时层 */
  else{ closeBlockEditor(); }
  closeCtxMenu();
  syncActiveProject();                               /* ④ 写回当前项目槽（live → projects[active]） */
  loadProjectInto(targetId);                         /*    载入目标项目槽（activeProject=id; live ← 槽） */
  selected = [];                                     /* ⑤ 会话选中态跨项目无效 → 复位 */
  wdSelId = null;
  if(activeView === 'canvas'){ render(); }           /* ⑥ 只重渲染当前视图（隐藏的画布不渲染） */
  else{ renderWrite(); }
  applyView();                                       /* ⑦ 计数 / 高亮 / 显隐 */
  scheduleSave();                                    /* ⑧ 落盘 */
  toast('已切到项目「' + state.title + '」');
}

/* 新建项目默认名：扫描**现存**项目名里匹配 /^项目 (\d+)$/ 的最大号 + 1（无匹配则从 1）。
   用「现存最大号 +1」而非「项目数 +1」：既不跳号（已有「未命名分镜」→ 首次新建 =「项目 1」），
   也**绝不与现存重名**（删掉「项目 1」后若只剩「项目 2」→ 新号 = 3，不复用出与现存同名者）。 */
function nextProjectName(){
  var max = 0;
  for(var i = 0; i < state.projects.length; i++){
    var m = /^项目 (\d+)$/.exec(state.projects[i].title || '');
    if(m){ var n = parseInt(m[1], 10); if(n > max) max = n; }
  }
  return '项目 ' + (max + 1);
}

/* 新建项目：槽 + 顶层镜像（零块 → 真正「从零」；两视图各自显示空态引导）。 */
function newProject(){
  var def = nextProjectName();
  openModal('新建项目', [{ label: '项目名称', value: def }], function(vals){
    var name = (vals && vals[0] ? String(vals[0]).trim() : '') || def;
    var slot = newProjectSlot(name);
    flush();                                         /* 写回当前项目槽 */
    syncActiveProject();
    state.projects.push(slot);
    loadProjectInto(slot.id);                        /* 新项目为活动项目（空块） */
    selected = [];
    wdSelId = null;
    if(activeView === 'canvas'){ render(); } else{ renderWrite(); }
    applyView();
    scheduleSave();
    toast('已新建项目「' + state.title + '」');
  });
}

/* 重命名当前项目（空名回落「未命名项目」）。 */
function renameActiveProject(){
  var slot = projectAt(state.activeProject);
  if(!slot) return;
  openModal('重命名项目', [{ label: '项目名称', value: state.title }], function(vals){
    var name = (vals && vals[0] ? String(vals[0]).trim() : '');
    if(!name) name = '未命名项目';
    slot.title = name;
    state.title = name;
    applyView();   /* v7.20：重命名后两处项目身份显示（左栏头部 + 顶栏按钮）立即刷新（applyView 内含 projSyncIdentity） */
    saveNow();
    toast('已重命名项目「' + name + '」');
  });
}

/* 删除**当前**项目：唯一项目禁删；先确认 → 先切走再删 → toast 可撤销（插回原下标，**不自动激活**）。 */
function deleteProject(){
  if(!state || !Array.isArray(state.projects)) return;
  if(state.projects.length <= 1){ toast('至少保留一个项目'); return; }
  var slot = projectAt(state.activeProject);
  if(!slot) return;
  var idx = state.projects.indexOf(slot);
  openModal('删除项目', [], function(){
    var others = state.projects.filter(function(p){ return p.id !== slot.id; });
    if(!others.length) return;                       /* 双保险 */
    var next = others[Math.min(idx, others.length - 1)];
    switchProject(next.id);                          /* ★先切走（写回 + 载入），再删活动项目 */
    var at = state.projects.indexOf(slot);
    if(at < 0) return;
    state.projects.splice(at, 1);
    saveNow();
    toast('已删除项目「' + (slot.title || '未命名项目') + '」', { label: '撤销', fn: function(){
      state.projects.splice(idx, 0, slot);           /* 插回原下标；不自动激活（防视图跳变） */
      saveNow();
      toast('已恢复项目「' + (slot.title || '未命名项目') + '」');
    }});
  }, '该项目及其全部内容将从本机移除；可点提示上的「撤销」恢复。');
}

/* ---- 画布右键菜单（v5.2） ---- */
function addBlockHere(cx, cy){
  var c = document.getElementById('canvas');
  var cr = c.getBoundingClientRect();
  var n = state.blocks.length;
  var b = { id: uid(), text: '', tag: '初' };   /* v7.21：新块默认标签「初」 */
  b.x = (cx - cr.left - state.pan.x) / state.zoom - (MIN_BLOCK_W / 2) + ((n % 5) - 2) * 20;
  b.y = (cy - cr.top - state.pan.y) / state.zoom - 60 + ((n % 5) - 2) * 16;
  state.blocks.push(b);
  render();
  var cards = board.querySelectorAll('.block');
  var last = cards[cards.length - 1];
  var tx = last && last.querySelector('.block-text');
  popCard(last);   /* v7：创建弹入 */
  if(tx) focusCaretEnd(tx);
  saveNow();
}
var __ctxBlock = -1;
var __ctxX = 0, __ctxY = 0;   /* 右键触发位置（「在此处新增块」落点用） */
function openCtxMenu(items, x, y){
  var m = document.getElementById('ctxMenu');
  m.innerHTML = '';
  items.forEach(function(it){
    if(it === 'sep'){
      var s = document.createElement('div');
      s.className = 'ctx-sep';
      m.appendChild(s);
      return;
    }
    var b = document.createElement('div');
    b.className = 'ctx-item' + (it.danger ? ' danger' : '') + (it.disabled ? ' disabled' : '');
    b.textContent = it.label;
    b.dataset.act = it.act;
    if(it.projId) b.dataset.projId = it.projId;   /* v7.18：项目菜单项携带项目 id */
    m.appendChild(b);
  });
  m.classList.add('open');
  var r = m.getBoundingClientRect();
  m.style.left = Math.max(6, Math.min(x, window.innerWidth - r.width - 6)) + 'px';
  m.style.top = Math.max(6, Math.min(y, window.innerHeight - r.height - 6)) + 'px';
}
function closeCtxMenu(){
  document.getElementById('ctxMenu').classList.remove('open');
  __ctxBlock = -1;
}
document.addEventListener('contextmenu', function(e){
  if(!e.target.closest('.canvas')) return;   /* 仅画布区域接管右键 */
  var block = e.target.closest('.block');
  if(block && e.target.closest('.block-text')) return;   /* textarea 内保留浏览器原生菜单 */
  e.preventDefault();
  __ctxX = e.clientX;
  __ctxY = e.clientY;
  if(block){   /* 块上（把手/卡片区域） */
    var i = state.blocks.findIndex(function(b){ return b.id === block.dataset.id; });
    if(i < 0) return;
    __ctxBlock = i;
    /* v6.3：右键菜单不修改选择集——右键块在选中集内 → 菜单批量作用于选中集；否则菜单单块 */
    var multi = (selected.length > 1) && isSel(state.blocks[i].id);
    if(state.blocks[i].type === 'image'){   /* v6.16：图片块仅提供删除 */
      openCtxMenu([
        { label: multi ? ('删除（' + selected.length + ' 块）') : '删除', act: 'del-block', danger: true }
      ], e.clientX, e.clientY);
    }else{
    openCtxMenu([
      { label: multi ? ('拼入拼接（' + selected.length + ' 块）') : '拼入拼接', act: 'splice-block' },
      { label: multi ? ('复制（' + selected.length + ' 块）') : '复制', act: 'copy-block' },
      { label: multi ? ('克隆组（' + selected.length + ' 块）') : '克隆', act: 'clone-block' },
      { label: multi ? ('移除空行（' + selected.length + ' 块）') : '移除空行', act: 'strip-blank' },
      'sep',
      { label: multi ? ('删除（' + selected.length + ' 块）') : '删除', act: 'del-block', danger: true }
    ], e.clientX, e.clientY);
    }
  }else if(!block){   /* 画布空白：清空多选 */
    if(selected.length){ selected = []; refreshSel(); }
    openCtxMenu([
      { label: '在此处新增块', act: 'add-here' },
      'sep',
      { label: '复制拼接', act: 'copy-spliced', disabled: !countSpliced() },
      { label: '清空拼接', act: 'clear-spliced', disabled: !countSpliced() },
      'sep',
      { label: '导出 JSON', act: 'export' },
      { label: '导入 JSON', act: 'import' }
    ], e.clientX, e.clientY);
  }
});
document.addEventListener('click', function(e){
  var m = document.getElementById('ctxMenu');
  if(!m.classList.contains('open')) return;
  var item = e.target.closest('.ctx-item');
  if(!item){ closeCtxMenu(); return; }   /* 点菜单外关闭 */
  var act = item.dataset.act;
  var bi = __ctxBlock;   /* 先取块索引（closeCtxMenu 会重置） */
  var pid = item.dataset.projId;   /* v7.18：项目菜单项携带的项目 id（同样须在 close 前取） */
  closeCtxMenu();
  if(act === 'add-here'){ addBlockHere(__ctxX, __ctxY); }
  else if(act === 'copy-spliced'){ copySpliced(); }
  else if(act === 'clear-spliced'){ spliceClear(); toast('已清空拼接'); }
  else if(act === 'export'){ exportJSON(); }
  else if(act === 'import'){ document.getElementById('fileInput').click(); }
  else if(act === 'splice-block'){ bulkAction('splice', actIds(bi)); }
  else if(act === 'copy-block'){ bulkAction('copy', actIds(bi)); }
  else if(act === 'clone-block'){ bulkAction('clone', actIds(bi)); }
  else if(act === 'strip-blank'){ bulkAction('strip-blank', actIds(bi)); }
  else if(act === 'del-block'){ bulkAction('del', actIds(bi)); }
  /* v7.15：写作台条目右键菜单动作（复用同一 #ctxMenu；closeCtxMenu 已在上面调用） */
  else if(act === 'wd-del'){ wdDel(); }
  else if(act === 'wd-up'){ wdMove('up'); }
  else if(act === 'wd-down'){ wdMove('down'); }
  /* v7.18：项目菜单动作（复用同一 #ctxMenu） */
  else if(act === 'proj-switch'){ if(pid) switchProject(pid); }
  else if(act === 'proj-new'){ newProject(); }
  else if(act === 'proj-rename'){ renameActiveProject(); }
  else if(act === 'proj-del'){ deleteProject(); }
  __ctxBlock = -1;
});
