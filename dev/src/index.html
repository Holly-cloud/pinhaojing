<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拼好镜</title>
<link rel="stylesheet" href="./styles/00-base.css">
<link rel="stylesheet" href="./styles/10-canvas.css">
<link rel="stylesheet" href="./styles/20-menu.css">
<link rel="stylesheet" href="./styles/30-splice.css">
<link rel="stylesheet" href="./styles/40-window.css">
<link rel="stylesheet" href="./styles/50-editor.css">
<link rel="stylesheet" href="./styles/51-complete.css">
<link rel="stylesheet" href="./styles/52-library.css">
<link rel="stylesheet" href="./styles/90-effects.css">
</head>
<body>
<div class="topbar">
  <button class="btn primary" id="btnArrange" title="一键整理：所有块自上而下左对齐">整</button>
  <button class="btn" id="btnMenu" title="导入 / 导出">导</button>
  <!-- v7.8：补全配置入口（片段库：浏览 / 修改 / 新增） -->
  <button class="btn" id="btnCmpl" title="补全配置：浏览 / 修改 / 新增候选片段（编辑器里输入 # 触发）">补</button>
  <button class="btn" id="btnZoom" title="画布缩放：Ctrl+滚轮缩放 ｜ 点击恢复 100%">100%</button>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</div>
<div class="canvas" id="canvas"><div class="board" id="board"></div></div>
<!-- v6.16：拖手光点层（被遮挡块） + 拼接光线层 -->
<div id="peekLayer"></div>
<svg id="linkLayer" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="splice-panel" id="splicePanel">
  <div class="sp-head">
    <span class="sp-title" id="spTitle">拼接栏</span>
    <span class="sp-count" id="spCount">0</span>
    <button class="sp-fold" id="spFold" title="折叠 / 展开">⏷</button>
  </div>
  <div class="sp-body" id="spBody"></div>
  <div class="sp-foot">
    <div class="sp-foot-row">
      <button class="btn sp-splice" id="spSplice" title="拼模式：直接拖动任意提示词块到任意单元中（再按「拼」或 Esc 退出）">拼</button>
      <button class="btn primary sp-copy" id="spCopy">⧉ 复制拼接</button>
      <button class="sp-clear" id="spClear">清空</button>
    </div>
    <div class="sp-tpl">
      <div class="sp-tpl-bar">
        <button class="btn sp-tpl-save" id="spTplCustom">⚙ 模板定制</button>
        <button class="sp-tpl-fold" id="spTplFold">模板 ▾</button>
      </div>
      <div class="sp-tpl-list" id="spTplList"></div>
    </div>
  </div>
</div>
<div class="toast hide" id="toast"></div>
<div class="ctx-menu" id="ctxMenu"></div>
<div class="modal-mask hide" id="modalMask">
  <div class="modal">
    <div class="modal-title" id="modalTitle">模板</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalOk">确定</button>
    </div>
  </div>
</div>
<div class="modal-mask hide" id="tplMask">
  <div class="tpl-win" tabindex="-1">   <!-- v6.19：tabindex 使窗口可聚焦（打开即抢走画布焦点） -->
    <div class="tpl-head">
      <span class="tpl-title">模板定制</span>
      <select class="tpl-select" id="tplSelect" title="当前定制的模板"></select>
      <button class="btn primary tpl-new" id="tplNew" title="在当前模板下新建一个模板单元（前缀+提示词块+后缀）">＋ 新建单元</button>
    </div>
    <div class="tpl-body" id="tplBody"></div>
    <div class="tpl-foot">
      <button class="btn primary" id="tplDone">完成</button>
    </div>
  </div>
</div>
<!-- v6.18：模板预览窗口（只读） -->
<div class="modal-mask hide" id="tplPrevMask">
  <div class="tpl-win" tabindex="-1">   <!-- v6.19：tabindex 使窗口可聚焦（打开即抢走画布焦点） -->
    <div class="tpl-head">
      <span class="tpl-title" id="tplPrevTitle">模板预览</span>
      <button class="btn primary" id="tplPrevClose">完成</button>
    </div>
    <div class="tpl-body" id="tplPrevBody"></div>
  </div>
</div>
<!-- v6.12：提示词块独立编辑窗口（点击任意块弹出；风格统一）；v7.6：改造成 coding 编辑器（叠层高亮 + 行号 + 状态栏） -->
<div class="modal-mask hide" id="blkMask">
  <div class="blk-win">
    <div class="modal-title" id="blkTitle">编辑提示词块</div>
    <div class="blk-edit">
      <pre class="blk-hl" aria-hidden="true"><code id="blkHl"></code></pre>
      <textarea class="blk-input" id="blkInput" spellcheck="false" placeholder="输入提示词内容"></textarea>
      <!-- v7.8：候选气泡（结构感知补全；`#` 触发） -->
      <div class="cmpl-pop hide" id="cmplPop"></div>
      <div class="blk-status">
        <span class="grp struct" title="当前所在结构（由符号判定）">节 <b id="stStruct">—</b></span>
        <span class="grp">行 <b id="stLine">1</b>，列 <b id="stCol">1</b></span>
        <span class="grp">字符 <b id="stLen">0</b></span>
        <span class="grp err"><b id="stErr">0</b> 处错误符号</span>
        <span class="sp"></span>
        <span class="grp">UTF-8 · LF</span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="blkStrip" title="删除所有空行（每行文字紧挨）">移除空行</button>
      <button class="btn" id="blkCopy" title="把编辑器里的整段文本复制到剪贴板（Ctrl+Shift+C）">⧉ 复制全文</button>
      <div style="flex:1"></div>
      <button class="btn" id="blkCancel">取消</button>
      <button class="btn primary" id="blkOk">确定</button>
    </div>
  </div>
</div>

<!-- v7.8：补全配置窗口（片段库：浏览 / 修改 / 新增；数据随 导出 JSON 一起走） -->
<div class="modal-mask hide" id="cmplCfgMask">
  <div class="tpl-win" tabindex="-1">
    <div class="tpl-head">
      <span class="tpl-title">补全配置</span>
      <input class="cmpl-cfg-search" id="cmplCfgSearch" placeholder="搜索片段…" spellcheck="false">
      <button class="btn primary tpl-new" id="cmplCfgNew">＋ 新增片段</button>
    </div>
    <div class="tpl-body" id="cmplCfgBody"></div>
    <datalist id="cmplCfgGroupList"></datalist>
    <div class="tpl-foot cmpl-cfg-foot">
      <div class="cmpl-cfg-foot-l">
        <button class="btn" id="cmplCfgReset" title="丢弃内置示例上的改动并重注内置片段；保留你导入的资产与自建片段（先确认）">恢复内置默认</button>
      </div>
      <div class="cmpl-cfg-foot-r">
        <button class="btn" id="cmplCfgImport" title="从本机选择写作资产文件（.json）导入；不走网络">导入写作资产</button>
        <button class="btn" id="cmplCfgExport" title="把当前片段库导出为写作资产文件（.json，本机保存）">导出写作资产</button>
        <input type="file" id="cmplAssetInput" accept=".json,application/json" hidden>
        <button class="btn primary" id="cmplCfgDone">完成</button>
      </div>
    </div>
  </div>
  <!-- v7.8：拖动分组时，窗口左侧浮现的顺序小窗（拖到对应行即就位；放 mask 层避免窗口动画的 transform 影响 fixed 定位） -->
  <div class="cmpl-order-pop hide" id="cmplOrderPop"></div>
</div>

<script src="./js/00-header.js"></script>
<script src="./js/10-state.js"></script>
<script src="./js/15-clipboard.js"></script>
<script src="./js/20-render.js"></script>
<script src="./js/25-overlay.js"></script>
<script src="./js/30-selection.js"></script>
<script src="./js/35-splice.js"></script>
<script src="./js/40-template.js"></script>
<script src="./js/50-editor.js"></script>
<script src="./js/51-struct.js"></script>
<script src="./js/52-complete.js"></script>
<script src="./js/53-library.js"></script>
<script src="./js/55-menu.js"></script>
<script src="./js/60-keyboard.js"></script>
<script src="./js/62-block-size.js"></script>
<script src="./js/64-zoom.js"></script>
<script src="./js/66-pan.js"></script>
<script src="./js/68-drag.js"></script>
<script src="./js/90-boot.js"></script>
</body>
</html>
